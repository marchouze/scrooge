<!-- lockup-wordmark.svg — Hoz wordmark-only variant.
     Authority: D-BANK-NAME-SELECTION revised 2026-05-09 (Hoz);
     Linnea v1 brand package §2.1 (Direction A construction);
     Linnea v3 brand-application supplement §2.1 (lockup family).
     Use: header bars where the mark is decorative; long horizontal
     surfaces (email signature footer, spreadsheet cell). Min size: 96px
     wide. Clear-space: one x-height of "H" on all sides.
     Construction: Inter 700 at 48u; Slate ink #1F2A37 on Paper.
     Letter-spacing -0.5 for optical kerning at this size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 64" width="160" height="64" role="img" aria-label="Hoz">
  <text x="0" y="48"
        font-family="Inter, 'Inter Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="48" font-weight="700" fill="#1F2A37" letter-spacing="-0.5">Hoz</text>
</svg>
