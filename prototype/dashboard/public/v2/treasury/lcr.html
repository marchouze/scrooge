<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LCR — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
</head>
<body data-provenance-source="/api/v2/treasury/lcr">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <span data-provenance-badge="page-top"></span>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script src="/v2/_v2-data.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [
        { label: "Executive", href: "/v2/index.html" },
        { label: "Treasury", href: "/v2/treasury/index.html" },
        { label: "LCR" },
      ],
      title: "Liquidity Coverage Ratio (LCR)",
      seat: "HQLA / net 30-day outflows · Reg 26 · BCBS LCR · BA-300",
    });

    const stateHost = document.createElement("div"); main.appendChild(stateHost);
    const tilesHost = document.createElement("div"); main.appendChild(tilesHost);
    const formulaHost = document.createElement("div"); main.appendChild(formulaHost);
    const hqlaHost = document.createElement("div"); main.appendChild(hqlaHost);
    const outflowHost = document.createElement("div"); main.appendChild(outflowHost);
    const refsHost = document.createElement("div"); main.appendChild(refsHost);

    const metricHref = (key) => `/v2/treasury/liquidity-metric.html?surface=lcr&metric=${encodeURIComponent(key)}`;

    v2WireLoader(async () => {
      stateHost.replaceChildren(); tilesHost.replaceChildren();
      formulaHost.replaceChildren(); hqlaHost.replaceChildren();
      outflowHost.replaceChildren(); refsHost.replaceChildren();
      let d;
      try {
        d = await v2Fetch("/api/v2/treasury/lcr");
      } catch (err) {
        v2RenderError(stateHost, v2Esc(err.message));
        return;
      }
      document.getElementById("as-of").textContent = `as of ${new Date(d.asOf).toLocaleString()}`;

      if (d.dataState === "empty") {
        const banner = document.createElement("div");
        banner.className = "v2-section";
        banner.innerHTML = `
          <div class="v2-empty">
            <div class="v2-empty-icon">○</div>
            <div class="v2-empty-msg"><strong>No liquidity positions under this lens.</strong><br>${v2Esc(d.reason)}</div>
          </div>`;
        stateHost.appendChild(banner);
      }

      renderTileGroup(tilesHost, {
        tiles: d.tiles.map((t) => ({
          label: t.label,
          value: t.valueFmt,
          unit: t.unit,
          href: t.key === "lcr-minimum" ? undefined : metricHref(t.key),
        })),
      });

      // LCR formula block: HQLA / net 30-day outflows = ratio.
      renderFormula(formulaHost, {
        name: "LCR",
        numLabel: "Stock of HQLA (post-haircut)",
        denLabel: "Net cash outflows (30-day stress)",
        reference: "Reg 26 · BCBS LCR · BA-300",
      });
      const fvals = formulaHost.querySelectorAll(".v2-formula-value");
      if (fvals[0]) fvals[0].textContent = d.hqlaFmt;
      if (fvals[1]) fvals[1].textContent = d.netOutflowsFmt;
      const fres = formulaHost.querySelector(".v2-formula-result-value");
      if (fres) fres.textContent = d.lcrFmt;

      // Status line under the formula.
      const ctx = document.createElement("div"); ctx.className = "v2-section"; formulaHost.appendChild(ctx);
      renderTable(ctx, {
        columns: ["Measure", "Value"],
        rows: [
          { cells: ["LCR status", `<span class="v2-badge v2-badge-info">${v2Esc(d.status)}</span>`] },
          { cells: ["HQLA stock (post-haircut)", v2Esc(d.hqlaFmt)] },
          { cells: ["Net 30-day cash outflows", v2Esc(d.netOutflowsFmt)] },
          { cells: ["Functional currency", v2Esc(d.functionalCurrency)] },
          { cells: ["Entity (Reg 26 — bank licence)", v2Esc(d.entity)] },
        ],
      });

      // HQLA constituents.
      const hs = document.createElement("div"); hs.className = "v2-section"; hqlaHost.appendChild(hs);
      const hh = document.createElement("h2"); hh.className = "v2-section-title"; hh.textContent = "HQLA constituents"; hs.appendChild(hh);
      renderTable(hs, {
        columns: ["HQLA tier", "Amount"],
        emptyMsg: "No HQLA positions under this lens — no money-market HQLA events booked in the build phase.",
        rows: d.hqlaConstituents.map((r) => ({ cells: r.cells.map((c, i) => i === 1 ? `<strong>${v2Esc(c)}</strong>` : v2Esc(c)) })),
      });

      // Outflow constituents.
      const os = document.createElement("div"); os.className = "v2-section"; outflowHost.appendChild(os);
      const oh = document.createElement("h2"); oh.className = "v2-section-title"; oh.textContent = "Outflow / inflow constituents"; os.appendChild(oh);
      renderTable(os, {
        columns: ["Category", "Amount"],
        emptyMsg: "No funding / outflow positions under this lens — no money-market funding events booked in the build phase.",
        rows: d.outflowConstituents.map((r) => ({ cells: r.cells.map((c, i) => i === 1 ? `<strong>${v2Esc(c)}</strong>` : v2Esc(c)) })),
      });

      renderRefs(refsHost, {
        refs: [
          { label: "Regs Relating to Banks — Reg 26 (liquidity risk / LCR)", href: "/v2/compliance/reader.html?slug=regulations-relating-to-banks" },
          { label: "BCBS Basel III — LCR standard (Jan 2013)", href: "/v2/compliance/reader.html?slug=bcbs-basel-iii" },
          { label: "ALM positions (source snapshot)", href: "/v2/treasury/alm.html" },
          { label: "BA-300 liquidity return", href: "/v2/operations/schemas.html" },
        ],
      });
    });
  </script>
</body>
</html>
