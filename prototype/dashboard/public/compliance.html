<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compliance — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Compliance</h1></div>
    <div class="page-body">
      <div id="comp-tiles" class="tile-row"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Compliance" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      const [oblData, state] = await Promise.all([sf("/api/obligations"), sf("/api/state")]);
      const open = oblData?.statusCounts?.open ?? oblData?.count ?? 0;
      const overdue = oblData?.statusCounts?.overdue ?? 0;
      const policies = state?.policies?.length ?? 0;
      const alerts = state?.findings?.length ?? 0;
      const el = document.getElementById("comp-tiles");
      [
        SC.renderTile({ label:"Open Obligations", value:open, href:"/obligations.html", status:open>0?"warn":"ok" }),
        SC.renderTile({ label:"Overdue", value:overdue, href:"/obligations.html", status:overdue>0?"danger":"ok" }),
        SC.renderTile({ label:"Policies", value:policies, href:"/policies.html", status:"info" }),
        SC.renderTile({ label:"Vera Alerts", value:alerts, href:"/audit.html", status:alerts>0?"warn":"ok" }),
      ].forEach(t => el.appendChild(t));
    })();
  </script>
</body>
</html>
