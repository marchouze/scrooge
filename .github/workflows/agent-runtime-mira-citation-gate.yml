# Mira — citation gate (on-request)
#
# On-request runtime handler shape for the citation gate. Closes Atlas
# substrate-gap #6: the gate previously ran only as a separate
# `bun run citation-gate` script invoked from CI; this is the agent shape
# so it can be dispatched from a workflow_dispatch (no schedule) when
# Marc, an automation, or another workflow wants to verify citation
# discipline now.
#
# This is the first on-request agent workflow — no `schedule:` block,
# only `workflow_dispatch:`.

name: Mira citation gate

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        run: bun run agent:mira-citation-gate
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "mira-agent[bot]"
          git config user.email "agent-mira@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Mira — citation gate ${DATE} (on-request)

          Generated by .github/workflows/agent-runtime-mira-citation-gate.yml.
          Per CLAUDE.md Principle 2 (every action carries a citation).

          Co-Authored-By: Mira (agent) <agent-mira@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
