<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party Registry — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Party Registry</h1></div>
    <div class="page-body">
      <div id="party-tiles" class="tile-row"></div>
      <div id="party-tabs" class="tab-bar"></div>
      <div id="party-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Party Registry" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      document.getElementById("party-table").innerHTML = SC.renderSkeleton(6);
      const [partyData, relsData] = await Promise.all([sf("/api/party"), sf("/api/party/relationships")]);
      const all = Array.isArray(partyData) ? partyData : (partyData?.parties ?? partyData?.items ?? []);
      const rels = Array.isArray(relsData) ? relsData : (relsData?.relationships ?? relsData?.items ?? []);
      const counts = partyData?.counts ?? {};
      const kinds = ["All","natural-person","legal-entity","counterparty","agent"];
      const tilesEl = document.getElementById("party-tiles");
      tilesEl.appendChild(SC.renderTile({ label:"Total Parties", value: counts.total ?? all.length, status:"info" }));
      ["natural-person","legal-entity","counterparty","agent"].forEach(k => {
        tilesEl.appendChild(SC.renderTile({ label:k, value: counts[k] ?? all.filter(p => p.partyKind === k).length }));
      });
      let kindFilter = "All";
      const tabsEl = document.getElementById("party-tabs");
      function render() {
        const rows = kindFilter === "All" ? all : all.filter(p => p.partyKind === kindFilter);
        SC.renderTable({
          container: document.getElementById("party-table"),
          headers: ["ID","Name","Kind","LEI / ID","Status"],
          rows: rows.map(p => ({
            cells: [SC.esc(p.partyId||p.id||""), SC.esc(p.name||p.legalName||""), SC.renderBadge(p.partyKind||""), SC.esc(p.lei||p.nationalId||p.identifier||""), SC.renderBadge(p.status||"active")],
            data: p,
          })),
          onRowClick: p => {
            const related = rels.filter(r => r.fromPartyId===p.partyId||r.toPartyId===p.partyId||r.fromId===p.id||r.toId===p.id);
            const relHtml = related.length ? `<h3 style="margin:var(--space-4) 0 var(--space-2);font:var(--text-h3)">Relationships</h3>${SC.renderDefList(related)}` : "";
            SC.openModal({ title: p.name||p.legalName||"Party", body: SC.renderDefList(p) + relHtml });
          },
          emptyMessage: "No parties",
        });
      }
      tabsEl.innerHTML = kinds.map(k => `<button class="tab-btn${k===kindFilter?" active":""}" data-k="${k}">${k}</button>`).join("");
      tabsEl.addEventListener("click", e => { const b = e.target.closest(".tab-btn"); if (!b) return; kindFilter=b.dataset.k; tabsEl.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active",x.dataset.k===kindFilter)); render(); });
      render();
    })();
  </script>
</body>
</html>
