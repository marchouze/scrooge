# Ravi — daily ALM readiness (autonomous run)
#
# Daily ALM-readiness attestation per Ravi's operating spec § 6 (Cadence).
# Engineer-side counterpart to Eitan's `LiquiditySnapshot` — closes the
# read-side ↔ build-side loop on the ALM-projection substrate (LCR / NSFR /
# IRRBB / FX / FTP / collateral / SAMOS funding).
# Per CLAUDE.md Principle 7 (Autonomous by default).
#
# Seventeenth handler in the fleet-rollout sequence under
# D-FLEET-ROLLOUT-SEQUENCING.

name: Ravi ALM readiness

on:
  schedule:
    # 05:37 UTC daily — off-the-hour, between Devon Mon and Zara Mon's
    # weekly slots; avoids the on-the-hour GH Actions cron drops.
    - cron: "37 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          # Optional. Ravi narrative; graceful no-op if unset.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:ravi-alm-readiness
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "ravi-agent[bot]"
          git config user.email "agent-ravi@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Ravi — ALM readiness ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-ravi-alm-readiness.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).
          Fleet-rollout under D-FLEET-ROLLOUT-SEQUENCING.

          Co-Authored-By: Ravi (agent) <agent-ravi@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
