# Vera — codebase quality review (autonomous run)
#
# Weekly (Saturday 03:23 UTC) deterministic codebase-quality recons over
# prototype/. Distinct from `vera-overnight-recon` (which runs the
# continuous-controls reconciliation pipelines).
#
# Authority:
#   - GOV-FRAMEWORK-CAE-INDEPENDENCE — Vera's mandate authority
#   - D-AGENT-RUNTIME-AUTHORIZE       — S8 / fleet-rollout slice
#
# Outputs:
#   - <date>_vera_codebase-quality-review.md committed to /Owner Inbox/.
#   - AuditFinding events appended to the local event store (.local/event.db
#     is gitignored; the cloud-lift M8 will swap in a shared substrate).
#
# Workflow_dispatch is wired so Marc / on-call can trigger an out-of-band
# run without waiting for the schedule.

name: Vera codebase quality review

on:
  workflow_dispatch: {}

permissions:
  contents: write

# Per-workflow concurrency. See feedback_github_actions_concurrency.md —
# shared groups have effective queue depth 1 and cancel queued runs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: prototype
        run: bun install --frozen-lockfile

      - name: Sync event store from Neon (pre-run)
        working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync

      - name: Run Vera codebase quality review
        working-directory: prototype
        run: bun run agent:vera-codebase-quality-review

      - name: Sync event store to Neon (post-run)
        working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync

      - name: Commit deliverable
        run: |
          git config user.name "vera-agent[bot]"
          git config user.email "agent-vera@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit; Vera's codebase-quality run produced no deliverable diff."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Vera — codebase quality review ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-vera-codebase-quality-review.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).

          Co-Authored-By: Vera (agent) <agent-vera@scrooge.local>"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "push rejected (attempt $i); rebasing and retrying"
            git pull --rebase --autostash origin main
          done
