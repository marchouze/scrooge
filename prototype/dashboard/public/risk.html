<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risk — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header">
      <h1 class="page-title">Risk</h1>
    </div>
    <div class="page-body">
      <div id="ras-header"></div>
      <div id="ras-tiles" class="tile-row"></div>
      <div id="stress-header"></div>
      <div id="stress-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Risk" });
    (async () => {
      async function sf(u) {
        try { const r = await fetch(u, { headers: { Accept: "application/json" } }); return r.ok ? r.json() : null; } catch { return null; }
      }
      const [rasData, stressData] = await Promise.all([sf("/api/risk/ras"), sf("/api/risk/stress")]);

      // RAS clusters
      document.getElementById("ras-header").innerHTML = SC.renderSectionHeader("RAS Clusters (B1–B5)", null);
      const clusters = Array.isArray(rasData) ? rasData : (rasData?.clusters ?? rasData?.items ?? []);
      const tilesEl = document.getElementById("ras-tiles");
      if (clusters.length === 0) {
        tilesEl.innerHTML = `<p style="color:var(--color-text-secondary)">No RAS data available.</p>`;
      } else {
        clusters.forEach(c => {
          const status = c.breachStatus === "ok" ? "ok" : c.breachStatus === "warn" ? "warn" : c.breachStatus ? "danger" : null;
          const t = SC.renderTile({
            label: c.clusterId || c.id || "",
            value: c.current != null ? SC.fmt(c.current) : (c.status || "—"),
            sub: c.limit != null ? `limit: ${SC.fmt(c.limit)}` : (c.title || ""),
            status,
            onClick: () => SC.openModal({ title: c.title || c.clusterId || "Cluster", body: SC.renderDefList(c) }),
          });
          tilesEl.appendChild(t);
        });
      }

      // Stress scenarios
      document.getElementById("stress-header").innerHTML = SC.renderSectionHeader("Stress Scenarios", null);
      const scenarios = Array.isArray(stressData) ? stressData : (stressData?.scenarios ?? stressData?.results ?? stressData?.items ?? []);
      SC.renderTable({
        container: document.getElementById("stress-table"),
        headers: ["Scenario", "Metric", "Result", "Status"],
        rows: scenarios.map(s => ({
          cells: [SC.esc(s.name || s.scenario || ""), SC.esc(s.metric || ""), SC.esc(SC.fmt(s.result ?? s.value)), SC.renderBadge(s.status || s.outcome || "info")],
          data: s,
        })),
        onRowClick: s => SC.openModal({ title: s.name || s.scenario || "Scenario", body: SC.renderDefList(s) }),
        emptyMessage: "No stress scenario data",
      });
    })();
  </script>
</body>
</html>
