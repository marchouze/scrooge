<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seeds — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" data-provenance-source="/api/seeds" aria-label="Provenance badge"></span>
    <div class="page-header">
      <h1 class="page-title">Boot Seeds</h1>
      <p style="font:var(--text-body);color:var(--color-text-secondary);margin:var(--space-1) 0 0">
        Every build-phase boot seed is listed here with the events it emits. A descopable seed can be
        <strong>descoped</strong> (skipped at next boot) or <strong>replaced</strong> with author-driven
        simulated events. Descope takes effect at the next server boot. Trusted-Figures Program
        (D-TRUSTED-FIGURES-PROGRAM-V1).
      </p>
    </div>
    <div class="page-body">
      <div id="seed-tiles" style="display:flex;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)"></div>
      <div id="seed-cards"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>initShell({ title: "Seeds" });</script>
  <script src="/seeds.js"></script>
</body>
</html>
