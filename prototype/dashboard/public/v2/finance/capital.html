<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Capital Adequacy — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html" title="Errors &amp; recon violations">
        <span class="v2-errors-icon">⚠</span>
        <span class="v2-errors-count" id="errors-count">…</span>
      </a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [{ label: "Executive", href: "/v2/index.html" }, { label: "Finance", href: "/v2/finance/index.html" }, { label: "Capital Adequacy" }],
      title: "Capital Adequacy",
      seat: "BA-700",
    });

    renderTileGroup(main, {
      tiles: [
        { label: "CET-1 Ratio", unit: "CET-1 Capital / RWA" },
        { label: "Total Capital Ratio", unit: "Total Capital / RWA" },
        { label: "CET-1 Capital", unit: "ZAR" },
        { label: "Risk-Weighted Assets", unit: "ZAR" },
      ],
    });

    renderFormula(main, {
      name: "CET-1 Ratio",
      numLabel: "CET-1 Capital (ACC-5000)",
      denLabel: "Risk-Weighted Assets",
      resultLabel: "CET-1 Ratio",
      reference: "BA-700 Part B; Reg 38(1)(a)",
    });

    const s = document.createElement("div"); s.className = "v2-section"; main.appendChild(s);
    const h = document.createElement("h2"); h.className = "v2-section-title"; h.textContent = "CET-1 Capital Components"; s.appendChild(h);
    renderTable(s, { columns: ["Account", "Description", "Amount (ZAR)", "Source Event"] });

    const s2 = document.createElement("div"); s2.className = "v2-section"; main.appendChild(s2);
    const h2 = document.createElement("h2"); h2.className = "v2-section-title"; h2.textContent = "Risk-Weighted Assets Breakdown"; s2.appendChild(h2);
    renderTable(s2, { columns: ["Asset Class", "Exposure (ZAR)", "RW%", "RWA (ZAR)", "Methodology"] });

    renderRefs(main, {
      refs: [
        { label: "Banks Act Reg 38 — Minimum Capital Requirements", href: "#" },
        { label: "BA-700 Capital Adequacy Return", href: "#" },
        { label: "BCBS Basel III Capital Framework", href: "#" },
        { label: "D-V2-CORE-MONEY-DECIMAL-NATIVE", href: "#" },
      ],
    });
  </script>
</body>
</html>
