# Scrooge — inbox hygiene (autonomous run)
#
# Daily inbox-hygiene sweep per Scrooge's operating spec § Cadence and the
# standing rule at memory:feedback_team_inbox_hygiene.md. Auto-moves
# completed Team Inbox briefs to /Team Inbox/actioned/ when a clear
# Owner Inbox match exists. Per CLAUDE.md Principle 7.

name: Scrooge inbox hygiene

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: agent-autocommit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        run: bun run agent:scrooge-inbox-hygiene
      - run: |
          git config user.name "scrooge-agent[bot]"
          git config user.email "agent-scrooge@scrooge.local"
          git pull --rebase origin main
          # Stage both Owner Inbox (deliverable) and Team Inbox (any moves).
          git add "Owner Inbox/" "Team Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Scrooge — inbox hygiene ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-scrooge-inbox-hygiene.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).

          Co-Authored-By: Scrooge (agent) <agent-scrooge@scrooge.local>"
          git push
