# Bea — daily accounting readiness (autonomous run)
#
# Daily accounting-readiness attestation per Bea's operating spec § 6 (Cadence).
# Engineer-side counterpart to Camille's FinancialPositionSnapshot — closes the
# read-side ↔ build-side loop on the close / BA-return / AFS substrate.
# Per CLAUDE.md Principle 7 (Autonomous by default).
#
# Eleventh handler in the fleet-rollout sequence under D-FLEET-ROLLOUT-SEQUENCING
# (approved 2026-05-08).

name: Bea accounting readiness

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:bea-accounting-readiness
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "bea-agent[bot]"
          git config user.email "agent-bea@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Bea — daily accounting readiness ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-bea-accounting-readiness.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).
          Fleet-rollout under D-FLEET-ROLLOUT-SEQUENCING.

          Co-Authored-By: Bea (agent) <agent-bea@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
