<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Instrument Detail — Scrooge V2</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Scrooge Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    renderPageHeader(main, {
      crumbs: [
        { label: "Executive", href: "/v2/index.html" },
        { label: "Markets", href: "/v2/markets/index.html" },
        { label: "FIL Positions", href: "/v2/markets/positions.html" },
        { label: id ? id : "Instrument Detail" },
      ],
      title: id ? `Instrument: ${id}` : "Instrument Detail",
    });

    if (!id) {
      const empty = document.createElement("div");
      empty.className = "v2-empty";
      empty.innerHTML = `<div class="v2-empty-icon">⊙</div><div class="v2-empty-msg">No instrument selected — choose from <a href="/v2/markets/positions.html">FIL Positions</a>.</div>`;
      main.appendChild(empty);
    } else {
      renderTileGroup(main, {
        tiles: [
          { label: "Stage", unit: "active / proposed / terminated" },
          { label: "Asset Class", unit: "FX · IR" },
          { label: "Notional", unit: "ZAR" },
          { label: "Settlement Date", unit: "Date" },
        ],
      });
      const s = document.createElement("div"); s.className = "v2-section"; main.appendChild(s);
      const h = document.createElement("h2"); h.className = "v2-section-title"; h.textContent = "Economic Terms"; s.appendChild(h);
      renderTable(s, { columns: ["Field", "Value", "Unit", "Source"] });
      const s2 = document.createElement("div"); s2.className = "v2-section"; main.appendChild(s2);
      const h2 = document.createElement("h2"); h2.className = "v2-section-title"; h2.textContent = "Valuation"; s2.appendChild(h2);
      renderTable(s2, { columns: ["Metric", "Value", "Method", "As Of"] });
      const s3 = document.createElement("div"); s3.className = "v2-section"; main.appendChild(s3);
      const h3 = document.createElement("h2"); h3.className = "v2-section-title"; h3.textContent = "Event History"; s3.appendChild(h3);
      renderTable(s3, { columns: ["Event Type", "Timestamp", "Payload Summary"] });
    }
  </script>
</body>
</html>
