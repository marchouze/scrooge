<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Regulation Reader — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <style>
    .rd-toolbar { display:flex; gap:var(--space-3); align-items:center; flex-wrap:wrap; margin-bottom:var(--space-4); }
    .rd-toolbar input { flex:1; min-width:180px; max-width:320px; padding:6px 10px;
      border:1px solid var(--color-border); border-radius:var(--radius-sm);
      background:var(--color-surface); color:var(--color-text-primary); font:var(--text-body); }
    .rd-toggle { display:inline-flex; align-items:center; gap:6px; font:var(--text-caption);
      color:var(--color-text-secondary); cursor:pointer; user-select:none; }
    .rd-chapter-h { font:var(--text-h3); color:var(--color-text-secondary); text-transform:uppercase;
      letter-spacing:0.05em; margin:var(--space-6) 0 var(--space-3); padding-bottom:var(--space-2);
      border-bottom:1px solid var(--color-border); }
    .rd-section { padding:var(--space-4); border:1px solid var(--color-border); border-radius:var(--radius-lg);
      background:var(--color-surface); margin-bottom:var(--space-3); }
    .rd-section:target, .rd-section.rd-flash { border-color:var(--color-accent); background:var(--color-accent-bg); }
    /* Sections that give rise to obligations: highlighted + two-column —
       verbatim text left, obligation tile(s) on the RHS aligned to the block. */
    .rd-section.rd-has-obls { border-left:3px solid var(--color-accent); display:grid;
      grid-template-columns:1fr 300px; gap:var(--space-4); align-items:start; }
    .rd-section-hd { display:flex; gap:var(--space-2); align-items:baseline; margin-bottom:var(--space-2); }
    .rd-section-num { font-weight:700; color:var(--color-accent); }
    .rd-section-heading { font-weight:600; color:var(--color-text-primary); }
    .rd-text { color:var(--color-text-primary); line-height:1.65; white-space:pre-wrap; font:var(--text-body); margin:0 0 var(--space-2); }
    .rd-text:last-child { margin-bottom:0; }
    /* Markdown subregulation headings parsed out of the verbatim blob
       (`#### Subregulation (7)`). Emphasised, smaller than the section heading,
       with clear vertical rhythm — NOT raw hashes. Levels 1–6 step the size. */
    .rd-subheading { font-weight:700; color:var(--color-text-primary); line-height:1.35;
      margin:var(--space-3) 0 var(--space-2); letter-spacing:0.01em; }
    .rd-subheading:first-child { margin-top:0; }
    .rd-subheading--l1, .rd-subheading--l2 { font-size:1.05em; color:var(--color-text-primary); }
    .rd-subheading--l3, .rd-subheading--l4 { font-size:0.95em; color:var(--color-text-secondary);
      text-transform:uppercase; letter-spacing:0.04em; }
    .rd-subheading--l5, .rd-subheading--l6 { font-size:0.88em; color:var(--color-text-secondary); font-weight:600; }
    .rd-table-wrap { overflow-x:auto; margin:var(--space-3) 0; }
    .rd-table { border-collapse:collapse; width:100%; font:var(--text-caption); }
    .rd-table th, .rd-table td { border:1px solid var(--color-border); padding:4px 8px;
      text-align:left; vertical-align:top; white-space:pre-wrap; color:var(--color-text-primary); }
    .rd-table th { background:var(--color-surface-raised); font-weight:600;
      color:var(--color-text-secondary); position:sticky; top:0; }
    .rd-table tbody tr:nth-child(even) td { background:var(--color-bg); }
    /* Outline / contents panel */
    .rd-shell { display:grid; grid-template-columns:240px 1fr; gap:var(--space-5); align-items:start; }
    .rd-outline { position:sticky; top:var(--space-3); max-height:calc(100vh - 120px); overflow-y:auto;
      border:1px solid var(--color-border); border-radius:var(--radius-lg); background:var(--color-surface);
      padding:var(--space-3); }
    .rd-outline-h { font:var(--text-caption); font-weight:700; text-transform:uppercase;
      letter-spacing:0.06em; color:var(--color-text-secondary); margin:0 0 var(--space-2); }
    .rd-outline-ch { font:var(--text-caption); font-weight:700; color:var(--color-text-secondary);
      text-transform:uppercase; letter-spacing:0.04em; margin:var(--space-3) 0 4px; }
    .rd-outline-ch:first-of-type { margin-top:0; }
    .rd-outline-link { display:block; font:var(--text-caption); color:var(--color-text-primary);
      text-decoration:none; padding:3px 6px; border-radius:var(--radius-sm); line-height:1.4; }
    .rd-outline-link:hover { background:var(--color-accent-bg); color:var(--color-accent); }
    .rd-outline-link.rd-outline-active { background:var(--color-accent-bg); color:var(--color-accent); font-weight:600; }
    .rd-outline-link[hidden] { display:none; }
    html { scroll-behavior:smooth; }
    @media (max-width:900px){
      .rd-shell { grid-template-columns:1fr; }
      .rd-outline { position:static; max-height:none; margin-bottom:var(--space-3); }
    }
    .rd-sub { display:flex; gap:var(--space-3); margin-top:var(--space-2); line-height:1.6; }
    .rd-sub-num { flex-shrink:0; min-width:36px; color:var(--color-accent); font-weight:600; font-variant-numeric:tabular-nums; }
    .rd-sub-text { color:var(--color-text-primary); white-space:pre-wrap; }
    .rd-provenance { margin:var(--space-3) 0 0; }
    .rd-source-pdf { display:inline-flex; align-items:center; gap:6px; font:var(--text-caption);
      font-weight:600; color:var(--color-accent); text-decoration:none;
      border:1px solid var(--color-border); border-radius:var(--radius-sm);
      padding:4px 10px; background:var(--color-bg); }
    .rd-source-pdf:hover { border-color:var(--color-accent); }
    .rd-excerpt { margin:var(--space-3) 0; }
    .rd-excerpt img { max-width:100%; border:1px solid var(--color-border); border-radius:var(--radius-sm); }
    .rd-excerpt figcaption { font:var(--text-caption); color:var(--color-text-secondary); margin-top:4px; }
    .rd-footnotes { margin-top:var(--space-3); padding-top:var(--space-2); border-top:1px dotted var(--color-border); }
    .rd-fn { display:flex; gap:var(--space-2); font:var(--text-caption); color:var(--color-text-secondary); margin-top:4px; line-height:1.5; }
    .rd-fn-m { flex-shrink:0; min-width:18px; font-weight:700; color:var(--color-accent); }
    .rd-aside { border-left:1px solid var(--color-border); padding-left:var(--space-4); }
    .rd-obls-lbl { font-size:0.7em; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
      color:var(--color-accent); margin-bottom:var(--space-2); }
    .rd-tile { display:block; padding:var(--space-3); border:1px solid var(--color-border); border-radius:var(--radius-sm);
      background:var(--color-bg); margin-bottom:var(--space-2); text-decoration:none; }
    .rd-tile:hover { border-color:var(--color-accent); }
    .rd-tile-id { font-weight:700; font-family:ui-monospace,monospace; color:var(--color-accent); font-size:0.85em; }
    .rd-tile-title { color:var(--color-text-primary); margin:3px 0; font-size:0.92em; }
    .rd-tile-meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px; }
    .rd-obl-meta { color:var(--color-text-secondary); font-size:0.8em; }
    .v2-chip { display:inline-flex; align-items:center; padding:1px 8px; border-radius:10px; font-size:0.76em; font-weight:600; }
    .v2-chip--applies { background:var(--color-success-bg); color:var(--color-success); }
    .v2-chip--partially-applies { background:var(--color-warning-bg); color:var(--color-warning); }
    .v2-chip--does-not-apply { background:var(--color-surface-raised); color:var(--color-text-secondary); }
    .v2-chip--na { background:var(--color-surface-raised); color:var(--color-text-disabled); }
    .v2-chip--status { background:var(--color-info-bg); color:var(--color-info); }
    .rd-completeness-badge { display:inline-flex; align-items:center; margin-bottom:var(--space-2);
      padding:1px 8px; border-radius:10px; font-size:0.72em; font-weight:600; letter-spacing:0.02em;
      background:var(--color-warning-bg); color:var(--color-warning); }
    body.rd-hide-obls .rd-section.rd-has-obls { display:block; border-left:1px solid var(--color-border); }
    body.rd-hide-obls .rd-aside { display:none; }
    @media (max-width:1000px){ .rd-section.rd-has-obls { display:block; }
      .rd-aside { border-left:none; border-top:1px dashed var(--color-border); padding-left:0;
        padding-top:var(--space-3); margin-top:var(--space-3); } }
  </style>
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script src="/v2/_v2-data.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    const slug = new URLSearchParams(location.search).get("slug");

    if (!slug) {
      renderPageHeader(main, {
        crumbs: [{ label: "Executive", href: "/v2/index.html" }, { label: "Compliance", href: "/v2/compliance/index.html" }, { label: "Regulations", href: "/v2/compliance/regulations.html" }, { label: "Reader" }],
        title: "Regulation Reader",
      });
      const e = document.createElement("div"); e.className = "v2-empty";
      e.innerHTML = `<div class="v2-empty-icon">⊙</div><div class="v2-empty-msg">No regulation selected — choose one from the <a href="/v2/compliance/regulations.html">Regulations register</a>.</div>`;
      main.appendChild(e);
    } else {
      const chip = (v) => v ? `<span class="v2-chip v2-chip--${v}">${v2Esc(v)}</span>` : `<span class="v2-chip v2-chip--na">unassessed</span>`;
      // Stable, collision-resistant DOM id for a section anchor (outline target).
      const slugifyPart = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      const sectionId = (sl, num, idx) => `sec-${slugifyPart(sl)}-${slugifyPart(num) || ("n" + idx)}`;
      // Render server-parsed verbatim blocks. Tables → real <table> with EVERY
      // cell escaped (XSS-safe — never raw innerHTML of source); paragraphs →
      // escaped <p>. Falls back to the raw escaped text when blocks are absent.
      const renderBlocks = (s) => {
        const blocks = Array.isArray(s.blocks) ? s.blocks : null;
        if (!blocks || blocks.length === 0) {
          return s.text ? `<div class="rd-text">${v2Esc(s.text)}</div>` : "";
        }
        return blocks.map((b) => {
          if (b.kind === "table") {
            const thead = `<thead><tr>${(b.headers || []).map((h) => `<th>${v2Esc(h)}</th>`).join("")}</tr></thead>`;
            const tbody = `<tbody>${(b.rows || []).map((r) => `<tr>${(r || []).map((c) => `<td>${v2Esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>`;
            return `<div class="rd-table-wrap"><table class="rd-table">${thead}${tbody}</table></div>`;
          }
          if (b.kind === "heading") {
            // Markdown ATX heading (e.g. `#### Subregulation (7)`) → a styled
            // nested subheading, NOT raw hashes. Clamp level to 1–6 and render
            // it below the section heading depth. Text is escaped (XSS-safe).
            const lvl = Math.min(6, Math.max(1, Number(b.level) || 4));
            return `<div class="rd-subheading rd-subheading--l${lvl}">${v2Esc(b.text || "")}</div>`;
          }
          return `<p class="rd-text">${v2Esc(b.text || "")}</p>`;
        }).join("");
      };
      v2WireLoader(async () => {
        main.innerHTML = "";
        let d;
        try { d = await v2Fetch(`/api/v2/regulations/${encodeURIComponent(slug)}`); }
        catch (e) {
          renderPageHeader(main, { crumbs: [{ label: "Compliance", href: "/v2/compliance/index.html" }, { label: "Regulations", href: "/v2/compliance/regulations.html" }, { label: slug }], title: "Regulation Reader" });
          v2RenderError(main, String(e.message || e)); return;
        }
        renderPageHeader(main, {
          crumbs: [{ label: "Executive", href: "/v2/index.html" }, { label: "Compliance", href: "/v2/compliance/index.html" }, { label: "Regulations", href: "/v2/compliance/regulations.html" }, { label: d.shortTitle || d.slug }],
          title: d.title,
        });
        renderTileGroup(main, { tiles: [
          { label: "Regulator", value: v2Esc(d.regulator || "—") },
          { label: "Year", value: String(d.year || "—") },
          { label: "Bank obligations", value: String(d.bankObligations ?? 0), unit: "Identified from this reg", variant: d.bankObligations ? "success" : "" },
        ]});

        // Golden-source PDF provenance download (additional affordance only —
        // the structured tree below remains the default/canonical render per
        // D-REGULATORY-STRUCTURED-FIRST-CANONICAL). Rendered ONLY when the
        // source carries a goldenSourceHash; hand-authored no-hash sources
        // (popia, fic-act) render nothing — no broken link.
        if (d.goldenSourceHash) {
          const prov = document.createElement("div");
          prov.className = "rd-provenance";
          prov.innerHTML = `<a class="rd-source-pdf" href="/api/regulation-reader/${encodeURIComponent(d.slug)}/source-pdf" download>↓ Source PDF (provenance)</a>`;
          main.appendChild(prov);
        }

        const toolbar = document.createElement("div"); toolbar.className = "rd-toolbar";
        toolbar.innerHTML = `
          <input type="search" id="q" placeholder="Search sections…" aria-label="Search sections">
          <label class="rd-toggle"><input type="checkbox" id="showObls" checked> Show obligation summary</label>`;
        main.appendChild(toolbar);

        // Two-pane shell: outline (left) + scrollable document (right).
        const shell = document.createElement("div"); shell.className = "rd-shell";
        const outline = document.createElement("nav"); outline.className = "rd-outline"; outline.setAttribute("aria-label", "Contents");
        const body = document.createElement("div");
        shell.appendChild(outline); shell.appendChild(body);
        main.appendChild(shell);

        let html = "";
        let outlineHtml = `<div class="rd-outline-h">Contents</div>`;
        let secIdx = 0;
        for (const ch of d.chapters || []) {
          const chTitle = ch.heading || ch.number || "";
          const linkItems = [];
          const secs = (ch.sections || []).map((s) => {
            const id = sectionId(d.slug, s.number, secIdx++);
            const list = s.obligations || [];
            const tiles = list.map((o) => `
              <a class="rd-tile" href="/v2/compliance/obligation.html?id=${encodeURIComponent(o.id)}">
                <span class="rd-tile-id">${v2Esc(o.id)}</span>
                <div class="rd-tile-title">${v2Esc(o.title || "")}</div>
                <div class="rd-tile-meta">
                  <span class="v2-chip v2-chip--status">${v2Esc(o.status || "—")}</span>
                  ${chip(o.verdict)}
                </div>
                ${o.ownerSeatTitle ? `<div class="rd-obl-meta">${v2Esc(o.ownerSeatTitle)}</div>` : ""}
              </a>`).join("");
            const subsHtml = (s.subsections || []).map((ss) =>
              `<div class="rd-sub"><span class="rd-sub-num">${v2Esc(ss.number || "")}</span><span class="rd-sub-text">${v2Esc(ss.text || "")}</span></div>`).join("");
            const excHtml = (s.excerpts || []).map((e) =>
              `<figure class="rd-excerpt"><img loading="lazy" alt="${v2Esc(e.caption || ("Excerpt " + e.id))}" src="/api/regulation-reader/${encodeURIComponent(d.slug)}/excerpt/${encodeURIComponent(e.id)}">${e.caption ? `<figcaption>${v2Esc(e.caption)}${e.pages ? ` (p.${v2Esc(e.pages)})` : ""}</figcaption>` : ""}</figure>`).join("");
            const hasBody = (s.text && s.text.trim()) || subsHtml || excHtml;
            // Slice-2 completeness badge: a "summary" section renders its editorial
            // précis WITH a neutral label flagging that full verbatim is still pending;
            // verbatim/enriched render clean; heading-only keeps the empty-state line.
            const badge = s.completeness === "summary"
              ? `<div class="rd-completeness-badge">summary — full verbatim pending</div>`
              : "";
            const textHtml = hasBody
              ? `${badge}${renderBlocks(s)}${subsHtml}${excHtml}`
              : `<div class="rd-obl-meta">No verbatim text extracted for this section.</div>`;
            const hd = `<div class="rd-section-hd"><span class="rd-section-num">${v2Esc(s.number || "")}</span><span class="rd-section-heading">${v2Esc(s.heading || "")}</span></div>`;
            // Outline link (chapter → regulation depth).
            const label = [s.number, s.heading].filter(Boolean).join(" — ") || s.number || s.heading || "(section)";
            linkItems.push(`<a class="rd-outline-link" href="#${id}" data-target="${id}">${v2Esc(label)}</a>`);
            if (!tiles) {
              return `<div class="rd-section" id="${id}">${hd}${textHtml}</div>`;
            }
            // Two-column: verbatim source text left, obligation tile(s) on the RHS.
            return `<div class="rd-section rd-has-obls" id="${id}">
              <div class="rd-section-main">${hd}${textHtml}</div>
              <aside class="rd-aside"><div class="rd-obls-lbl">Obligations from this section</div>${tiles}</aside>
            </div>`;
          }).join("");
          html += `<div class="rd-chapter">${chTitle ? `<div class="rd-chapter-h">${v2Esc(chTitle)}</div>` : ""}${secs}</div>`;
          if (linkItems.length) {
            outlineHtml += `${chTitle ? `<div class="rd-outline-ch">${v2Esc(chTitle)}</div>` : ""}${linkItems.join("")}`;
          }
        }
        body.innerHTML = html || `<div class="v2-empty"><div class="v2-empty-msg">No sections available for this regulation.</div></div>`;
        outline.innerHTML = outlineHtml;

        // Smooth-scroll to a section on outline click (also works via the native
        // #anchor since scroll-behavior:smooth is set on <html>).
        outline.addEventListener("click", (e) => {
          const a = e.target.closest(".rd-outline-link");
          if (!a) return;
          const el = document.getElementById(a.getAttribute("data-target"));
          if (el) { e.preventDefault(); el.scrollIntoView({ behavior: "smooth", block: "start" });
            el.classList.add("rd-flash"); setTimeout(() => el.classList.remove("rd-flash"), 1200);
            history.replaceState(null, "", "#" + a.getAttribute("data-target")); }
        });

        document.getElementById("showObls").addEventListener("change", (e) => {
          document.body.classList.toggle("rd-hide-obls", !e.target.checked);
        });
        document.getElementById("q").addEventListener("input", (e) => {
          const q = e.target.value.trim().toLowerCase();
          for (const sec of body.querySelectorAll(".rd-section")) {
            const show = !q || sec.textContent.toLowerCase().includes(q);
            sec.style.display = show ? "" : "none";
            // Keep the outline in sync: dim/hide the matching entry too.
            const link = outline.querySelector(`.rd-outline-link[data-target="${sec.id}"]`);
            if (link) link.hidden = !show;
          }
        });
      });
    }
  </script>
</body>
</html>
