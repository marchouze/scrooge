<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onboarding — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Onboarding</h1></div>
    <div class="page-body">
      <div id="onb-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Onboarding" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      const el = document.getElementById("onb-table");
      el.innerHTML = SC.renderSkeleton(6);
      const data = await sf("/api/kyc/candidates");
      const items = Array.isArray(data) ? data : (data?.candidates ?? data?.items ?? []);
      SC.renderTable({
        container: el,
        headers: ["Name","Type","Status","Created"],
        rows: items.map(c => ({
          cells: [SC.esc(c.name||c.fullName||""), SC.esc(c.type||c.entityType||""), SC.renderBadge(c.status||"pending"), SC.esc((c.createdAt||c.created||"").slice(0,10))],
          data: c,
        })),
        onRowClick: c => SC.openModal({ title: c.name||"Candidate", body: SC.renderDefList(c) }),
        emptyMessage: "No onboarding candidates",
      });
    })();
  </script>
</body>
</html>
