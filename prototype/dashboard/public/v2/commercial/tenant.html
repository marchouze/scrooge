<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tenant Detail — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    const id = new URLSearchParams(location.search).get("id");
    renderPageHeader(main, {
      crumbs: [
        { label: "Executive", href: "/v2/index.html" },
        { label: "Commercial", href: "/v2/commercial/index.html" },
        { label: "Subscribers", href: "/v2/commercial/subscribers.html" },
        { label: id || "Detail" },
      ],
      title: id ? `Tenant: ${id}` : "Tenant Detail",
    });
    if (!id) {
      const e = document.createElement("div"); e.className = "v2-empty";
      e.innerHTML = `<div class="v2-empty-icon">⊙</div><div class="v2-empty-msg">No tenant selected — choose from <a href="/v2/commercial/subscribers.html">Subscriber Register</a>.</div>`;
      main.appendChild(e);
    } else {
      renderTileGroup(main, { tiles: [
        { label: "Tier", unit: "K / R / C" },
        { label: "Status", unit: "active / suspended / pending" },
        { label: "Version", unit: "Platform version" },
        { label: "Provisioned", unit: "Date" },
      ]});
      const s = document.createElement("div"); s.className = "v2-section"; main.appendChild(s);
      const h = document.createElement("h2"); h.className = "v2-section-title"; h.textContent = "Tenant Profile"; s.appendChild(h);
      renderTable(s, { columns: ["Field", "Value"] });
      const s2 = document.createElement("div"); s2.className = "v2-section"; main.appendChild(s2);
      const h2 = document.createElement("h2"); h2.className = "v2-section-title"; h2.textContent = "Entitlements"; s2.appendChild(h2);
      renderTable(s2, { columns: ["Surface", "Entitlement", "Since"] });
      const s3 = document.createElement("div"); s3.className = "v2-section"; main.appendChild(s3);
      const h3 = document.createElement("h2"); h3.className = "v2-section-title"; h3.textContent = "Metering Events"; s3.appendChild(h3);
      renderTable(s3, { columns: ["Event", "Timestamp", "Units", "Ledger Entry"] });
    }
  </script>
</body>
</html>
