<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regulation Reader — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
  <style>
    /* ── Regulation Reader layout ─────────────────────────────────── */
    .rr-layout {
      display: flex;
      gap: var(--space-4);
      height: calc(100vh - var(--topbar-height) - 110px);
      overflow: hidden;
    }

    #rr-detail {
      flex: 1;
      min-height: 0;
    }

    /* Left sidebar */
    .rr-sidebar {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
      padding-right: var(--space-3);
    }
    .rr-sidebar-title {
      font: var(--text-label);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: var(--space-3) 0 var(--space-2);
      flex-shrink: 0;
    }
    .rr-instrument-item {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      padding: var(--space-3);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 0.1s;
      border: 1px solid transparent;
    }
    .rr-instrument-item:hover {
      background: var(--color-surface-hover);
    }
    .rr-instrument-item.active {
      background: var(--color-surface-hover);
      border-color: var(--color-accent);
    }
    .rr-instrument-name {
      font: var(--text-body);
      font-weight: 600;
      color: var(--color-text);
    }
    .rr-instrument-meta {
      display: flex;
      gap: var(--space-2);
      align-items: center;
      flex-wrap: wrap;
    }
    .rr-year {
      font: var(--text-small);
      color: var(--color-text-muted);
    }
    .rr-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 10px;
      font: var(--text-small);
      font-weight: 500;
    }
    .rr-badge-obl {
      background: color-mix(in srgb, var(--color-accent) 12%, transparent);
      color: var(--color-accent);
    }
    .rr-badge-text {
      background: color-mix(in srgb, var(--color-success, #22c55e) 15%, transparent);
      color: color-mix(in srgb, var(--color-success, #22c55e) 80%, black);
    }
    .rr-badge-summary {
      background: color-mix(in srgb, var(--color-text-muted) 15%, transparent);
      color: var(--color-text-muted);
    }
    /* Review-marker badges (RegulatorySourceReviewed). */
    .rr-badge-reviewed {
      background: color-mix(in srgb, var(--color-success, #22c55e) 15%, transparent);
      color: color-mix(in srgb, var(--color-success, #22c55e) 80%, black);
    }
    .rr-badge-stale {
      background: color-mix(in srgb, var(--color-warning, #f59e0b) 18%, transparent);
      color: color-mix(in srgb, var(--color-warning, #f59e0b) 75%, black);
    }
    .rr-badge-unreviewed {
      background: color-mix(in srgb, var(--color-text-muted) 12%, transparent);
      color: var(--color-text-muted);
    }

    /* Main content area */
    .rr-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .rr-main-header {
      flex-shrink: 0;
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-3);
    }
    .rr-main-title {
      font: var(--text-heading);
      color: var(--color-text);
      margin: 0 0 var(--space-1);
    }
    .rr-main-subtitle {
      font: var(--text-small);
      color: var(--color-text-muted);
    }
    .rr-search-bar {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }
    .rr-search-input {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font: var(--text-body);
      background: var(--color-bg);
      color: var(--color-text);
      outline: none;
    }
    .rr-search-input:focus {
      border-color: var(--color-accent);
    }
    .rr-search-count {
      font: var(--text-small);
      color: var(--color-text-muted);
      align-self: center;
    }

    /* Scrollable sections area */
    .rr-sections-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: var(--space-2);
    }

    /* Chapter */
    .rr-chapter {
      margin-bottom: var(--space-5);
    }
    .rr-chapter-heading {
      font: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      padding: var(--space-2) 0;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-3);
    }

    /* Section */
    .rr-section {
      margin-bottom: var(--space-4);
      padding: var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      transition: border-color 0.15s;
    }
    .rr-section:target,
    .rr-section.highlight {
      border-color: var(--color-accent);
      background: color-mix(in srgb, var(--color-accent) 4%, transparent);
    }
    .rr-section-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }
    /* Tick-to-obligation modal */
    .rr-modal {
      background: var(--color-surface);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      width: min(680px, 100%);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }
    .rr-modal-header {
      display: flex;
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border);
      font-size: 0.95em;
    }
    .rr-modal-body {
      padding: var(--space-4);
      overflow-y: auto;
    }
    .rr-section-number {
      font: var(--text-body);
      font-weight: 700;
      color: var(--color-accent);
      flex-shrink: 0;
    }
    .rr-section-heading {
      font: var(--text-body);
      font-weight: 600;
      color: var(--color-text);
    }
    .rr-section-text {
      font: var(--text-body);
      color: var(--color-text);
      line-height: 1.6;
      margin-bottom: var(--space-2);
    }
    .rr-section-text.verbatim {
      background: color-mix(in srgb, var(--color-text-muted) 5%, transparent);
      border-left: 3px solid var(--color-accent);
      padding: var(--space-2) var(--space-3);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-family: var(--font-mono, monospace);
      font-size: 0.85em;
    }
    .rr-summary-note {
      font: var(--text-small);
      color: var(--color-text-muted);
      font-style: italic;
      margin-top: var(--space-1);
    }

    /* Obligation cards — collapsed by default; expanded per-section or via global toggle. */
    .rr-obligations {
      display: none;
      flex-direction: column;
      gap: var(--space-2);
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--color-border);
    }
    .rr-section.rr-expanded .rr-obligations {
      display: flex;
    }

    /* Expand chevron on the section header */
    .rr-obl-toggle {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      font: var(--text-small);
      color: var(--color-accent);
      background: color-mix(in srgb, var(--color-accent) 10%, transparent);
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.1s;
    }
    .rr-obl-toggle:hover {
      background: color-mix(in srgb, var(--color-accent) 18%, transparent);
    }
    .rr-obl-toggle:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 1px;
    }
    .rr-obl-toggle-icon {
      display: inline-block;
      transition: transform 0.15s;
      font-size: 0.7em;
    }
    .rr-section.rr-expanded .rr-obl-toggle-icon {
      transform: rotate(90deg);
    }

    /* Global "Show obligations" toggle in the toolbar */
    .rr-show-obl {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: var(--space-2) var(--space-3);
      font: var(--text-small);
      color: var(--color-text);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    .rr-show-obl input {
      margin: 0;
      cursor: pointer;
    }
    .rr-show-obl:hover {
      border-color: var(--color-accent);
    }
    .rr-obl-label {
      font: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      font-size: 0.7rem;
      margin-bottom: var(--space-1);
    }
    .rr-obl-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      padding: var(--space-2) var(--space-3);
      background: var(--color-surface-hover);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
    }
    .rr-obl-header {
      display: flex;
      gap: var(--space-2);
      align-items: center;
      flex-wrap: wrap;
    }
    .rr-obl-id {
      font: var(--text-small);
      font-weight: 700;
      font-family: var(--font-mono, monospace);
      color: var(--color-accent);
    }
    .rr-obl-status {
      font: var(--text-small);
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 10px;
    }
    .rr-obl-status-in-force {
      background: color-mix(in srgb, var(--color-success, #22c55e) 15%, transparent);
      color: color-mix(in srgb, var(--color-success, #22c55e) 80%, black);
    }
    .rr-obl-status-partial {
      background: color-mix(in srgb, #f59e0b 15%, transparent);
      color: #92400e;
    }
    .rr-obl-status-drafting {
      background: color-mix(in srgb, #6366f1 15%, transparent);
      color: #3730a3;
    }
    .rr-obl-status-planned {
      background: color-mix(in srgb, var(--color-text-muted) 15%, transparent);
      color: var(--color-text-muted);
    }
    .rr-obl-status-not-applicable {
      background: color-mix(in srgb, var(--color-text-muted) 8%, transparent);
      color: var(--color-text-muted);
    }
    .rr-obl-req {
      font: var(--text-small);
      color: var(--color-text);
      line-height: 1.5;
    }
    .rr-obl-policy {
      font: var(--text-small);
      color: var(--color-accent);
      text-decoration: none;
    }
    .rr-obl-policy:hover {
      text-decoration: underline;
    }

    /* Instrument-wide obligations panel (above the chapter scroll) */
    .rr-instrument-wide {
      margin-bottom: var(--space-5);
      padding: var(--space-3);
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--color-accent) 4%, transparent);
    }
    .rr-instrument-wide-label {
      font: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-accent);
      font-weight: 600;
      margin-bottom: var(--space-1);
    }
    .rr-instrument-wide-note {
      font: var(--text-small);
      color: var(--color-text-muted);
      font-style: italic;
      margin-bottom: var(--space-3);
    }
    .rr-instrument-wide-cards {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    /* Hidden sections (search filter) */
    .rr-section.hidden { display: none; }

    /* Skeleton */
    .rr-skeleton {
      padding: var(--space-4);
      color: var(--color-text-muted);
      font: var(--text-body);
    }

    @media (max-width: 768px) {
      .rr-layout {
        flex-direction: column;
        height: auto;
      }
      .rr-sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
        max-height: 200px;
        padding-right: 0;
        padding-bottom: var(--space-3);
      }
      .rr-sections-scroll {
        overflow-y: visible;
      }
    }

    /* ── View toggle ─────────────────────────────────────────────────── */
    .rr-view-toggle { display: flex; gap: var(--space-1); }
    .rr-toggle-btn {
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font: var(--text-small);
      font-weight: 500;
      background: var(--color-bg);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.1s;
    }
    .rr-toggle-btn.active {
      background: var(--color-accent);
      color: white;
      border-color: var(--color-accent);
    }
    .rr-toggle-btn:hover:not(.active) {
      background: var(--color-surface-hover);
      color: var(--color-text);
    }

    /* ── List view ───────────────────────────────────────────────────── */
    #rr-list-view { padding: var(--space-4); }
    .rr-list-toolbar {
      display: flex;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
      align-items: center;
      flex-wrap: wrap;
    }
    .rr-tabs {
      display: flex;
      gap: 2px;
      background: var(--color-surface-hover);
      padding: 3px;
      border-radius: var(--radius-md);
    }
    .rr-tab {
      padding: 4px 14px;
      border: none;
      border-radius: calc(var(--radius-md) - 1px);
      font: var(--text-small);
      font-weight: 500;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.1s;
      white-space: nowrap;
    }
    .rr-tab.active {
      background: var(--color-bg);
      color: var(--color-text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .rr-tab-count {
      display: inline-block;
      margin-left: 4px;
      padding: 0 5px;
      background: color-mix(in srgb, var(--color-text-muted) 15%, transparent);
      border-radius: 8px;
      font-size: 0.75em;
    }
    .rr-tab.active .rr-tab-count {
      background: color-mix(in srgb, var(--color-accent) 15%, transparent);
      color: var(--color-accent);
    }
    .rr-list-search, .rr-regulator-select {
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font: var(--text-small);
      background: var(--color-bg);
      color: var(--color-text);
      outline: none;
    }
    .rr-list-search { flex: 1; min-width: 140px; max-width: 260px; }
    .rr-list-search:focus { border-color: var(--color-accent); }
    .rr-list-count { font: var(--text-small); color: var(--color-text-muted); white-space: nowrap; }
    .rr-list-body { display: flex; gap: var(--space-4); align-items: flex-start; }
    .rr-list-table-wrap { flex: 1; overflow-x: auto; min-width: 0; }
    .rr-inst-table { width: 100%; border-collapse: collapse; font: var(--text-small); }
    .rr-inst-table th {
      background: var(--color-surface-hover);
      border-bottom: 2px solid var(--color-border);
      padding: var(--space-2) var(--space-3);
      text-align: left;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      white-space: nowrap;
    }
    .rr-inst-table td {
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-2) var(--space-3);
      vertical-align: middle;
      color: var(--color-text);
    }
    .rr-inst-table tr:last-child td { border-bottom: none; }
    .rr-inst-table tbody tr { cursor: pointer; transition: background 0.1s; }
    .rr-inst-table tbody tr:hover { background: var(--color-surface-hover); }
    .rr-inst-table tbody tr.rr-row-active {
      background: color-mix(in srgb, var(--color-accent) 6%, transparent);
    }
    .rr-inst-name { font-weight: 600; color: var(--color-text); }
    .rr-inst-short { font-size: 0.82em; color: var(--color-text-muted); margin-top: 1px; }
    .rr-badge-p1 {
      background: color-mix(in srgb, var(--color-accent) 15%, transparent);
      color: var(--color-accent);
    }
    .rr-num-cell { text-align: right; }

    /* ── Drilldown panel ─────────────────────────────────────────────── */
    .rr-drill {
      width: 360px;
      flex-shrink: 0;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg);
      overflow-y: auto;
      max-height: calc(100vh - var(--topbar-height) - 140px);
      position: sticky;
      top: var(--space-3);
    }
    .rr-drill-head {
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface-hover);
    }
    .rr-drill-head-title {
      flex: 1;
      font: var(--text-small);
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.4;
    }
    .rr-drill-close-btn {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 1em;
      border-radius: var(--radius-sm);
    }
    .rr-drill-close-btn:hover { background: var(--color-border); color: var(--color-text); }
    .rr-drill-content { padding: var(--space-3) var(--space-4); }
    .rr-drill-read-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: var(--space-2) var(--space-3);
      margin-bottom: var(--space-3);
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--color-accent) 8%, transparent);
      color: var(--color-accent);
      font: var(--text-small);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.1s;
    }
    .rr-drill-read-btn:hover { background: color-mix(in srgb, var(--color-accent) 16%, transparent); }
    .rr-drill-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-2) var(--space-4);
      margin-bottom: var(--space-4);
      padding: var(--space-3);
      background: var(--color-surface-hover);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
    }
    .rr-drill-meta-row { display: flex; flex-direction: column; gap: 1px; }
    .rr-drill-meta-lbl {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
    }
    .rr-drill-meta-val { font: var(--text-small); color: var(--color-text); font-weight: 500; }
    .rr-drill-sect-head {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
      padding-bottom: var(--space-1);
      border-bottom: 1px solid var(--color-border);
    }
    .rr-drill-toc-item {
      display: flex;
      align-items: baseline;
      gap: var(--space-2);
      padding: var(--space-1) 0;
      border-bottom: 1px solid var(--color-border);
      font: var(--text-small);
    }
    .rr-drill-toc-item:last-child { border-bottom: none; }
    .rr-drill-toc-num { font-weight: 600; color: var(--color-accent); flex-shrink: 0; min-width: 28px; }
    .rr-drill-toc-head { flex: 1; color: var(--color-text); }
    .rr-drill-toc-count { color: var(--color-text-muted); font-size: 0.78em; white-space: nowrap; }
    .rr-drill-loading { color: var(--color-text-muted); font: var(--text-small); padding: var(--space-2) 0; }
  </style>
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3)">
      <h1 class="page-title">Regulation Reader</h1>
      <div class="rr-view-toggle">
        <button type="button" id="rr-btn-list" class="rr-toggle-btn active">List</button>
        <button type="button" id="rr-btn-reader" class="rr-toggle-btn">Reader</button>
      </div>
    </div>

    <!-- List view -->
    <div id="rr-list-view" class="page-body">
      <div class="rr-list-toolbar">
        <div id="rr-tabs" class="rr-tabs"></div>
        <input type="search" id="rr-list-search" class="rr-list-search" placeholder="Search instruments…" aria-label="Search instruments">
        <select id="rr-regulator-filter" class="rr-regulator-select" aria-label="Filter by regulator">
          <option value="">All regulators</option>
        </select>
        <span id="rr-list-count" class="rr-list-count"></span>
      </div>
      <div class="rr-list-body">
        <div class="rr-list-table-wrap">
          <table class="rr-inst-table">
            <thead>
              <tr>
                <th>Instrument</th>
                <th>Year</th>
                <th>Regulator</th>
                <th class="rr-num-cell">Sections</th>
                <th class="rr-num-cell">Obls</th>
                <th>Review</th>
                <th>Priority</th>
              </tr>
            </thead>
            <tbody id="rr-inst-body">
              <tr><td colspan="7" class="rr-skeleton" style="padding:var(--space-4)">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <aside id="rr-drill" class="rr-drill" style="display:none" aria-label="Instrument detail">
          <div class="rr-drill-head">
            <div class="rr-drill-head-title" id="rr-drill-title">—</div>
            <button type="button" class="rr-drill-close-btn" id="rr-drill-close" aria-label="Close">×</button>
          </div>
          <div class="rr-drill-content" id="rr-drill-content"></div>
        </aside>
      </div>
    </div>

    <!-- Reader view -->
    <div class="page-body" style="padding:0;display:none" id="rr-reader-view">
      <div class="rr-layout">
        <!-- Left sidebar: instrument list -->
        <aside class="rr-sidebar" id="rr-sidebar">
          <div class="rr-sidebar-title">Instruments</div>
          <div id="rr-instrument-list">
            <div class="rr-skeleton">Loading…</div>
          </div>
        </aside>

        <!-- Main content: instrument detail -->
        <section class="rr-main" id="rr-main">
          <div class="rr-skeleton" id="rr-placeholder">
            Select an instrument to read.
          </div>
          <div id="rr-detail" style="display:none;flex-direction:column;overflow:hidden">
            <div class="rr-main-header" id="rr-header"></div>
            <div class="rr-search-bar">
              <input
                type="search"
                class="rr-search-input"
                id="rr-search"
                placeholder="Search sections…"
                aria-label="Search sections"
              >
              <span class="rr-search-count" id="rr-search-count" aria-live="polite"></span>
              <label class="rr-show-obl" title="Expand or collapse obligations on every section">
                <input type="checkbox" id="rr-show-obl">
                <span>Show obligations</span>
              </label>
            </div>
            <div class="rr-sections-scroll" id="rr-sections"></div>
          </div>
        </section>
      </div><!-- /.rr-layout -->
    </div><!-- /#rr-reader-view -->
  </main>

  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script src="/regulation-reader.js"></script>
</body>
</html>
