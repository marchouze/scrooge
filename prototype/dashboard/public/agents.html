<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agents — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Agents</h1></div>
    <div class="page-body">
      <div id="agents-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Agents" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      const el = document.getElementById("agents-table");
      el.innerHTML = SC.renderSkeleton(8);
      const data = await sf("/api/state");
      const all = data?.agents ?? [];
      SC.renderTable({
        container: el,
        headers: ["Name","Role","Type","Active Workstreams","Open Decisions"],
        rows: all.map(a => ({
          cells: [SC.esc(a.name||""), SC.esc(a.role||""), SC.renderBadge(a.type||"functional"), SC.esc(String(a.totalActive??0)), SC.esc(String(a.totalOpenDecisions??0))],
          data: a,
        })),
        onRowClick: a => SC.openModal({ title: a.name||"Agent", body: SC.renderDefList(a) }),
        emptyMessage: "No agents registered",
      });
    })();
  </script>
</body>
</html>
