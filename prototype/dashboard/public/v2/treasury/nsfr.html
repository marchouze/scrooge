<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NSFR — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
</head>
<body data-provenance-source="/api/v2/treasury/nsfr">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <span data-provenance-badge="page-top"></span>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script src="/v2/_v2-data.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [
        { label: "Executive", href: "/v2/index.html" },
        { label: "Treasury", href: "/v2/treasury/index.html" },
        { label: "NSFR" },
      ],
      title: "Net Stable Funding Ratio (NSFR)",
      seat: "ASF / RSF · Reg 26A · BCBS NSFR · BA-120",
    });

    const stateHost = document.createElement("div"); main.appendChild(stateHost);
    const tilesHost = document.createElement("div"); main.appendChild(tilesHost);
    const formulaHost = document.createElement("div"); main.appendChild(formulaHost);
    const asfHost = document.createElement("div"); main.appendChild(asfHost);
    const rsfHost = document.createElement("div"); main.appendChild(rsfHost);
    const refsHost = document.createElement("div"); main.appendChild(refsHost);

    const metricHref = (key) => `/v2/treasury/liquidity-metric.html?surface=nsfr&metric=${encodeURIComponent(key)}`;

    v2WireLoader(async () => {
      stateHost.replaceChildren(); tilesHost.replaceChildren();
      formulaHost.replaceChildren(); asfHost.replaceChildren();
      rsfHost.replaceChildren(); refsHost.replaceChildren();
      let d;
      try {
        d = await v2Fetch("/api/v2/treasury/nsfr");
      } catch (err) {
        v2RenderError(stateHost, v2Esc(err.message));
        return;
      }
      document.getElementById("as-of").textContent = `as of ${new Date(d.asOf).toLocaleString()}`;

      if (d.dataState === "empty") {
        const banner = document.createElement("div");
        banner.className = "v2-section";
        banner.innerHTML = `
          <div class="v2-empty">
            <div class="v2-empty-icon">○</div>
            <div class="v2-empty-msg"><strong>No stable-funding positions under this lens.</strong><br>${v2Esc(d.reason)}</div>
          </div>`;
        stateHost.appendChild(banner);
      }

      renderTileGroup(tilesHost, {
        tiles: d.tiles.map((t) => ({
          label: t.label,
          value: t.valueFmt,
          unit: t.unit,
          href: t.key === "nsfr-minimum" ? undefined : metricHref(t.key),
        })),
      });

      // NSFR formula block: ASF / RSF = ratio.
      renderFormula(formulaHost, {
        name: "NSFR",
        numLabel: "Available Stable Funding (weighted)",
        denLabel: "Required Stable Funding (weighted)",
        reference: "Reg 26A · BCBS NSFR · BA-120",
      });
      const fvals = formulaHost.querySelectorAll(".v2-formula-value");
      if (fvals[0]) fvals[0].textContent = d.asfFmt;
      if (fvals[1]) fvals[1].textContent = d.rsfFmt;
      const fres = formulaHost.querySelector(".v2-formula-result-value");
      if (fres) fres.textContent = d.nsfrFmt;

      const ctx = document.createElement("div"); ctx.className = "v2-section"; formulaHost.appendChild(ctx);
      renderTable(ctx, {
        columns: ["Measure", "Value"],
        rows: [
          { cells: ["NSFR status", `<span class="v2-badge v2-badge-info">${v2Esc(d.status)}</span>`] },
          { cells: ["Available Stable Funding", v2Esc(d.asfFmt)] },
          { cells: ["Required Stable Funding", v2Esc(d.rsfFmt)] },
          { cells: ["Functional currency", v2Esc(d.functionalCurrency)] },
          { cells: ["Entity (Reg 26A — bank licence)", v2Esc(d.entity)] },
        ],
      });

      // ASF constituents.
      const as = document.createElement("div"); as.className = "v2-section"; asfHost.appendChild(as);
      const ah = document.createElement("h2"); ah.className = "v2-section-title"; ah.textContent = "ASF constituents"; as.appendChild(ah);
      renderTable(as, {
        columns: ["ASF category", "Amount"],
        emptyMsg: "No ASF positions under this lens — no stable-funding events booked in the build phase.",
        rows: d.asfConstituents.map((r) => ({ cells: r.cells.map((c, i) => i === 1 ? `<strong>${v2Esc(c)}</strong>` : v2Esc(c)) })),
      });

      // RSF constituents.
      const rs = document.createElement("div"); rs.className = "v2-section"; rsfHost.appendChild(rs);
      const rh = document.createElement("h2"); rh.className = "v2-section-title"; rh.textContent = "RSF constituents"; rs.appendChild(rh);
      renderTable(rs, {
        columns: ["RSF category", "Amount"],
        emptyMsg: "No RSF positions under this lens — no required-stable-funding items booked in the build phase.",
        rows: d.rsfConstituents.map((r) => ({ cells: r.cells.map((c, i) => i === 1 ? `<strong>${v2Esc(c)}</strong>` : v2Esc(c)) })),
      });

      renderRefs(refsHost, {
        refs: [
          { label: "Regs Relating to Banks — Reg 26A (NSFR)", href: "/v2/compliance/reader.html?slug=regulations-relating-to-banks" },
          { label: "BCBS Basel III — NSFR standard (Oct 2014)", href: "/v2/compliance/reader.html?slug=bcbs-basel-iii" },
          { label: "ALM positions (source snapshot)", href: "/v2/treasury/alm.html" },
          { label: "BA-120 NSFR return", href: "/v2/operations/schemas.html" },
        ],
      });
    });
  </script>
</body>
</html>
