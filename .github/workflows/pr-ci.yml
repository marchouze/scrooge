# PR CI gate — runs on every pull request to main.
#
# Why this exists:
#   Until 2026-05-08, PR-level CI was enforced only by local `bun run ci`.
#   That broke down twice in one session:
#     - rescue commits 61f45c8 / d672fa9 / fb21d69 / 9b69c5d / c441e40
#       landed with typecheck + lint failures on main;
#     - PR #14 ("restore CI green on main") missed biome formatting errors
#       in prototype/platform/event-store/event-types.ts and
#       prototype/tests/legacy-fanout-shadowed.test.ts that came in via
#       PRs #11 and #12 and only surfaced on the PR #10 rebase.
#
# 2026-05-22 — Parallelised to 3 independent jobs (P1 merge-friction fix):
#   The original single-job `bun run ci` ran 74+ recon checks serially
#   inside a 15-minute timeout window, causing frequent timeout failures
#   and long wait times when any single check failed. The new structure:
#     - core:        typecheck + lint + test + citation-gate (~3-5 min)
#     - recon-infra: infrastructure/dispatch/event-store recons (~5-8 min)
#     - recon-domain: domain/business-logic recons (~5-8 min)
#     - ci:          fanout gate (depends on all three; provides the single
#                    required status check that branch protection enforces)
#   Wall-clock time: ~5-8 min (was ~12-15 min serial). Each failure is
#   isolated to its job — domain recon failures no longer block core checks.
#
# Citations:
#   - CLAUDE.md Principle 3 (cloud-native; nothing manual without
#     justification — local-only `bun run ci` is a manual step that has
#     now failed twice in one session).
#   - CLAUDE.md Principle 4 (security designed in from the start; secure
#     SDLC explicitly includes an automated CI gate before merge).
#   - Merge-friction plan 2026-05-22: P1 (parallelise CI) + P4 (timeout).
#
# Branch protection:
#   This workflow registers a check named "ci" (the fanout job). Branch
#   protection continues to require exactly "ci" — no manual update needed.
#   The three parallel jobs are internal; only the fanout result is visible
#   to branch protection.
#
# Concurrency:
#   Per-workflow, per-ref group with cancel-in-progress = true. New pushes
#   to the same PR branch cancel the earlier in-flight run; different PRs
#   stay independent. This follows the memory note
#   `feedback_github_actions_concurrency.md`: never use a shared group
#   (effective queue depth 1, cancels queued runs).

name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Shared setup — reused across all three parallel jobs via a composite action
# would be cleaner, but inline steps are simpler and more transparent here.
# ---------------------------------------------------------------------------

jobs:
  # --------------------------------------------------------------------------
  # Job A — Core: typecheck · lint · test · citation-gate
  # Fast path. Catches type errors, formatting drift, broken tests, and bad
  # citations before any recon work runs. Expected: ~3-5 minutes.
  # --------------------------------------------------------------------------
  core:
    name: Core (typecheck · lint · test · citation-gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: prototype
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, test, citation-gate
        working-directory: prototype
        run: bun run ci:core

  # --------------------------------------------------------------------------
  # Job B — Recon: Infrastructure
  # Infrastructure-level integrity checks: handler registry sync, dispatch
  # topology, RMS parity, event-store append-only, circular deps, and
  # structural coverage. Expected: ~5-8 minutes.
  # --------------------------------------------------------------------------
  recon-infra:
    name: Recon — Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: prototype
        run: bun install --frozen-lockfile

      - name: Infrastructure recon checks
        working-directory: prototype
        run: bun run ci:recon:infra

  # --------------------------------------------------------------------------
  # Job C — Recon: Domain
  # Domain/business-logic integrity checks: FX conventions, credit/liquidity
  # limits, MTM pairings, decision authority, provenance, policy review,
  # GL coverage, and regulatory extraction. Expected: ~5-8 minutes.
  # --------------------------------------------------------------------------
  recon-domain:
    name: Recon — Domain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: prototype
        run: bun install --frozen-lockfile

      - name: Domain recon checks
        working-directory: prototype
        run: bun run ci:recon:domain

  # --------------------------------------------------------------------------
  # Job D — CI fanout gate
  # Depends on all three parallel jobs. This is the single job named "ci"
  # that branch protection requires — no branch-protection config change
  # needed. Fails explicitly if any upstream job failed or was cancelled.
  # --------------------------------------------------------------------------
  ci:
    name: CI gate
    needs: [core, recon-infra, recon-domain]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All jobs passed
        run: |
          if [[ "${{ needs.core.result }}"         != "success" ]] || \
             [[ "${{ needs.recon-infra.result }}"  != "success" ]] || \
             [[ "${{ needs.recon-domain.result }}" != "success" ]]; then
            echo "One or more CI jobs failed or were skipped:"
            echo "  core:         ${{ needs.core.result }}"
            echo "  recon-infra:  ${{ needs.recon-infra.result }}"
            echo "  recon-domain: ${{ needs.recon-domain.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
