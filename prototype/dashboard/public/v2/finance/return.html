<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Regulatory Return — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <style>
    .v2-chip { display:inline-flex; align-items:center; padding:1px 8px; border-radius:10px; font-size:0.78em; font-weight:600; }
    .v2-chip--ok { background:var(--color-success-bg); color:var(--color-success); }
    .v2-chip--info { background:var(--color-info-bg); color:var(--color-info); }
    .v2-chip--warn { background:var(--color-warning-bg, #5a4a1a); color:var(--color-warning, #e0b020); }
    .v2-chip--muted { background:var(--color-surface-raised); color:var(--color-text-secondary); }
    .v2-mono { font-family:var(--font-mono, ui-monospace, monospace); font-size:0.92em; }
    .v2-note { margin-top:12px; padding:10px 12px; border-radius:6px; background:var(--color-surface-raised);
      color:var(--color-text-secondary); font-size:0.85em; line-height:1.5; }
    /* SARB form — Excel-style pivot grid */
    .v2-ss-toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:4px 0 12px; }
    .v2-ss-search { flex:1; min-width:220px; padding:7px 10px; border-radius:6px; border:1px solid var(--color-border);
      background:var(--color-surface); color:var(--color-text); font-size:0.9em; }
    .v2-ss-legend { font-size:0.8em; color:var(--color-text-secondary); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .v2-ss-legend .sw { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:4px; vertical-align:-1px; border:1px solid var(--color-border); }
    .v2-ss-rowcount { font-size:0.8em; color:var(--color-text-secondary); margin-top:8px; }

    .v2-form-wrap { overflow:auto; max-height:76vh; border:1px solid var(--color-border); border-radius:6px; background:var(--color-surface); }
    table.v2-form { border-collapse:separate; border-spacing:0; font-size:0.8em; }
    table.v2-form th, table.v2-form td { border-right:1px solid var(--color-border); border-bottom:1px solid var(--color-border); padding:4px 8px; }
    /* column headers (top, sticky) */
    table.v2-form thead th { position:sticky; top:0; z-index:3; background:var(--color-surface-raised);
      text-align:center; font-weight:600; min-width:104px; max-width:150px; vertical-align:bottom; line-height:1.25; }
    table.v2-form thead th .cc { display:block; font-family:var(--font-mono, ui-monospace, monospace); font-size:0.82em; color:var(--color-text-secondary); font-weight:400; }
    /* top-left corner */
    table.v2-form thead th.corner { left:0; z-index:4; text-align:left; min-width:300px; max-width:340px; }
    /* row headers (left, sticky) */
    table.v2-form td.rowhead { position:sticky; left:0; z-index:1; background:var(--color-surface);
      min-width:300px; max-width:340px; text-align:left; vertical-align:top; line-height:1.3; }
    table.v2-form td.rowhead .rc { font-family:var(--font-mono, ui-monospace, monospace); font-size:0.82em; color:var(--color-text-secondary); margin-right:6px; }
    table.v2-form tbody tr:hover td.rowhead { background:var(--color-surface-raised); }
    /* data cells */
    table.v2-form td.cell { text-align:right; font-family:var(--font-mono, ui-monospace, monospace); white-space:nowrap; color:var(--color-text); }
    table.v2-form td.cell.empty { background:repeating-linear-gradient(135deg, transparent, transparent 5px, var(--color-surface-raised) 5px, var(--color-surface-raised) 6px); }
    table.v2-form td.cell.sourced { background:var(--color-success-bg); }
    table.v2-form td.cell.licence { background:transparent; color:var(--color-text-secondary); }
    table.v2-form td.cell.counsel { background:var(--color-warning-bg, #5a4a1a); }
    table.v2-form td.cell .frm { font-size:0.92em; color:var(--color-text-secondary); }
    table.v2-form td.cell.has-val { background:var(--color-info-bg); }
    table.v2-form td.cell.has-val .val { font-weight:700; color:var(--color-text); }
    /* Per-cell value provenance (which stage of the cell-value pipeline filled it):
       leaf-fold = folded directly from events (the granular per-line value);
       derived   = a computed subtotal/total; headline = legacy aggregate roll-up. */
    table.v2-form td.cell.src-leaf-fold { background:var(--color-success-bg); box-shadow:inset 3px 0 0 var(--color-success); }
    table.v2-form td.cell.src-leaf-fold .val { color:var(--color-text); }
    table.v2-form td.cell.src-derived { background:var(--color-info-bg); }
    table.v2-form td.cell.src-headline { background:var(--color-surface-raised); }
    table.v2-form td.cell .src-tag { display:block; font-size:0.68em; font-weight:600; letter-spacing:0.02em;
      text-transform:uppercase; opacity:0.8; margin-top:1px; text-align:right; }
    table.v2-form td.cell.src-leaf-fold .src-tag { color:var(--color-success); }
    table.v2-form td.cell.src-derived .src-tag { color:var(--color-info); }
    table.v2-form td.cell.src-headline .src-tag { color:var(--color-text-secondary); }

    /* Value ⟷ Formula/criteria display toggle. */
    .v2-disp-toggle { display:inline-flex; border:1px solid var(--color-border); border-radius:6px; overflow:hidden; }
    .v2-disp-toggle button { padding:6px 12px; background:var(--color-surface); color:var(--color-text-secondary);
      border:none; font-size:0.85em; font-weight:600; cursor:pointer; }
    .v2-disp-toggle button.active { background:var(--color-info-bg); color:var(--color-text); }
    .v2-disp-toggle button + button { border-left:1px solid var(--color-border); }

    /* Residual-cash LOUD flag (fail-safe exposure — money placed, sub-allocation deferred). */
    .v2-residual { margin:8px 0 14px; padding:11px 14px; border-radius:6px;
      background:var(--color-warning-bg, #5a4a1a); color:var(--color-text);
      border-left:4px solid var(--color-warning, #e0b020); font-size:0.86em; line-height:1.5; }
    .v2-residual h3 { margin:0 0 6px; font-size:0.95em; }
    .v2-residual table { border-collapse:collapse; margin-top:6px; font-size:0.95em; width:100%; }
    .v2-residual td, .v2-residual th { padding:3px 8px; text-align:left; vertical-align:top;
      border-bottom:1px solid rgba(255,255,255,0.12); }
    .v2-residual th { color:var(--color-text-secondary); font-weight:600; }
    .v2-residual .amt { font-family:var(--font-mono, ui-monospace, monospace); text-align:right; white-space:nowrap; }

    /* Formula/criteria ROW-ORIENTED layout (readable, wrapped — NOT crammed into the
       narrow 7-column grid). One row per relevant cell, text wraps. */
    .v2-formula-wrap { overflow:auto; max-height:76vh; border:1px solid var(--color-border); border-radius:6px; background:var(--color-surface); }
    table.v2-formula { border-collapse:collapse; width:100%; font-size:0.82em; }
    table.v2-formula thead th { position:sticky; top:0; z-index:2; background:var(--color-surface-raised);
      text-align:left; font-weight:600; padding:7px 10px; border-bottom:1px solid var(--color-border); white-space:nowrap; }
    table.v2-formula td { padding:8px 10px; border-bottom:1px solid var(--color-border); vertical-align:top; line-height:1.45; }
    table.v2-formula td.c-ref { white-space:nowrap; font-family:var(--font-mono, ui-monospace, monospace); font-size:0.92em; color:var(--color-text-secondary); }
    table.v2-formula td.c-item { min-width:180px; max-width:260px; }
    table.v2-formula td.c-deriv { min-width:300px; max-width:480px; }
    table.v2-formula td.c-cite { min-width:120px; max-width:220px; font-size:0.92em; color:var(--color-text-secondary); word-break:break-word; }
    table.v2-formula td.c-status { white-space:nowrap; }
    table.v2-formula tbody tr:hover { background:var(--color-surface-raised); }
    table.v2-formula .req { display:block; margin-top:3px; color:var(--color-text-secondary); font-size:0.95em; }
    table.v2-formula .req .sk { font-family:var(--font-mono, ui-monospace, monospace); color:var(--color-info); }
    table.v2-formula .dv { font-family:var(--font-mono, ui-monospace, monospace); }
    table.v2-formula .sr { display:block; margin-top:3px; color:var(--color-warning, #e0b020); }
  </style>
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html" title="Errors &amp; recon violations">
        <span class="v2-errors-icon">⚠</span>
        <span class="v2-errors-count" id="errors-count">…</span>
      </a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script src="/v2/_v2-data.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    const params = new URLSearchParams(window.location.search);
    const formId = params.get("form") || "";

    // Decimal-native major-unit Money ({amount, currency}) → grouped string. No float.
    function fmtMoney(m) {
      if (!m || m.amount === null || m.amount === undefined) return "—";
      const s = String(m.amount);
      const neg = s.startsWith("-");
      const [intRaw, fracRaw = ""] = (neg ? s.slice(1) : s).split(".");
      const frac = (fracRaw + "00").slice(0, 2);
      const grouped = intRaw.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      return `${v2Esc(m.currency)} ${neg ? "-" : ""}${grouped}.${frac}`;
    }

    // Plain decimal-native amount → grouped string (no currency prefix). No float.
    function fmtPlain(amount) {
      if (amount === null || amount === undefined) return "—";
      const s = String(amount);
      const neg = s.startsWith("-");
      const [intRaw, fracRaw = ""] = (neg ? s.slice(1) : s).split(".");
      const frac = (fracRaw + "00").slice(0, 2);
      const grouped = intRaw.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      return `${neg ? "-" : ""}${grouped}.${frac}`;
    }

    function statusChip(status) {
      // sourced | counsel-gated-TBC | licence-day-data
      const map = {
        "sourced": ["ok", "Sourced"],
        "counsel-gated-TBC": ["warn", "Counsel-TBC"],
        "licence-day-data": ["muted", "Licence-day"],
      };
      const [variant, label] = map[status] || ["muted", v2Esc(status)];
      return `<span class="v2-chip v2-chip--${variant}">${label}</span>`;
    }

    // Computed-figures block — the populated data that exists for live returns.
    function figuresSection(fig) {
      if (!fig) return null;
      const rows = [];
      if (fig.kind === "ba700") {
        rows.push(["Tier 1 capital", fmtMoney(fig.tier1Capital)]);
        rows.push(["Tier 2 capital", fmtMoney(fig.tier2Capital)]);
        rows.push(["Total risk-weighted assets (RWA)", fmtMoney(fig.totalRwa)]);
        rows.push(["Total capital ratio (CAR)", fig.carRatio === null || fig.carRatio === undefined ? "—" : `${(fig.carRatio * 100).toFixed(2)}%`]);
        rows.push(["Coverage status", v2Esc(fig.coverageStatus)]);
      } else if (fig.kind === "ba320") {
        (fig.positions || []).forEach((p) => {
          rows.push([`Net open position — ${v2Esc(p.baseCurrency)}`, p.rateAvailable ? fmtMoney(p.netPositionFunctional) : "— (no rate)"]);
        });
        rows.push(["FX open-position charge (Reg 28(5), 8%)", fmtMoney(fig.openPositionCharge)]);
        rows.push(["Coverage status", v2Esc(fig.coverageStatus)]);
      } else if (fig.kind === "ba100") {
        rows.push(["Total assets", fmtMoney(fig.assets)]);
        rows.push(["Total liabilities", fmtMoney(fig.liabilities)]);
        rows.push(["Total equity", fmtMoney(fig.equity)]);
        rows.push(["Balance check", fig.balanced ? "Balanced (A ≡ L + E)" : "Unbalanced (P&L not yet closed)"]);
        rows.push(["Coverage status", v2Esc(fig.coverageStatus)]);
      }
      if (rows.length === 0) return null;
      const body = rows.map(([k, v]) => `<tr><th style="text-align:left;padding:5px 10px;color:var(--color-text-secondary);white-space:nowrap;">${v2Esc(k)}</th><td class="v2-ss-num" style="padding:5px 10px;">${v}</td></tr>`).join("");
      const wrap = document.createElement("div");
      wrap.className = "v2-section";
      wrap.innerHTML = `<h2 class="v2-section-title">Computed figures</h2>` +
        `<p class="v2-note" style="margin-top:0;margin-bottom:10px;">The populated data that exists on the build store today. Per-cell values appear in the grid below once the cell-value engine and posted data land; the figures here are the on-demand computed roll-ups.</p>` +
        `<table style="border-collapse:collapse;font-size:0.9em;"><tbody>${body}</tbody></table>`;
      return wrap;
    }

    v2WireLoader(async () => {
      main.replaceChildren();
      if (!formId) {
        renderPageHeader(main, {
          crumbs: [{ label: "Executive", href: "/v2/index.html" }, { label: "Finance", href: "/v2/finance/index.html" }, { label: "Regulatory Returns", href: "/v2/finance/returns.html" }, { label: "Return" }],
          title: "Regulatory Return",
          seat: "SARB submissions",
        });
        v2RenderError(main, "No return specified. Open a return from the register.");
        return;
      }

      let data;
      try {
        data = await v2Fetch(`/api/v2/finance/returns/${encodeURIComponent(formId)}`);
      } catch (err) {
        renderPageHeader(main, {
          crumbs: [{ label: "Executive", href: "/v2/index.html" }, { label: "Finance", href: "/v2/finance/index.html" }, { label: "Regulatory Returns", href: "/v2/finance/returns.html" }, { label: formId }],
          title: formId,
          seat: "SARB submissions",
        });
        v2RenderError(main, v2Esc(err.message));
        return;
      }

      renderPageHeader(main, {
        crumbs: [
          { label: "Executive", href: "/v2/index.html" },
          { label: "Finance", href: "/v2/finance/index.html" },
          { label: "Regulatory Returns", href: "/v2/finance/returns.html" },
          { label: `${data.form} — ${data.name}` },
        ],
        title: `${data.form} — ${data.name}`,
        seat: "SARB submissions",
      });

      // Status / coverage tiles.
      renderTileGroup(main, {
        tiles: [
          { label: "Cells", value: String(data.cellCount), unit: "Total form cells (SARB XSD)" },
          { label: "Sourced", value: String(data.statusCounts.sourced), unit: "Populatable from current substrate" },
          { label: "Licence-day", value: String(data.statusCounts.licenceDayData), unit: "Data exists only at licence-day" },
          { label: "Counsel-TBC", value: String(data.statusCounts.counselGatedTbc), unit: "Definition counsel-gated" },
        ],
      });

      // Computed figures, where they exist.
      const figs = figuresSection(data.figures);
      if (figs) main.appendChild(figs);

      // ---- The SARB form as a 2D Excel-style grid ------------------------
      // Rows down (R-coordinate + official row heading), columns across
      // (C-coordinate + official column heading), one cell per intersection.
      // Exactly the shape of the published SARB BAxxx workbook.
      const VAL_COL = "␀val"; // synthetic column for cells with no C-coordinate
      const metaCells = data.cells.filter((c) => c.row === null);
      const gridCells = data.cells.filter((c) => c.row !== null);

      // Column order: the form's declared columns, plus a leading "Value" column
      // only if some row carries a coordinate-less single value.
      const cols = [...data.columns];
      if (gridCells.some((c) => c.column === null)) {
        cols.unshift({ column: VAL_COL, label: "Value" });
      }

      // Row order: first-seen order (the contract is authored in form order).
      const rowOrder = [];
      const rowLabelOf = new Map();
      const cellAt = new Map(); // `${row}␀${col}` -> cell
      for (const c of gridCells) {
        if (!rowLabelOf.has(c.row)) { rowLabelOf.set(c.row, c.rowLabel || ""); rowOrder.push(c.row); }
        cellAt.set(`${c.row}␀${c.column ?? VAL_COL}`, c);
      }

      // Cell renderer: a real SARB form cell. Sourced cells (populatable from the
      // current substrate) carry their derivation expression — the formula/source
      // that fills them — like a spreadsheet's formula view; licence-day cells are
      // blank (the unfilled form); a missing intersection is a hatched gap.
      // How each value-source reads in the cell tag + tooltip (generic — driven by
      // the DTO's value.source, so any form's leaf-fold cells light up the same way).
      const SOURCE_LABEL = {
        "leaf-fold": "folded",
        "derived": "subtotal",
        "headline": "aggregate",
      };
      const SOURCE_TIP = {
        "leaf-fold": "Folded directly from the underlying events by the per-cell leaf-fold engine — the granular, event-sourced per-line value.",
        "derived": "Computed by the form's own sum/formula arithmetic over the resolved leaf cells (a subtotal/total).",
        "headline": "Form-level aggregate roll-up from the on-demand projection, placed on its section-total cell.",
      };
      function cellHtml(cell) {
        if (!cell) return `<td class="cell empty"></td>`;
        const cls = cell.status === "sourced" ? "sourced" : cell.status === "counsel-gated-TBC" ? "counsel" : "licence";
        const tipBase = [
          `${cell.row || ""}${cell.column ? " · " + cell.column : ""}  ${cell.xsdElement}`,
          cell.label,
          cell.regulatoryDefinition,
          `Type: ${cell.valueType}${cell.unit ? " (" + cell.unit + ")" : ""} · Status: ${cell.status}`,
          cell.derivationExpression ? `Derivation [${cell.derivationKind}]: ${cell.derivationExpression}` : `Derivation: ${cell.derivationKind}`,
          cell.statusReason || "",
        ].filter(Boolean);
        // A soundly-computed value takes precedence — show the real number, not the
        // formula. The value's `source` drives the cell styling + tag so the
        // overseer can see WHICH cells the per-cell leaf-fold engine resolved from
        // events (leaf-fold), vs computed subtotals (derived), vs legacy aggregate
        // roll-ups (headline). Generic over forms — no per-row list.
        if (cell.value) {
          const v = cell.value.valueType === "money"
            ? fmtMoney({ amount: cell.value.amount, currency: cell.value.currency })
            : `${Number(cell.value.amount).toFixed(2)}%`;
          const src = cell.value.source || "derived";
          const srcLabel = SOURCE_LABEL[src] || src;
          const tip = [...tipBase, `Value source: ${src} — ${SOURCE_TIP[src] || ""}`].join("\n");
          return `<td class="cell ${cls} has-val src-${v2Esc(src)}" title="${v2Esc(tip)}">` +
            `<span class="val">${v}</span><span class="src-tag">${v2Esc(srcLabel)}</span></td>`;
        }
        const tip = tipBase.join("\n");
        // No sound value yet. A `sourced`-status cell is one the substrate is
        // EXPECTED to fill (the leaf fold could resolve it once its event/data lands)
        // — frame it as an honest, tracked capability gap ("not yet sourced"), never a
        // fabricated or zero value. Licence-day / counsel-gated cells render blank as
        // before (the unfilled form).
        let inner = "";
        if (cell.status === "sourced") {
          inner = `<span class="frm" title="Not yet sourced — the per-cell engine will fold this from events once its data/fold lands (tracked capability gap, never fabricated).">— not yet sourced</span>`;
          if (cell.derivationExpression) {
            inner += `<span class="src-tag" style="color:var(--color-text-secondary);text-transform:none;letter-spacing:0;opacity:0.7;">${v2Esc(cell.derivationExpression)}</span>`;
          }
        } else if (cell.status === "counsel-gated-TBC") {
          inner = `<span class="frm">TBC</span>`;
        }
        return `<td class="cell ${cls}" title="${v2Esc(tip)}">${inner}</td>`;
      }

      const section = document.createElement("div");
      section.className = "v2-section";
      section.innerHTML = `<h2 class="v2-section-title">${v2Esc(data.form)} form — ${data.cellCount} cells, ${rowOrder.length} rows × ${data.columns.length} columns</h2>`;
      main.appendChild(section);

      // ---- TIER-3 RESIDUAL settled-cash LOUD flag --------------------------
      // Fail-SAFE exposure (D-BA-RETURN-FAIL-SAFE-RESIDUAL-EXPOSURE): settled cash
      // whose ZAR value IS placed on the balance sheet but whose banks-vs-customers
      // sub-allocation is deferred. Surface it prominently — money is exposed, not
      // hidden; the missing dimension is flagged immediately.
      const residuals = data.residualCash || [];
      if (residuals.length > 0) {
        let total = 0;
        for (const r of residuals) total += Number(r.zarAmount) || 0;
        const ccy = data.functionalCurrency || "ZAR";
        const banner = document.createElement("div");
        banner.className = "v2-residual";
        const rrows = residuals.map((r) =>
          `<tr><td class="v2-mono">${v2Esc(r.instance)}</td>` +
          `<td class="amt">${v2Esc(ccy)} ${fmtPlain(r.zarAmount)}</td>` +
          `<td class="v2-mono">${v2Esc(r.placedRow)}</td>` +
          `<td>${v2Esc(r.reason)}</td></tr>`).join("");
        banner.innerHTML =
          `<h3>&#9888; Residual settled cash &mdash; placed, sub-allocation deferred (${residuals.length} instrument${residuals.length === 1 ? "" : "s"}, ${v2Esc(ccy)} ${fmtPlain(String(total))})</h3>` +
          `<p style="margin:0 0 4px;">The resolvable ZAR value of this settled cash IS exposed on the balance sheet (placed in the recon-counted asset range, so the detail still reconciles to TOTAL ASSETS). Only the banks-vs-customers counterparty sub-allocation is deferred and flagged for substrate development &mdash; never hidden. Fail-SAFE, not fail-blank.</p>` +
          `<table><thead><tr><th>Instrument</th><th class="amt">ZAR amount</th><th>Placed row</th><th>Missing dimension</th></tr></thead><tbody>${rrows}</tbody></table>`;
        section.appendChild(banner);
      }

      const toolbar = document.createElement("div");
      toolbar.className = "v2-ss-toolbar";
      toolbar.innerHTML =
        `<div class="v2-disp-toggle" role="group" aria-label="Display mode">` +
        `<button data-disp="value" class="active">Value</button>` +
        `<button data-disp="formula">Formula / criteria</button>` +
        `</div>` +
        `<input class="v2-ss-search" type="search" placeholder="Filter — row heading, coordinate, definition" aria-label="Filter rows">` +
        `<span class="v2-ss-legend">` +
        `<span><span class="sw" style="background:var(--color-success-bg);box-shadow:inset 3px 0 0 var(--color-success)"></span>folded (per-cell, from events)</span>` +
        `<span><span class="sw" style="background:var(--color-info-bg)"></span>subtotal (derived)</span>` +
        `<span><span class="sw" style="background:var(--color-surface-raised)"></span>aggregate (roll-up)</span>` +
        `<span><span class="sw" style="background:transparent"></span>not yet sourced / licence-day</span>` +
        `<span><span class="sw" style="background:var(--color-warning-bg,#5a4a1a)"></span>counsel-TBC</span>` +
        `</span>`;
      section.appendChild(toolbar);

      // Meta / form-header cells (FirmID, reporting dates …) — not part of the grid.
      if (metaCells.length > 0) {
        const meta = document.createElement("p");
        meta.className = "v2-note";
        meta.innerHTML = `<strong>Form header (${metaCells.length}):</strong> ` +
          metaCells.map((c) => `<span class="v2-mono" title="${v2Esc(c.regulatoryDefinition)}">${v2Esc(c.label)}</span>`).join(" · ");
        section.appendChild(meta);
      }

      const wrap = document.createElement("div");
      wrap.className = "v2-form-wrap";
      const table = document.createElement("table");
      table.className = "v2-form";
      const headCols = cols.map((c) =>
        `<th><span>${v2Esc(c.label)}</span>${c.column !== VAL_COL ? `<span class="cc">${v2Esc(c.column)}</span>` : ""}</th>`).join("");
      table.innerHTML = `<thead><tr><th class="corner">Line item</th>${headCols}</tr></thead>`;
      const tbody = document.createElement("tbody");

      const rowEls = rowOrder.map((row) => {
        const tr = document.createElement("tr");
        const rowLabel = rowLabelOf.get(row) || "";
        const cells = cols.map((col) => cellHtml(cellAt.get(`${row}␀${col.column}`))).join("");
        tr.innerHTML = `<td class="rowhead"><span class="rc">${v2Esc(row)}</span>${v2Esc(rowLabel)}</td>${cells}`;
        const rowCells = cols.map((col) => cellAt.get(`${row} ${col.column}`)).filter(Boolean);
        const blob = [row, rowLabel, ...rowCells.map((c) => `${c.label} ${c.regulatoryDefinition} ${c.xsdElement}`)]
          .join(" ").toLowerCase();
        return { tr, blob };
      });
      for (const r of rowEls) tbody.appendChild(r.tr);
      table.appendChild(tbody);
      wrap.appendChild(table);
      section.appendChild(wrap);

      // ---- FORMULA / CRITERIA mode: row-oriented, wrapped layout ----------
      // One row PER relevant cell (a cell carrying a coordinate). Columns:
      // Cell | Line item | Derivation/criteria | Citation | Status. Text wraps —
      // NO prose crammed into the narrow 7-column grid (CEO readability
      // constraint). Built once, toggled on demand. Generic over forms.
      const formulaCells = gridCells;
      const fWrap = document.createElement("div");
      fWrap.className = "v2-formula-wrap";
      fWrap.style.display = "none";
      const fTable = document.createElement("table");
      fTable.className = "v2-formula";
      fTable.innerHTML =
        `<thead><tr><th>Cell</th><th>Line item</th><th>Derivation / criteria</th><th>Citation</th><th>Status</th></tr></thead>`;
      const fBody = document.createElement("tbody");
      const fRowEls = formulaCells.map((c) => {
        const tr = document.createElement("tr");
        const ref = `${c.row || ""}${c.column ? " &middot; " + c.column : ""}`;
        const reqs = (c.dataRequirements || []).map((d) =>
          `<span class="req"><span class="sk">${v2Esc(d.sourceKind)}</span> ${v2Esc(d.ref)}${d.required ? "" : " (optional)"} &mdash; ${v2Esc(d.description)}</span>`).join("");
        const deriv =
          `<span class="dv">[${v2Esc(c.derivationKind)}]${c.derivationExpression ? " " + v2Esc(c.derivationExpression) : ""}</span>` +
          (c.statusReason ? `<span class="sr">${v2Esc(c.statusReason)}</span>` : "") +
          reqs;
        tr.innerHTML =
          `<td class="c-ref">${ref}<br><span style="opacity:0.7">${v2Esc(c.xsdElement)}</span></td>` +
          `<td class="c-item">${v2Esc(c.label)}</td>` +
          `<td class="c-deriv">${deriv}</td>` +
          `<td class="c-cite">${v2Esc(c.citation || "—")}</td>` +
          `<td class="c-status">${statusChip(c.status)}</td>`;
        const blob = [c.row || "", c.column || "", c.xsdElement, c.label, c.regulatoryDefinition,
          c.derivationExpression || "",
          (c.dataRequirements || []).map((d) => `${d.sourceKind} ${d.ref} ${d.description}`).join(" ")]
          .join(" ").toLowerCase();
        return { tr, blob };
      });
      for (const r of fRowEls) fBody.appendChild(r.tr);
      fTable.appendChild(fBody);
      fWrap.appendChild(fTable);
      section.appendChild(fWrap);

      const countLine = document.createElement("div");
      countLine.className = "v2-ss-rowcount";
      let dispMode = "value";
      const setCount = (shown) => {
        const tot = dispMode === "value" ? rowOrder.length : fRowEls.length;
        const noun = dispMode === "value" ? "rows" : "cells";
        countLine.textContent = `Showing ${shown} of ${tot} ${noun}`;
      };
      setCount(rowOrder.length);
      section.appendChild(countLine);

      // Client-side filter — applies to whichever mode is active.
      const search = toolbar.querySelector(".v2-ss-search");
      const applyFilter = () => {
        const q = search.value.trim().toLowerCase();
        let shown = 0;
        const set = dispMode === "value" ? rowEls : fRowEls;
        for (const r of set) {
          const match = q === "" || r.blob.includes(q);
          r.tr.style.display = match ? "" : "none";
          if (match) shown += 1;
        }
        setCount(shown);
      };
      search.addEventListener("input", applyFilter);

      // Display-mode toggle (Value ⟷ Formula / criteria).
      const dispButtons = toolbar.querySelectorAll(".v2-disp-toggle button");
      dispButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          dispMode = btn.getAttribute("data-disp");
          dispButtons.forEach((b) => b.classList.toggle("active", b === btn));
          const isValue = dispMode === "value";
          wrap.style.display = isValue ? "" : "none";
          fWrap.style.display = isValue ? "none" : "";
          applyFilter();
        });
      });

      renderRefs(main, {
        refs: [
          { label: "Returns register", href: "/v2/finance/returns.html" },
          { label: "SARB BA-return canonical register (Excel A1 names)", href: "/v2/compliance/regulations.html" },
          { label: "recon:ba-return-cell-contract (cells asserted verbatim + complete)", href: "#" },
        ],
      });
    });
  </script>
</body>
</html>
