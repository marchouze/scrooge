# Vera — overnight recon (autonomous run)
#
# Runs Vera's continuous-controls pipelines on a nightly cadence per her
# operating-spec § 6 (Cadence) and § 7 (Triggers): scheduler 02:00 UTC.
# Per CLAUDE.md Principle 7 (Autonomous by default) — no human in the loop.
#
# Outputs:
#   - <date>_vera_overnight-recon.md committed to /Owner Inbox/.
#   - ReconResult / AuditFinding events appended to the local event store
#     (.local/event.db is gitignored — events are produced for the run-host
#     instance only at this stage; the cloud-lift M8 will swap in a shared
#     event substrate per Atlas's runtime spec).
#
# Workflow_dispatch is wired so Marc / on-call can trigger an out-of-band
# run from the GitHub UI without waiting for the schedule.

name: Vera overnight recon

on:
  workflow_dispatch: {}

permissions:
  contents: write

# Serialise auto-commit pushes across all agent workflows so two agents
# running concurrently don't race for the same fast-forward push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Need write access to commit the deliverable back.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history not needed; shallow clone is fine.
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: prototype
        run: bun install --frozen-lockfile

      - name: Sync event store from Neon (pre-run)
        working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - name: Run Vera overnight recon
        working-directory: prototype
        env:
          # Optional. When present, Vera generates a narrative summary on
          # top of the mechanical recon results. When absent (or unset
          # in the GitHub Actions secret), the run still succeeds and
          # the deliverable simply notes that the narrative was skipped.
          # Set under Settings → Secrets and variables → Actions.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:vera-overnight
      - name: Sync event store to Neon (post-run)
        working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync

      - name: Commit deliverable
        # Only commits if Owner Inbox actually changed (no-op if recon was
        # idempotent against an unchanged tree).
        run: |
          git config user.name "vera-agent[bot]"
          git config user.email "agent-vera@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit; Vera's overnight run produced no deliverable diff."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Vera — overnight recon ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-vera-overnight.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).

          Co-Authored-By: Vera (agent) <agent-vera@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
