<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obligations — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Obligations</h1></div>
    <div class="page-body">
      <div id="obl-tabs" class="tab-bar"></div>
      <div id="obl-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Obligations" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      document.getElementById("obl-table").innerHTML = SC.renderSkeleton(8);
      const data = await sf("/api/obligations");
      const all = Array.isArray(data) ? data : (data?.items ?? data?.obligations ?? []);
      const tabs = ["All","Open","Overdue","Closed"];
      let active = "All";
      const tabsEl = document.getElementById("obl-tabs");
      function render() {
        const rows = active === "All" ? all : all.filter(o => (o.status||"").toLowerCase() === active.toLowerCase());
        SC.renderTable({
          container: document.getElementById("obl-table"),
          headers: ["ID","Title","Regulation","Due Date","Status"],
          rows: rows.map(o => ({
            cells: [SC.esc(o.id||o.obligationId||""), SC.esc(o.title||""), SC.esc(o.regulation||o.source||""), SC.esc((o.dueDate||o.due||"").slice(0,10)), SC.renderBadge(o.status||"open")],
            data: o,
          })),
          onRowClick: o => SC.openModal({ title: o.title||"Obligation", body: SC.renderDefList(o) }),
          emptyMessage: "No obligations",
        });
      }
      tabsEl.innerHTML = tabs.map(t => `<button class="tab-btn${t===active?" active":""}" data-tab="${t}">${t}</button>`).join("");
      tabsEl.addEventListener("click", e => {
        const b = e.target.closest(".tab-btn"); if (!b) return;
        active = b.dataset.tab;
        tabsEl.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x.dataset.tab===active));
        render();
      });
      render();
    })();
  </script>
</body>
</html>
