# Owen — governance-cycle prep (autonomous run)
#
# Weekly forum-prep digest per Owen's operating spec § Cadence.
# Per CLAUDE.md Principle 7 (Autonomous by default).

name: Owen governance-cycle prep

on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        run: bun run agent:owen-governance-cycle-prep
      - run: |
          git config user.name "owen-agent[bot]"
          git config user.email "agent-owen@scrooge.local"
          git pull --rebase origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Owen — governance-cycle prep ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-owen-governance-cycle-prep.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).

          Co-Authored-By: Owen (agent) <agent-owen@scrooge.local>"
          git push
