# Nolan — hiring cycle (autonomous run)
#
# Weekly hiring cycle per Nolan's operating spec § 6 (Cadence).
# Per CLAUDE.md Principle 6 (Autonomous by default).
#
# Stub handler — Slice 2b of D-AGENT-AUTONOMY-OPERATIONAL closes the
# specWithoutHandler violation; full implementation is a roadmap item.

name: Nolan hiring cycle

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:nolan-hiring-cycle
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "nolan-agent[bot]"
          git config user.email "agent-nolan@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Nolan — hiring cycle ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-nolan-hiring-cycle.yml.
          Per CLAUDE.md Principle 6 (Autonomous by default).
          Slice 2b stub under D-AGENT-AUTONOMY-OPERATIONAL.

          Co-Authored-By: Nolan (agent) <agent-nolan@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
