# Owen — goal-loop cohort-1 (autonomous run)
#
# Daily goal-loop tick at 07:00 UTC for Owen (Company Secretary, governance).
# Tracks governance cycle state, outstanding CEO decisions, pending briefs, and
# corporate secretarial obligations; evaluates whether autonomous action is
# warranted per Owen's §9 decisions-in-scope set.
#
# Cohort-1 activation: gate D-T-01-PERMISSION-GATE-SECURE-DEFAULT cleared 2026-05-12.
# Shadow mode for first 2 ticks (handler runs with dryRun=true per spec §4).
# After 2 successful shadow ticks, the handler executes live.
#
# Authority: D-AGENT-AUTONOMY-OPERATIONAL Slice 3, D-T-01-PERMISSION-GATE-SECURE-DEFAULT.
# Per CLAUDE.md Principle 6 (Autonomous by default).

name: Owen goal-loop

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: prototype
        run: bun install --frozen-lockfile

      - name: Sync event store from Neon (pre-run)
        working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync

      - name: Run Owen goal-loop
        working-directory: prototype
        run: bun run agent:owen-goal-loop

      - name: Sync event store to Neon (post-run)
        working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync

      - name: Commit deliverable
        run: |
          git config user.name "owen-agent[bot]"
          git config user.email "agent-owen@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit; Owen goal-loop produced no deliverable diff."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Owen — goal-loop ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-owen-goal-loop.yml.
          Cohort-1 activation per D-T-01-PERMISSION-GATE-SECURE-DEFAULT.
          Per CLAUDE.md Principle 6 (Autonomous by default).

          Co-Authored-By: Owen (agent) <agent-owen@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
