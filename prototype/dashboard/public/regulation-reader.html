<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regulation Reader — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
  <style>
    /* ── Regulation Reader layout ─────────────────────────────────── */
    .rr-layout {
      display: flex;
      gap: var(--space-4);
      height: calc(100vh - var(--topbar-height) - 110px);
      overflow: hidden;
    }

    #rr-detail {
      flex: 1;
      min-height: 0;
    }

    /* Left sidebar */
    .rr-sidebar {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
      padding-right: var(--space-3);
    }
    .rr-sidebar-title {
      font: var(--text-label);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: var(--space-3) 0 var(--space-2);
      flex-shrink: 0;
    }
    .rr-instrument-item {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      padding: var(--space-3);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 0.1s;
      border: 1px solid transparent;
    }
    .rr-instrument-item:hover {
      background: var(--color-surface-hover);
    }
    .rr-instrument-item.active {
      background: var(--color-surface-hover);
      border-color: var(--color-accent);
    }
    .rr-instrument-name {
      font: var(--text-body);
      font-weight: 600;
      color: var(--color-text);
    }
    .rr-instrument-meta {
      display: flex;
      gap: var(--space-2);
      align-items: center;
      flex-wrap: wrap;
    }
    .rr-year {
      font: var(--text-small);
      color: var(--color-text-muted);
    }
    .rr-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 10px;
      font: var(--text-small);
      font-weight: 500;
    }
    .rr-badge-obl {
      background: color-mix(in srgb, var(--color-accent) 12%, transparent);
      color: var(--color-accent);
    }
    .rr-badge-text {
      background: color-mix(in srgb, var(--color-success, #22c55e) 15%, transparent);
      color: color-mix(in srgb, var(--color-success, #22c55e) 80%, black);
    }
    .rr-badge-summary {
      background: color-mix(in srgb, var(--color-text-muted) 15%, transparent);
      color: var(--color-text-muted);
    }

    /* Main content area */
    .rr-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .rr-main-header {
      flex-shrink: 0;
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-3);
    }
    .rr-main-title {
      font: var(--text-heading);
      color: var(--color-text);
      margin: 0 0 var(--space-1);
    }
    .rr-main-subtitle {
      font: var(--text-small);
      color: var(--color-text-muted);
    }
    .rr-search-bar {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }
    .rr-search-input {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font: var(--text-body);
      background: var(--color-bg);
      color: var(--color-text);
      outline: none;
    }
    .rr-search-input:focus {
      border-color: var(--color-accent);
    }
    .rr-search-count {
      font: var(--text-small);
      color: var(--color-text-muted);
      align-self: center;
    }

    /* Scrollable sections area */
    .rr-sections-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: var(--space-2);
    }

    /* Chapter */
    .rr-chapter {
      margin-bottom: var(--space-5);
    }
    .rr-chapter-heading {
      font: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      padding: var(--space-2) 0;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-3);
    }

    /* Section */
    .rr-section {
      margin-bottom: var(--space-4);
      padding: var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      transition: border-color 0.15s;
    }
    .rr-section:target,
    .rr-section.highlight {
      border-color: var(--color-accent);
      background: color-mix(in srgb, var(--color-accent) 4%, transparent);
    }
    .rr-section-header {
      display: flex;
      align-items: baseline;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }
    .rr-section-number {
      font: var(--text-body);
      font-weight: 700;
      color: var(--color-accent);
      flex-shrink: 0;
    }
    .rr-section-heading {
      font: var(--text-body);
      font-weight: 600;
      color: var(--color-text);
    }
    .rr-section-text {
      font: var(--text-body);
      color: var(--color-text);
      line-height: 1.6;
      margin-bottom: var(--space-2);
    }
    .rr-section-text.verbatim {
      background: color-mix(in srgb, var(--color-text-muted) 5%, transparent);
      border-left: 3px solid var(--color-accent);
      padding: var(--space-2) var(--space-3);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-family: var(--font-mono, monospace);
      font-size: 0.85em;
    }
    .rr-summary-note {
      font: var(--text-small);
      color: var(--color-text-muted);
      font-style: italic;
      margin-top: var(--space-1);
    }

    /* Obligation cards */
    .rr-obligations {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--color-border);
    }
    .rr-obl-label {
      font: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      font-size: 0.7rem;
      margin-bottom: var(--space-1);
    }
    .rr-obl-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      padding: var(--space-2) var(--space-3);
      background: var(--color-surface-hover);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
    }
    .rr-obl-header {
      display: flex;
      gap: var(--space-2);
      align-items: center;
      flex-wrap: wrap;
    }
    .rr-obl-id {
      font: var(--text-small);
      font-weight: 700;
      font-family: var(--font-mono, monospace);
      color: var(--color-accent);
    }
    .rr-obl-status {
      font: var(--text-small);
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 10px;
    }
    .rr-obl-status-in-force {
      background: color-mix(in srgb, var(--color-success, #22c55e) 15%, transparent);
      color: color-mix(in srgb, var(--color-success, #22c55e) 80%, black);
    }
    .rr-obl-status-partial {
      background: color-mix(in srgb, #f59e0b 15%, transparent);
      color: #92400e;
    }
    .rr-obl-status-drafting {
      background: color-mix(in srgb, #6366f1 15%, transparent);
      color: #3730a3;
    }
    .rr-obl-status-planned {
      background: color-mix(in srgb, var(--color-text-muted) 15%, transparent);
      color: var(--color-text-muted);
    }
    .rr-obl-status-not-applicable {
      background: color-mix(in srgb, var(--color-text-muted) 8%, transparent);
      color: var(--color-text-muted);
    }
    .rr-obl-req {
      font: var(--text-small);
      color: var(--color-text);
      line-height: 1.5;
    }
    .rr-obl-policy {
      font: var(--text-small);
      color: var(--color-accent);
      text-decoration: none;
    }
    .rr-obl-policy:hover {
      text-decoration: underline;
    }

    /* Hidden sections (search filter) */
    .rr-section.hidden { display: none; }

    /* Skeleton */
    .rr-skeleton {
      padding: var(--space-4);
      color: var(--color-text-muted);
      font: var(--text-body);
    }

    @media (max-width: 768px) {
      .rr-layout {
        flex-direction: column;
        height: auto;
      }
      .rr-sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
        max-height: 200px;
        padding-right: 0;
        padding-bottom: var(--space-3);
      }
      .rr-sections-scroll {
        overflow-y: visible;
      }
    }
  </style>
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Regulation Reader</h1></div>
    <div class="page-body" style="padding:0">
      <div class="rr-layout">
        <!-- Left sidebar: instrument list -->
        <aside class="rr-sidebar" id="rr-sidebar">
          <div class="rr-sidebar-title">Instruments</div>
          <div id="rr-instrument-list">
            <div class="rr-skeleton">Loading…</div>
          </div>
        </aside>

        <!-- Main content: instrument detail -->
        <section class="rr-main" id="rr-main">
          <div class="rr-skeleton" id="rr-placeholder">
            Select an instrument to read.
          </div>
          <div id="rr-detail" style="display:none;flex-direction:column;overflow:hidden">
            <div class="rr-main-header" id="rr-header"></div>
            <div class="rr-search-bar">
              <input
                type="search"
                class="rr-search-input"
                id="rr-search"
                placeholder="Search sections…"
                aria-label="Search sections"
              >
              <span class="rr-search-count" id="rr-search-count" aria-live="polite"></span>
            </div>
            <div class="rr-sections-scroll" id="rr-sections"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script src="/regulation-reader.js"></script>
</body>
</html>
