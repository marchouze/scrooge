# Yael — tax readiness (autonomous run)
#
# Weekly tax-readiness snapshot per Yael's operating spec § 6 (Cadence).
# Per CLAUDE.md Principle 7 (Autonomous by default).
#
# Twelfth handler in the fleet-rollout sequence under D-FLEET-ROLLOUT-SEQUENCING
# (approved 2026-05-08). Engineer-side counterpart to Camille's CFO-domain
# financial-position-snapshot — pairs the way Rohan/Helena and Bea/Camille
# pair: Yael drafts; Camille signs.

name: Yael tax readiness

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:yael-tax-readiness
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "yael-agent[bot]"
          git config user.email "agent-yael@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Yael — tax readiness ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-yael-tax-readiness.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).
          Fleet-rollout under D-FLEET-ROLLOUT-SEQUENCING.

          Co-Authored-By: Yael (agent) <agent-yael@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
