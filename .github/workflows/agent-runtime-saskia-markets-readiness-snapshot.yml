# Saskia — markets-readiness snapshot (autonomous run)
#
# Weekly markets-readiness snapshot per Saskia's operating spec § 6 (Cadence).
# Per CLAUDE.md Principle 7 (Autonomous by default).
#
# Tenth handler in the fleet-rollout sequence under D-FLEET-ROLLOUT-SEQUENCING
# (approved 2026-05-08).

name: Saskia markets-readiness snapshot

on:
  schedule:
    # Mon 05:33 UTC — weekly, off-the-hour to dodge GH Actions cron
    # drops observed 2026-05-08; A2.1 scheduler closes permanently.
    - cron: "33 5 * * MON"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:saskia-markets-readiness-snapshot
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "saskia-agent[bot]"
          git config user.email "agent-saskia@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Saskia — markets-readiness snapshot ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-saskia-markets-readiness-snapshot.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).
          Fleet-rollout under D-FLEET-ROLLOUT-SEQUENCING.

          Co-Authored-By: Saskia (agent) <agent-saskia@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
