# Senna — security substrate state (autonomous run)
#
# Weekly inventory of the security substrate per Senna's operating spec
# § Cadence. Per CLAUDE.md Principle 7 (Autonomous by default).

name: Senna security substrate state

on:
  schedule:
    - cron: "0 7 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        run: bun run agent:senna-security-substrate-state
      - run: |
          git config user.name "senna-agent[bot]"
          git config user.email "agent-senna@scrooge.local"
          git pull --rebase origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Senna — security substrate state ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-senna-security-substrate-state.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).

          Co-Authored-By: Senna (agent) <agent-senna@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase origin main

          done
