<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NPA Product — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <style>
    /* NPA product-detail page — product description + visual views. */
    .np-subnav { position: sticky; top: 0; display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 0; margin-bottom: 8px; background: var(--color-bg); z-index: 5; border-bottom: 1px solid var(--color-border); }
    .np-subnav a { font: var(--text-caption); color: var(--color-text-secondary); text-decoration: none; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--color-border); }
    .np-subnav a:hover { color: var(--color-accent); border-color: var(--color-accent); }
    .np-prose { max-width: 82ch; line-height: 1.55; color: var(--color-text-primary); margin: 8px 0; }
    .np-rule { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; line-height: 1.5; color: var(--color-text-secondary); margin: 8px 0; }
    .np-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .np-chip { font: var(--text-caption); background: var(--color-surface-raised); border: 1px solid var(--color-border); border-radius: 999px; padding: 3px 10px; color: var(--color-text-primary); }
    .np-facts { display: flex; flex-wrap: wrap; gap: 20px; margin: 10px 0; }
    .np-fact { min-width: 120px; }
    .np-fact b { display: block; font: var(--text-caption); color: var(--color-text-secondary); font-weight: 600; margin-bottom: 2px; }
    .np-fact span { font-size: 14px; color: var(--color-text-primary); }
    .np-variant-grid, .np-lens-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin: 10px 0; }
    .np-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 14px; }
    .np-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; color: var(--color-text-primary); }
    .np-kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 13px; border-bottom: 1px dashed var(--color-border); }
    .np-kv:last-child { border-bottom: 0; }
    .np-kv b { color: var(--color-text-secondary); font-weight: 600; }
    .np-kv span { color: var(--color-text-primary); text-align: right; }
    .np-svg-wrap { overflow-x: auto; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 12px; margin: 10px 0; }
    .np-legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 6px 2px 0; font: var(--text-caption); color: var(--color-text-secondary); }
    .np-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .np-legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .np-empty { color: var(--color-text-secondary); font-style: italic; padding: 8px 0; }
    .np-card-note { font-size: 12px; color: var(--color-text-secondary); margin-top: 6px; line-height: 1.5; }
  </style>
</head>
<body data-provenance-source="/api/v2/npa">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <span data-provenance-badge="page-top"></span>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script src="/v2/_v2-data.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    const id = new URLSearchParams(location.search).get("id");
    const esc = v2Esc;

    renderPageHeader(main, {
      crumbs: [
        { label: "Executive", href: "/v2/index.html" },
        { label: "Governance", href: "/v2/governance/index.html" },
        { label: "New Product Approval", href: "/v2/governance/npa.html" },
        { label: id || "Detail" },
      ],
      title: id ? `Product: ${id}` : "NPA Product Detail",
    });

    const bodyHost = document.createElement("div"); main.appendChild(bodyHost);

    // ── shared badge + section helpers ────────────────────────────────
    const dimBadge = (s) => {
      const v = s === "implementation-attested" ? "success" : s === "design-attested" ? "info" : s === "failed" ? "danger" : "warning";
      return `<span class="v2-badge v2-badge-${v}">${esc(s)}</span>`;
    };
    const sevBadge = (s) => `<span class="v2-badge v2-badge-${s === "critical" ? "danger" : s === "high" ? "warning" : "neutral"}">${esc(s)}</span>`;

    function section(host, anchor, title) {
      const sec = document.createElement("div");
      sec.className = "v2-section"; sec.id = anchor;
      const h = document.createElement("h2"); h.className = "v2-section-title"; h.textContent = title;
      sec.appendChild(h); host.appendChild(sec);
      return sec;
    }

    // ── SVG group palette ─────────────────────────────────────────────
    const GROUP_COLOR = {
      fx: "var(--color-accent)", cash: "var(--color-success)", "cash-flow": "var(--color-success)",
      bond: "var(--color-info)", ir: "var(--color-info)", equity: "var(--color-warning)",
      settlement: "var(--color-info)", schedule: "var(--color-text-secondary)",
      party: "var(--color-text-secondary)", primitive: "var(--color-text-secondary)",
    };
    const groupColor = (g) => GROUP_COLOR[g] || "var(--color-text-secondary)";

    function wrapLabel(text, x, y, fill) {
      const words = String(text).split(/\s+/);
      const lines = []; let cur = "";
      for (const w of words) {
        if ((cur + " " + w).trim().length > 13) { if (cur) lines.push(cur); cur = w; } else cur = (cur + " " + w).trim();
      }
      if (cur) lines.push(cur);
      const startY = y - (lines.length - 1) * 7;
      return lines.map((ln, i) => `<text x="${x}" y="${startY + i * 14 + 4}" text-anchor="middle" font-size="11" fill="${fill}">${esc(ln)}</text>`).join("");
    }

    function svgWrap(host, svg) {
      const w = document.createElement("div"); w.className = "np-svg-wrap"; w.innerHTML = svg; host.appendChild(w);
    }

    // ── §1 visual: lifecycle stepper ──────────────────────────────────
    function renderLifecycleFlow(host, events) {
      if (!events || !events.length) { host.insertAdjacentHTML("beforeend", `<p class="np-empty">No lifecycle event family declared for this product.</p>`); return; }
      const W = 168, H = 46, GAP = 30, PAD = 10;
      const total = events.length * W + (events.length - 1) * GAP + PAD * 2;
      let x = PAD; const parts = [];
      events.forEach((ev, i) => {
        const short = ev.length > 19 ? ev.slice(0, 18) + "…" : ev;
        parts.push(`<g><rect x="${x}" y="14" width="${W}" height="${H}" rx="8" fill="var(--color-accent-bg)" stroke="var(--color-accent)"/><text x="${x + W / 2}" y="${14 + H / 2 + 4}" text-anchor="middle" font-size="12" fill="var(--color-text-primary)">${esc(short)}</text><title>${esc(ev)}</title></g>`);
        if (i < events.length - 1) { const ax = x + W; parts.push(`<line x1="${ax}" y1="${14 + H / 2}" x2="${ax + GAP}" y2="${14 + H / 2}" stroke="var(--color-border-strong)" stroke-width="2" marker-end="url(#arrowGrey)"/>`); }
        x += W + GAP;
      });
      svgWrap(host, `<svg width="${total}" height="78" viewBox="0 0 ${total} 78" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrowGrey" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--color-border-strong)"/></marker></defs>${parts.join("")}</svg>`);
    }

    // ── §3 visual: component-interaction graph ────────────────────────
    function renderComponentGraph(host, graph) {
      if (!graph || !graph.nodes || !graph.nodes.length) { host.insertAdjacentHTML("beforeend", `<p class="np-empty">Composition not yet attested for this product.</p>`); return; }
      const W = 720, H = 500, cx = 360, cy = 200, R = 150;
      const prims = graph.nodes.filter((n) => n.id !== "materialised");
      const mat = graph.nodes.find((n) => n.id === "materialised");
      const pos = { product: [cx, cy] };
      prims.forEach((n, i) => {
        const ang = -Math.PI / 2 + i * (2 * Math.PI / prims.length);
        pos[n.id] = [Math.round(cx + R * Math.cos(ang)), Math.round(cy + R * Math.sin(ang))];
      });
      if (mat) pos.materialised = [cx, cy + R + 90];

      const edges = (graph.edges || []).map((e) => {
        const a = pos[e.from], b = pos[e.to]; if (!a || !b) return "";
        if (e.kind === "materialises") {
          const mx = Math.round((a[0] + b[0]) / 2), my = Math.round((a[1] + b[1]) / 2);
          return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--color-success)" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/><text x="${mx + 12}" y="${my}" font-size="11" fill="var(--color-success)">${esc(e.label)}</text>`;
        }
        return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--color-border-strong)" stroke-width="1"/>`;
      }).join("");

      const circle = (n) => {
        const [x, y] = pos[n.id]; const col = groupColor(n.group);
        return `<g><circle cx="${x}" cy="${y}" r="40" fill="var(--color-bg)" stroke="${col}" stroke-width="3"/>${wrapLabel(n.label, x, y, "var(--color-text-primary)")}<title>${esc(n.detail)}</title></g>`;
      };
      const nodeSvg = prims.map(circle).join("") + (mat ? circle(mat) : "");
      const [hx, hy] = pos.product;
      const hubName = graph.hubLabel.length > 28 ? graph.hubLabel.slice(0, 27) + "…" : graph.hubLabel;
      const hub = `<g><rect x="${hx - 80}" y="${hy - 26}" width="160" height="52" rx="10" fill="var(--color-accent)"/>${wrapLabel(hubName, hx, hy, "#ffffff")}<title>${esc(graph.hubLabel)}</title></g>`;

      svgWrap(host, `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--color-success)"/></marker></defs>${edges}${hub}${nodeSvg}</svg>`);

      const groups = [...new Set(graph.nodes.map((n) => n.group))];
      const legend = groups.map((g) => `<span><i style="background:${groupColor(g)}"></i>${esc(g)}</span>`).join("");
      host.insertAdjacentHTML("beforeend", `<div class="np-legend"><span><i style="background:var(--color-accent)"></i>product</span>${legend}<span style="margin-left:auto">— composes &nbsp; ┄ materialises (lifecycle interaction)</span></div>`);
    }

    // ── §4 visual: cross-bank lens map ────────────────────────────────
    function renderLensMap(host, lenses, hubLabel) {
      const W = 760, H = 380, cx = 380, cy = 190;
      const corners = [[180, 86], [580, 86], [180, 294], [580, 294]];
      const items = [
        { key: "Markets", lines: [lenses.markets.bookLabel, lenses.markets.desks.map((d) => d.deskName).join(", ") || "—"] },
        { key: "Finance", lines: [lenses.finance.frtbBook === "trading" ? "FRTB trading book" : "FRTB banking book", "IFRS 9 " + lenses.finance.ifrs9Family.toUpperCase()] },
        { key: "Risk", lines: [lenses.risk.marketRiskDimensions.join(" + ") || "—", lenses.risk.measuredByModels.join(", ") || "no scoped model"] },
        { key: "Compliance", lines: [lenses.compliance.attestedCount + "/" + lenses.compliance.totalDimensions + " dimensions attested", "Master agr: " + lenses.compliance.masterAgreement] },
      ];
      const lines = corners.map((c) => `<line x1="${cx}" y1="${cy}" x2="${c[0]}" y2="${c[1]}" stroke="var(--color-border-strong)" stroke-width="1"/>`).join("");
      const boxes = items.map((it, i) => {
        const [px, py] = corners[i];
        const trunc = (s) => (s.length > 34 ? s.slice(0, 33) + "…" : s);
        const l1 = `<text x="${px}" y="${py + 4}" text-anchor="middle" font-size="12" fill="var(--color-text-primary)">${esc(trunc(it.lines[0]))}</text>`;
        const l2 = `<text x="${px}" y="${py + 22}" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">${esc(trunc(it.lines[1]))}</text>`;
        return `<g><rect x="${px - 112}" y="${py - 42}" width="224" height="86" rx="8" fill="var(--color-surface)" stroke="var(--color-accent)"/><text x="${px}" y="${py - 20}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--color-accent)">${esc(it.key)}</text>${l1}${l2}</g>`;
      }).join("");
      const hubName = hubLabel.length > 24 ? hubLabel.slice(0, 23) + "…" : hubLabel;
      const hub = `<g><circle cx="${cx}" cy="${cy}" r="52" fill="var(--color-accent)"/>${wrapLabel(hubName, cx, cy, "#ffffff")}<title>${esc(hubLabel)}</title></g>`;
      svgWrap(host, `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${lines}${boxes}${hub}</svg>`);
    }

    if (!id) {
      v2RenderError(bodyHost, `no product selected — choose from the <a href="/v2/governance/npa.html">NPA register</a>.`);
    } else {
      v2WireLoader(async () => {
        bodyHost.replaceChildren();
        let d;
        try {
          d = await v2Fetch(`/api/v2/npa/${encodeURIComponent(id)}`);
        } catch (err) {
          v2RenderError(bodyHost, esc(err.message));
          return;
        }
        document.getElementById("as-of").textContent = `as of ${new Date(d.asOf).toLocaleString()}`;

        const dims = d.dimensions || [];
        const attested = dims.filter((x) => x.attestation && x.attestation.status !== "pending").length;
        const fullyAttested = dims.filter((x) => x.attestation && x.attestation.status === "implementation-attested").length;
        const openFindings = (d.postApprovalFindings || []).filter((f) => f.status !== "reviewed").length;
        const ov = d.overview || {};
        const lenses = d.lenses;

        // ── in-page nav ──────────────────────────────────────────────
        const nav = document.createElement("nav"); nav.className = "np-subnav";
        nav.innerHTML = [
          ["overview", "How it operates"], ["variants", "Variants"],
          ...(d.fxContractualTerms ? [["contractual-terms", "Contractual terms"]] : []),
          ["components", "Components"],
          ["lenses", "Across the bank"], ["governance", "Governance"],
        ].map(([a, t]) => `<a href="#${a}">${t}</a>`).join("");
        bodyHost.appendChild(nav);

        // ── hero tiles ───────────────────────────────────────────────
        renderTileGroup(bodyHost, {
          tiles: [
            { label: "Lifecycle", value: esc(ov.lifecycle || "—"), unit: `${esc(ov.assetClassLabel || "")} · ${esc(ov.currency || "")}` },
            { label: "Asset class", value: esc(ov.assetClassLabel || "—"), unit: esc((d.product && d.product.family) || "") },
            { label: "Book", value: lenses ? esc(lenses.markets.bookLabel) : "—", unit: lenses ? `FRTB ${esc(lenses.finance.frtbBook)}` : "" },
            { label: "Dimensions attested", value: `${attested}/${dims.length}`, unit: `${fullyAttested} implementation-attested`, variant: fullyAttested === dims.length && dims.length > 0 ? "success" : "warning" },
          ],
        });

        // ── §1 Overview — how it operates ────────────────────────────
        const s1 = section(bodyHost, "overview", "How it operates");
        s1.insertAdjacentHTML("beforeend", `<p class="np-prose">${esc(ov.description || "")}</p>`);
        if (ov.scope) {
          const chips = [
            `Venue: ${ov.scope.executionVenue}`, `Pairs: ${ov.scope.currencyPairs}`,
            `Counterparties: ${ov.scope.counterpartyEligibility}`,
          ].concat((ov.scope.instrumentVariants || []).map((v) => `Variant: ${v}`));
          s1.insertAdjacentHTML("beforeend", `<div class="np-chips">${chips.map((c) => `<span class="np-chip">${esc(c)}</span>`).join("")}</div>`);
        }
        s1.insertAdjacentHTML("beforeend", `<div class="np-facts">` + [
          ["Franchise", ov.franchiseScope], ["Settlement", ov.settlementPath], ["Reconciliation", ov.reconciliationCadence],
          ["Legal entity", ov.legalEntityId], ["Currency", ov.currency], ["Jurisdiction", ov.jurisdiction],
        ].map(([k, v]) => `<div class="np-fact"><b>${esc(k)}</b><span>${esc(v || "—")}</span></div>`).join("") + `</div>`);
        s1.insertAdjacentHTML("beforeend", `<div class="np-rule"><b>Composition rule</b>\n${esc(ov.compositionRule || "—")}</div>`);
        s1.insertAdjacentHTML("beforeend", `<h3 style="font-size:14px;margin:14px 0 0;color:var(--color-text-secondary)">Trade lifecycle</h3>`);
        renderLifecycleFlow(s1, (d.product && d.product.lifecycleEventFamily) || []);

        // ── §2 Variants ──────────────────────────────────────────────
        const s2 = section(bodyHost, "variants", "Variants");
        const variants = d.variants || [];
        if (!variants.length) {
          s2.insertAdjacentHTML("beforeend", `<p class="np-empty">This product trades as a single instrument form — no operating sub-variants are modelled.</p>`);
        } else {
          const grid = document.createElement("div"); grid.className = "np-variant-grid";
          grid.innerHTML = variants.map((v) => {
            const badge = v.status === "in-scope" ? `<span class="v2-badge v2-badge-success">in scope</span>` : `<span class="v2-badge v2-badge-warning">planned</span>`;
            return `<div class="np-card"><h3>${esc(v.label)} ${badge}</h3><div class="np-card-note">${esc(v.note)}</div></div>`;
          }).join("");
          s2.appendChild(grid);
        }

        // ── §2b Contractual terms — booked FX buy/sell quad ───────────
        // Sourced from a real live `fx` FIL instance (D-FX-INSTRUMENT-BUYSELL-QUAD).
        // Rendered ONLY when the server populated it; never fabricated.
        if (d.fxContractualTerms) {
          const ct = d.fxContractualTerms;
          const s2b = section(bodyHost, "contractual-terms", "Contractual terms");
          s2b.insertAdjacentHTML("beforeend", `<p class="np-prose">The booked agreement states both sides of the exchange. On settlement the bank receives the buy leg and delivers the sell leg — sourced from a representative booked trade.</p>`);
          const grid = document.createElement("div"); grid.className = "np-lens-grid";
          grid.innerHTML = `<div class="np-card"><h3>Agreement (buy / sell quad)</h3>` +
            `<div class="np-kv"><b>Bank buys</b><span>${esc(ct.buyAmount)} ${esc(ct.buyCurrency)}</span></div>` +
            `<div class="np-kv"><b>Bank sells</b><span>${esc(ct.sellAmount)} ${esc(ct.sellCurrency)}</span></div>` +
            `<div class="np-kv"><b>Settlement date</b><span>${esc(ct.settlementDate)}</span></div>` +
            `<div class="np-card-note">Source: <code>${esc(ct.sourceInstanceUrn)}</code> — representative booked trade, as-of page load.</div></div>`;
          s2b.appendChild(grid);
        }

        // ── §3 Components & how they interact ────────────────────────
        const s3 = section(bodyHost, "components", "Components & how they interact");
        s3.insertAdjacentHTML("beforeend", `<p class="np-prose">The product is composed from typed CDM building blocks. The diagram shows each component the product <em>composes</em>; a dashed green edge marks a lifecycle <em>interaction</em> — for FX, the trade settles into a first-class Cash balance.</p>`);
        renderComponentGraph(s3, d.componentGraph || { nodes: [], edges: [] });
        renderTable(s3, {
          columns: ["Component", "Plays role", "Group"],
          emptyMsg: "No components attested.",
          rows: ((d.componentGraph && d.componentGraph.nodes) || []).map((n) => ({
            cells: [`<strong>${esc(n.label)}</strong>`, esc(n.detail), `<span class="np-chip">${esc(n.group)}</span>`],
          })),
        });

        // ── §4 Across the bank — cross-lens ──────────────────────────
        const s4 = section(bodyHost, "lenses", "How the bank sees it");
        if (!lenses) {
          s4.insertAdjacentHTML("beforeend", `<p class="np-empty">Cross-bank lens view not available for this product.</p>`);
        } else {
          renderLensMap(s4, lenses, ov.assetClassLabel || (d.product && d.product.name) || "Product");
          const grid = document.createElement("div"); grid.className = "np-lens-grid"; s4.appendChild(grid);

          // Markets
          const mk = lenses.markets;
          grid.insertAdjacentHTML("beforeend", `<div class="np-card"><h3>📈 Markets</h3>` +
            `<div class="np-kv"><b>Book</b><span>${esc(mk.bookLabel)}</span></div>` +
            mk.desks.map((dk) => `<div class="np-kv"><b>${esc(dk.deskName)}</b><span>${esc(dk.deskKind)}</span></div>`).join("") +
            `<div class="np-card-note">${esc(mk.eligibility)}</div></div>`);

          // Finance
          const fi = lenses.finance;
          grid.insertAdjacentHTML("beforeend", `<div class="np-card"><h3>📊 Finance</h3>` +
            `<div class="np-kv"><b>FRTB book</b><span>${esc(fi.frtbBook)}</span></div>` +
            `<div class="np-kv"><b>IFRS 9</b><span>${esc(fi.ifrs9Family)}</span></div>` +
            `<div class="np-kv"><b>IFRS 13</b><span>${esc(fi.ifrs13FairValueHierarchy)}</span></div>` +
            `<div class="np-kv"><b>IAS 21</b><span>${esc(fi.ias21FxTreatment)}</span></div>` +
            fi.baReturnCells.map((c) => `<div class="np-kv"><b>${esc(c.cell)}</b><span>${esc(c.lens)}</span></div>`).join("") +
            `<div class="np-card-note">${esc(fi.frtbRationale)}</div></div>`);

          // Risk
          const rk = lenses.risk;
          grid.insertAdjacentHTML("beforeend", `<div class="np-card"><h3>⚠️ Risk</h3>` +
            `<div class="np-kv"><b>Market risk</b><span>${esc(rk.marketRiskDimensions.join(", ") || "—")}</span></div>` +
            `<div class="np-kv"><b>Credit risk</b><span>${esc(rk.creditRiskShape)}</span></div>` +
            `<div class="np-kv"><b>Liquidity</b><span>${esc(rk.liquidityClassification)}</span></div>` +
            `<div class="np-kv"><b>Funding</b><span>${esc(rk.fundingProfile)}</span></div>` +
            `<div class="np-kv"><b>Model tier</b><span>${esc(rk.modelRiskTier)}</span></div>` +
            `<div class="np-card-note">Models scoped to this asset class: ${rk.measuredByModels.length ? rk.measuredByModels.map((m) => `<span class="np-chip">${esc(m)}</span>`).join(" ") : "none"}</div></div>`);

          // Compliance
          const cp = lenses.compliance;
          grid.insertAdjacentHTML("beforeend", `<div class="np-card"><h3>✔️ Compliance</h3>` +
            `<div class="np-kv"><b>Attested</b><span>${cp.attestedCount}/${cp.totalDimensions}</span></div>` +
            `<div class="np-kv"><b>Lifecycle</b><span>${esc(cp.lifecycle)}</span></div>` +
            `<div class="np-kv"><b>Master agreement</b><span>${esc(cp.masterAgreement)}</span></div>` +
            `<div class="np-card-note">Obligations: ${cp.obligationCitations.slice(0, 8).map((c) => `<span class="np-chip">${esc(c)}</span>`).join(" ")}</div></div>`);
        }

        // ── §5 Governance deep-dive (retained) ───────────────────────
        const gov = section(bodyHost, "governance", "Governance deep-dive");
        renderTileGroup(gov, {
          tiles: [
            { label: "Open findings", value: String(openFindings), unit: "post-approval", variant: openFindings > 0 ? "danger" : "success" },
            { label: "Jurisdiction", value: esc(ov.jurisdiction || "—"), unit: "legal entity scope" },
          ],
        });

        // attestation matrix
        gov.insertAdjacentHTML("beforeend", `<h3 style="font-size:14px;margin:14px 0 4px;color:var(--color-text-secondary)">Attestation matrix (${dims.length} dimensions)</h3>`);
        renderTable(gov, {
          columns: ["Dimension", "Status", "Attested", "Accountable seat"],
          emptyMsg: "No dimension cards.",
          rows: dims.map((x) => ({
            cells: [
              `<strong>${esc(x.label || x.dimension)}</strong>`,
              dimBadge(x.attestation ? x.attestation.status : "pending"),
              esc(x.attestation && x.attestation.attestedAt ? x.attestation.attestedAt : "—"),
              esc(x.owner ? x.owner.position : "—"),
            ],
          })),
        });

        // accounting treatment
        const at = d.accountingTreatment;
        if (at) {
          gov.insertAdjacentHTML("beforeend", `<h3 style="font-size:14px;margin:14px 0 4px;color:var(--color-text-secondary)">Accounting treatment</h3>`);
          gov.insertAdjacentHTML("beforeend",
            `<p class="np-prose"><strong>IFRS 9:</strong> ${esc(at.ifrs9Family)} &nbsp;·&nbsp; <strong>IFRS 13:</strong> ${esc(at.ifrs13FairValueHierarchy)} &nbsp;·&nbsp; <strong>IAS 21:</strong> ${esc(at.ias21FxTreatment)} &nbsp;·&nbsp; <strong>BA-return lines:</strong> ${esc((at.baReturnLineMapping || []).join(", ") || "—")}</p>`);
          renderTable(gov, {
            columns: ["Posting rule", "Trigger event", "Stage", "IFRS citation", "Status"],
            emptyMsg: "No posting rules mapped for this asset class.",
            rows: (at.postingRules || []).map((r) => ({
              cells: [
                `<strong>${esc(r.postingRuleId)}</strong>`, esc(r.triggerEventType), esc(r.lifecycleStage), esc(r.ifrs),
                r.deferred ? `<span class="v2-badge v2-badge-warning">deferred: ${esc(r.deferredTargetTrigger || "tracked gap")}</span>` : `<span class="v2-badge v2-badge-success">active</span>`,
              ],
            })),
          });
        }

        // post-approval findings
        gov.insertAdjacentHTML("beforeend", `<h3 style="font-size:14px;margin:14px 0 4px;color:var(--color-text-secondary)">Post-approval findings</h3>`);
        renderTable(gov, {
          columns: ["Finding", "Severity", "Missed dimension", "Status", "Discovered"],
          emptyMsg: "No post-approval findings.",
          rows: (d.postApprovalFindings || []).map((f) => ({
            cells: [
              esc(f.title), sevBadge(f.severity), esc(f.missedDimension),
              `<span class="v2-badge v2-badge-${f.status === "reviewed" ? "success" : f.status === "overdue" ? "danger" : "warning"}">${esc(f.status)}</span>`,
              esc(f.discoveredAt),
            ],
          })),
        });

        // lifecycle event journal
        gov.insertAdjacentHTML("beforeend", `<h3 style="font-size:14px;margin:14px 0 4px;color:var(--color-text-secondary)">Lifecycle event journal</h3>`);
        renderTable(gov, {
          columns: ["Event type", "Posting rule"],
          emptyMsg: "No lifecycle events mapped.",
          rows: (d.journalEntries || []).map((j) => ({
            cells: [
              `<a href="/v2/operations/schemas.html?type=${encodeURIComponent(j.eventType)}">${esc(j.eventType)}</a>`,
              j.status === "present" ? esc(j.rule ? j.rule.ruleId || "mapped" : "mapped") : `<span class="v2-badge v2-badge-warning">no posting rule</span>`,
            ],
          })),
        });

        renderRefs(bodyHost, {
          refs: [
            { label: "D-NEW-PRODUCT-APPROVAL-POLICY", href: "#" },
            { label: "Back to NPA register", href: "/v2/governance/npa.html" },
          ],
        });
      });
    }
  </script>
</body>
</html>
