<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operations — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Operations</h1></div>
    <div class="page-body">
      <div id="ops-tiles" class="tile-row"></div>
      <div id="ws-header"></div>
      <div id="ws-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Operations" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      const state = await sf("/api/state");
      const tilesEl = document.getElementById("ops-tiles");
      const ws = state?.inFlight ?? [];
      const active = ws.filter(w => w.active).length;
      tilesEl.appendChild(SC.renderTile({ label:"Active Workstreams", value:active, status:active>0?"info":"ok" }));
      tilesEl.appendChild(SC.renderTile({ label:"Procedures", value:"View", href:"/procedures.html", status:"info" }));
      document.getElementById("ws-header").innerHTML = SC.renderSectionHeader("In-Flight Workstreams", null);
      SC.renderTable({
        container: document.getElementById("ws-table"),
        headers: ["Owner","Workstream","Due","Status"],
        rows: ws.map(w => ({
          cells: [SC.esc(w.owner||""), SC.esc(w.what||w.title||""), SC.esc((w.due||"").slice(0,10)), SC.renderBadge(w.active?"active":"idle")],
          data: w,
        })),
        onRowClick: w => SC.openModal({ title: w.what||w.title||"Workstream", body: SC.renderDefList(w) }),
        emptyMessage: "No in-flight workstreams",
      });
    })();
  </script>
</body>
</html>
