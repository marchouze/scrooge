<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Substrate — Scrooge V2</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Scrooge Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [{ label: "Executive", href: "/v2/index.html" }, { label: "Operations", href: "/v2/operations/index.html" }, { label: "Substrate" }],
      title: "Substrate Health",
      seat: "COO · Devon  ·  Platform Architect · Atlas",
    });
    renderTileGroup(main, {
      tiles: [
        { label: "Total Events", unit: "In canonical store" },
        { label: "V1-only Types", unit: "Ratchet count (target: 0)" },
        { label: "Store-tee Active", unit: "V2-parallel types" },
        { label: "Substrate Alerts", unit: "High / Critical" },
      ],
    });
    const s = document.createElement("div"); s.className = "v2-section"; main.appendChild(s);
    const h = document.createElement("h2"); h.className = "v2-section-title"; h.textContent = "V1-only Type Ratchet"; s.appendChild(h);
    renderTable(s, { columns: ["Type Name", "V2 Status", "Bucket", "Emission Sites", "Flip Blocker"] });
    const s2 = document.createElement("div"); s2.className = "v2-section"; main.appendChild(s2);
    const h2 = document.createElement("h2"); h2.className = "v2-section-title"; h2.textContent = "Substrate Alerts"; s2.appendChild(h2);
    renderTable(s2, { columns: ["Alert ID", "Class", "Severity", "Message", "Raised At", "Status"] });
    renderRefs(main, {
      refs: [
        { label: "D-BANK-WIDE-V2-MIGRATION", href: "#" },
        { label: "recon:v1-removal-ratchet gate", href: "#" },
        { label: "D-ENGINEERING-INTEGRITY-CHARTER", href: "#" },
        { label: "SubstrateAlert event schema", href: "#" },
      ],
    });
  </script>
</body>
</html>
