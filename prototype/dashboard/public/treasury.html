<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treasury — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
  <style>
    .treasury-section { margin-bottom: 2rem; }
    .treasury-card {
      background: var(--color-surface, #fff);
      border: 1px solid var(--color-border, #e2e8f0);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .treasury-card h3 {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--color-text-secondary, #64748b);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .alert-banner {
      padding: 0.6rem 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .alert-banner.danger { background: #fee2e2; border-left: 4px solid #dc2626; color: #991b1b; }
    .alert-banner.warn  { background: #fffbeb; border-left: 4px solid #f59e0b; color: #92400e; }
    .gaps-toggle {
      background: none;
      border: none;
      color: var(--color-accent, #2563eb);
      cursor: pointer;
      font-size: 0.875rem;
      padding: 0;
      text-decoration: underline;
    }
    .gaps-list { margin: 0.5rem 0 0; padding-left: 1.2rem; font-size: 0.82rem; color: #92400e; }
    .gaps-list li { margin-bottom: 0.25rem; word-break: break-word; }
    .irrbb-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .irrbb-table th { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 2px solid var(--color-border, #e2e8f0); font-weight: 600; }
    .irrbb-table td { padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--color-border, #e2e8f0); }
    .irrbb-table tr.worst-case td { background: #fef3c7; font-weight: 600; }
    .bar-chart { margin: 0; padding: 0; list-style: none; }
    .bar-row { display: flex; align-items: center; margin-bottom: 0.4rem; font-size: 0.82rem; gap: 0.5rem; }
    .bar-label { width: 3.5rem; flex-shrink: 0; color: var(--color-text-secondary, #64748b); font-weight: 500; }
    .bar-track { flex: 1; display: flex; gap: 2px; }
    .bar-rsa { height: 14px; background: #2563eb; border-radius: 2px; min-width: 2px; }
    .bar-rsl { height: 14px; background: #dc2626; border-radius: 2px; min-width: 2px; }
    .bar-gap-val { width: 6rem; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .cap-breach { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 3px; font-size: 0.78rem; font-weight: 600; background: #fffbeb; color: #92400e; border: 1px solid #f59e0b; margin-left: 0.4rem; }
    .stub-row { font-size: 0.9rem; color: var(--color-text-secondary, #64748b); padding: 0.4rem 0; }
    .stub-note { font-size: 0.8rem; font-style: italic; color: var(--color-text-secondary, #64748b); margin-top: 0.5rem; }
    .ftp-badge { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 3px; font-size: 0.8rem; background: var(--color-surface-alt, #f1f5f9); border: 1px solid var(--color-border, #e2e8f0); margin-left: 0.4rem; }
    .zero-note { color: var(--color-text-secondary, #64748b); font-size: 0.875rem; font-style: italic; }
  </style>
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header">
      <h1 class="page-title">Treasury</h1>
    </div>
    <div class="page-body">

      <!-- Section 1: Capital -->
      <div class="treasury-section">
        <div id="capital-header"></div>
        <div id="capital-alert"></div>
        <div id="capital-tiles" class="tile-row"></div>
      </div>

      <!-- Section 2: Liquidity -->
      <div class="treasury-section">
        <div id="liquidity-header"></div>
        <div id="liquidity-tiles" class="tile-row"></div>
        <div id="alm-gaps-banner"></div>
      </div>

      <!-- Section 3: IRRBB -->
      <div class="treasury-section">
        <div id="irrbb-header"></div>
        <div id="irrbb-eve" class="treasury-card"></div>
        <div id="irrbb-nii" class="treasury-card"></div>
        <div id="irrbb-repricing" class="treasury-card"></div>
      </div>

      <!-- Section 4: Collateral -->
      <div class="treasury-section">
        <div id="collateral-header"></div>
        <div id="collateral-tiles" class="tile-row"></div>
        <div id="collateral-caps"></div>
      </div>

      <!-- Section 5: FTP -->
      <div class="treasury-section">
        <div id="ftp-header"></div>
        <div id="ftp-tiles" class="tile-row"></div>
      </div>

      <!-- Section 6: Repo Book -->
      <div class="treasury-section">
        <div id="repo-header"></div>
        <div id="repo-body" class="treasury-card"></div>
      </div>

      <!-- Section 7: Deposit Book -->
      <div class="treasury-section">
        <div id="deposit-header"></div>
        <div id="deposit-body" class="treasury-card"></div>
      </div>

      <!-- Section 8: IB Placement Book -->
      <div class="treasury-section">
        <div id="ib-header"></div>
        <div id="ib-body" class="treasury-card"></div>
      </div>

    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Treasury" });

    (async () => {
      async function sf(u) {
        try {
          const r = await fetch(u, { headers: { Accept: "application/json" } });
          return r.ok ? r.json() : null;
        } catch { return null; }
      }

      const data = await sf("/api/treasury");
      if (!data) {
        document.querySelector(".page-body").innerHTML = "<p>Failed to load treasury data.</p>";
        return;
      }

      // ── helpers ────────────────────────────────────────────────────────────
      function zarFmt(v) {
        if (v == null || v === 0) return "R 0";
        const abs = Math.abs(v);
        let s;
        if (abs >= 1e9) s = `R ${(v / 1e9).toFixed(2)}bn`;
        else if (abs >= 1e6) s = `R ${(v / 1e6).toFixed(2)}m`;
        else if (abs >= 1e3) s = `R ${(v / 1e3).toFixed(1)}k`;
        else s = `R ${v.toFixed(0)}`;
        return s;
      }

      function ratioFmt(v) {
        if (v == null) return "N/A";
        return `${parseFloat(v).toFixed(1)}%`;
      }

      function statusToTileStatus(s) {
        if (!s) return null;
        if (s === "above-minimum" || s === "green") return "ok";
        if (s === "at-minimum" || s === "amber") return "warn";
        if (s === "below-minimum" || s === "red" || s === "no-positions") return "danger";
        return null;
      }

      // ── Section 1 — Capital ─────────────────────────────────────────────
      document.getElementById("capital-header").innerHTML =
        SC.renderSectionHeader("Capital Adequacy", null);

      const cap = data.capital ?? {};

      if (cap.critical) {
        const banner = document.getElementById("capital-alert");
        banner.innerHTML = `<div class="alert-banner danger">
          Critical: Capital headroom below TICR. Immediate CEO escalation required.
        </div>`;
      }

      const capTiles = document.getElementById("capital-tiles");

      const cet1Tile = SC.renderTile({
        label: "CET1 Ratio",
        value: cap.cet1RatioPct ?? "—",
        sub: `min 8%${cap.buildPhase ? " — build phase" : ""}`,
        status: statusToTileStatus(cap.status),
        onClick: () => SC.openModal({ title: "CET1 Ratio", body: SC.renderDefList(cap) }),
      });
      capTiles.appendChild(cet1Tile);

      const headroomTile = SC.renderTile({
        label: "Capital Headroom",
        value: zarFmt(cap.headroomZar),
        sub: `TICR: ${zarFmt(cap.ticrZar)}`,
        status: statusToTileStatus(cap.status),
        onClick: () => SC.openModal({ title: "Capital Headroom", body: SC.renderDefList(cap) }),
      });
      capTiles.appendChild(headroomTile);

      // ── Section 2 — Liquidity ──────────────────────────────────────────
      document.getElementById("liquidity-header").innerHTML =
        SC.renderSectionHeader("Liquidity", null);

      const liq = data.liquidity ?? {};
      const lcrData = liq.lcr ?? {};
      const nsfrData = liq.nsfr ?? {};
      const collData = data.collateral ?? {};
      const liqTiles = document.getElementById("liquidity-tiles");

      liqTiles.appendChild(SC.renderTile({
        label: "LCR (T+30)",
        value: ratioFmt(lcrData.ratio),
        sub: "min 100%",
        status: statusToTileStatus(lcrData.status),
        onClick: () => SC.openModal({ title: "LCR Detail", body: SC.renderDefList(lcrData) }),
      }));

      liqTiles.appendChild(SC.renderTile({
        label: "NSFR",
        value: ratioFmt(nsfrData.ratio),
        sub: "min 100%",
        status: statusToTileStatus(nsfrData.status),
        onClick: () => SC.openModal({ title: "NSFR Detail", body: SC.renderDefList(nsfrData) }),
      }));

      const hqlaSub = collData.l1Zar != null
        ? `L1: ${zarFmt(collData.l1Zar)} | L2a: ${zarFmt(collData.l2aZar)} | L2b: ${zarFmt(collData.l2bZar)}`
        : "";
      liqTiles.appendChild(SC.renderTile({
        label: "HQLA Buffer",
        value: zarFmt(collData.totalHQLAZar),
        sub: hqlaSub,
        status: null,
        onClick: () => SC.openModal({ title: "HQLA Buffer", body: SC.renderDefList(collData) }),
      }));

      // ALM gaps banner
      const gaps = liq.almGaps ?? [];
      if (gaps.length > 0) {
        const gapsBanner = document.getElementById("alm-gaps-banner");
        const listId = "alm-gaps-list";
        gapsBanner.innerHTML = `<div class="alert-banner warn">
          <strong>ALM Substrate Gaps (${gaps.length})</strong>
          — liquidity ratios are build-phase baselines.
          <button class="gaps-toggle" onclick="
            var el = document.getElementById('${listId}');
            el.style.display = el.style.display === 'none' ? '' : 'none';
          ">Show / hide</button>
          <ul id="${listId}" class="gaps-list" style="display:none">
            ${gaps.map(g => `<li>${SC.esc(g)}</li>`).join("")}
          </ul>
        </div>`;
      }

      // ── Section 3 — IRRBB ──────────────────────────────────────────────
      document.getElementById("irrbb-header").innerHTML =
        SC.renderSectionHeader("IRRBB — Interest Rate Risk in the Banking Book", null);

      const irrbb = data.irrbb ?? {};

      // EVE card
      const eveEl = document.getElementById("irrbb-eve");
      const eveData = irrbb.eve ?? {};
      eveEl.innerHTML = `<h3>ΔEVE — Economic Value of Equity Sensitivity</h3>`;
      if (eveData.status === "zero-positions") {
        eveEl.innerHTML += `<p class="zero-note">No rate-sensitive positions — ΔEVE = 0 across all shock scenarios (build phase posture, BCBS d365).</p>`;
      } else {
        const scenarios = eveData.scenarios ?? [];
        const worstAbs = scenarios.reduce((max, s) => Math.max(max, Math.abs(s.deltaEveZar)), 0);
        const tableRows = scenarios.map(s => {
          const isWorst = Math.abs(s.deltaEveZar) === worstAbs && worstAbs > 0;
          return `<tr${isWorst ? ' class="worst-case"' : ""}>
            <td>${SC.esc(s.description)}</td>
            <td style="text-align:right">${zarFmt(s.deltaEveZar)}</td>
            <td style="text-align:right">${s.deltaEvePctTier1 != null ? `${(s.deltaEvePctTier1 * 100).toFixed(2)}%` : "—"}</td>
          </tr>`;
        }).join("");
        eveEl.innerHTML += `<table class="irrbb-table">
          <thead><tr><th>Shock Scenario</th><th style="text-align:right">ΔEVE ZAR</th><th style="text-align:right">ΔEVE % Tier 1</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>`;
      }

      // NII card
      const niiEl = document.getElementById("irrbb-nii");
      const niiData = irrbb.nii ?? {};
      niiEl.innerHTML = `<h3>ΔNII — Net Interest Income Sensitivity (12-month horizon)</h3>`;
      if (niiData.status === "zero-positions") {
        niiEl.innerHTML += `<p class="zero-note">No rate-sensitive positions — ΔNII = 0 across all shock scenarios (build phase posture, BCBS d365).</p>`;
      } else {
        const scenarios = niiData.scenarios ?? [];
        const worstAbs = scenarios.reduce((max, s) => Math.max(max, Math.abs(s.deltaNiiZar)), 0);
        const tableRows = scenarios.map(s => {
          const isWorst = Math.abs(s.deltaNiiZar) === worstAbs && worstAbs > 0;
          return `<tr${isWorst ? ' class="worst-case"' : ""}>
            <td>${SC.esc(s.description)}</td>
            <td style="text-align:right">${zarFmt(s.deltaNiiZar)}</td>
          </tr>`;
        }).join("");
        niiEl.innerHTML += `<table class="irrbb-table">
          <thead><tr><th>Shock Scenario</th><th style="text-align:right">ΔNII ZAR</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>`;
      }

      // Repricing gap bar chart
      const repEl = document.getElementById("irrbb-repricing");
      const repData = irrbb.repricingGap ?? {};
      const repRows = repData.rows ?? [];
      repEl.innerHTML = `<h3>Repricing Gap Schedule (BCBS 319 buckets)</h3>`;
      if (repData.status === "zero-positions" || repRows.length === 0) {
        repEl.innerHTML += `<p class="zero-note">No rate-sensitive positions — all buckets at zero (build phase posture).</p>`;
      } else {
        const maxVal = repRows.reduce((m, r) => Math.max(m, Math.abs(r.rsaZar), Math.abs(r.rslZar)), 1);
        const barWidth = 180; // px track width
        const barsHtml = repRows.slice(0, 10).map(r => {
          const rsaW = Math.max(2, (Math.abs(r.rsaZar) / maxVal) * barWidth);
          const rslW = Math.max(2, (Math.abs(r.rslZar) / maxVal) * barWidth);
          return `<li class="bar-row">
            <span class="bar-label">${SC.esc(r.bucket)}</span>
            <span class="bar-track">
              <span class="bar-rsa" style="width:${rsaW.toFixed(0)}px" title="RSA: ${zarFmt(r.rsaZar)}"></span>
              <span class="bar-rsl" style="width:${rslW.toFixed(0)}px" title="RSL: ${zarFmt(r.rslZar)}"></span>
            </span>
            <span class="bar-gap-val" style="color:${r.gapZar >= 0 ? "#2563eb" : "#dc2626"}">${zarFmt(r.gapZar)}</span>
          </li>`;
        }).join("");
        repEl.innerHTML += `
          <div style="font-size:0.78rem;color:var(--color-text-secondary,#64748b);margin-bottom:0.5rem">
            <span style="display:inline-block;width:14px;height:10px;background:#2563eb;border-radius:2px;vertical-align:middle;margin-right:4px"></span>RSA
            &nbsp;
            <span style="display:inline-block;width:14px;height:10px;background:#dc2626;border-radius:2px;vertical-align:middle;margin-right:4px"></span>RSL
            &nbsp; Gap value →
          </div>
          <ul class="bar-chart">${barsHtml}</ul>`;
      }

      // ── Section 4 — Collateral ─────────────────────────────────────────
      document.getElementById("collateral-header").innerHTML =
        SC.renderSectionHeader("Collateral & HQLA", null);

      const collTiles = document.getElementById("collateral-tiles");

      collTiles.appendChild(SC.renderTile({
        label: "L1 HQLA",
        value: zarFmt(collData.l1Zar),
        sub: "0% haircut",
        status: null,
        onClick: () => SC.openModal({ title: "L1 HQLA", body: SC.renderDefList({ ...collData }) }),
      }));
      collTiles.appendChild(SC.renderTile({
        label: "L2a HQLA",
        value: zarFmt(collData.l2aZar),
        sub: "15% haircut",
        status: null,
        onClick: () => SC.openModal({ title: "L2a HQLA", body: SC.renderDefList({ ...collData }) }),
      }));
      collTiles.appendChild(SC.renderTile({
        label: "L2b HQLA",
        value: zarFmt(collData.l2bZar),
        sub: "25% haircut",
        status: null,
        onClick: () => SC.openModal({ title: "L2b HQLA", body: SC.renderDefList({ ...collData }) }),
      }));

      // Cap breach badges
      const capsEl = document.getElementById("collateral-caps");
      let capsHtml = "";
      if (collData.l2CapBreached) capsHtml += `<span class="cap-breach">L2 cap breached (&gt;40%)</span>`;
      if (collData.l2bCapBreached) capsHtml += `<span class="cap-breach">L2b cap breached (&gt;15%)</span>`;
      if (capsHtml) capsEl.innerHTML = `<div style="margin-top:0.5rem">${capsHtml}</div>`;

      // ── Section 5 — FTP ────────────────────────────────────────────────
      document.getElementById("ftp-header").innerHTML =
        SC.renderSectionHeader("Funds Transfer Pricing", null);

      const ftpData = data.ftp ?? {};
      const ftpTiles = document.getElementById("ftp-tiles");

      ftpTiles.appendChild(SC.renderTile({
        label: "Wtd Avg Spread",
        value: ftpData.weightedAvgSpreadBps != null ? `${ftpData.weightedAvgSpreadBps.toFixed(1)} bps` : "—",
        sub: ftpData.activeCurveId ? `Curve: ${ftpData.activeCurveId}` : "No curve published",
        status: null,
        onClick: () => SC.openModal({ title: "FTP Portfolio", body: SC.renderDefList(ftpData) }),
      }));

      ftpTiles.appendChild(SC.renderTile({
        label: "Attributions",
        value: ftpData.totalAttributions != null ? `${ftpData.totalAttributions}` : "0",
        sub: "in event log",
        status: null,
        onClick: () => SC.openModal({ title: "FTP Attributions", body: SC.renderDefList(ftpData) }),
      }));

      // ── Section 6 — Repo Book ──────────────────────────────────────────
      document.getElementById("repo-header").innerHTML =
        SC.renderSectionHeader("Repo Book", null);
      const repoData = data.repoBook ?? {};
      document.getElementById("repo-body").innerHTML = `
        <div class="stub-row">
          Open: <strong>${repoData.openCount ?? 0}</strong>
          &nbsp;|&nbsp;
          Cash lent: <strong>${zarFmt(repoData.totalCashLentZar)}</strong>
          &nbsp;|&nbsp;
          Avg rate: <strong>${repoData.weightedAvgRateDecimal != null ? (repoData.weightedAvgRateDecimal * 100).toFixed(2) + "%" : "—"}</strong>
        </div>`;

      // ── Section 7 — Deposit Book ───────────────────────────────────────
      document.getElementById("deposit-header").innerHTML =
        SC.renderSectionHeader("Deposit Book", null);
      const depData = data.depositBook ?? {};
      document.getElementById("deposit-body").innerHTML = `
        <div class="stub-row">
          Open: <strong>${depData.openCount ?? 0}</strong>
          &nbsp;|&nbsp;
          Total principal: <strong>${zarFmt(depData.totalPrincipalZar)}</strong>
        </div>`;

      // ── Section 8 — IB Placement Book ─────────────────────────────────
      document.getElementById("ib-header").innerHTML =
        SC.renderSectionHeader("IB Placement Book", null);
      const ibData = data.ibPlacementBook ?? {};
      document.getElementById("ib-body").innerHTML = `
        <div class="stub-row">
          Open: <strong>${ibData.openCount ?? 0}</strong>
          &nbsp;|&nbsp;
          Total placed: <strong>${zarFmt(ibData.totalPlacedZar)}</strong>
          &nbsp;|&nbsp;
          Fixed-term: <strong>${zarFmt(ibData.fixedTermZar)}</strong>
          &nbsp;|&nbsp;
          Call: <strong>${zarFmt(ibData.callZar)}</strong>
        </div>`;

    })();
  </script>
</body>
</html>
