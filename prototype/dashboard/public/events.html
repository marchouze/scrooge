<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
  <style>
    .ev-toolbar { display:flex; gap:var(--space-2); flex-wrap:wrap; align-items:center; margin-bottom:var(--space-4); }
    .ev-toolbar input, .ev-toolbar select {
      font:var(--text-body); padding:var(--space-2) var(--space-3);
      border:1px solid var(--color-border); border-radius:var(--radius-md);
      background:var(--color-bg); color:var(--color-text-primary); min-width:0;
    }
    .ev-toolbar input[type="search"] { flex:1 1 180px; }
    .ev-toolbar .ev-count { margin-left:auto; font:var(--text-caption); color:var(--color-text-secondary); white-space:nowrap; }
    .ev-type { font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--color-accent); }
    .ev-id { font-family:var(--font-mono); font-size:11px; color:var(--color-text-secondary); max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ev-seq { font-family:var(--font-mono); font-size:11px; color:var(--color-text-disabled); }
    .ev-prov { display:inline-block; font-size:11px; padding:1px 6px; border-radius:var(--radius-sm); background:var(--color-info-bg); color:var(--color-info); white-space:nowrap; }
    .ev-prov.prod { background:var(--color-success-bg); color:var(--color-success); }
    .ev-prov.sim { background:var(--color-warning-bg); color:var(--color-warning); }
    .ev-pagination { display:flex; gap:var(--space-1); align-items:center; margin-top:var(--space-3); flex-wrap:wrap; }
    .ev-pagination button { font:var(--text-body); padding:var(--space-1) var(--space-3); border:1px solid var(--color-border); border-radius:var(--radius-sm); background:var(--color-bg); cursor:pointer; }
    .ev-pagination button:disabled { opacity:.4; cursor:default; }
    .ev-pagination button.active { background:var(--color-accent); color:#fff; border-color:var(--color-accent); }
    .ev-pagination .ev-page-info { font:var(--text-caption); color:var(--color-text-secondary); margin:0 var(--space-1); }
    #ev-detail { display:none; margin-top:var(--space-4); }
  </style>
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header">
      <h1 class="page-title">Events <span id="store-count-badge" style="font:var(--text-caption);color:var(--color-text-secondary)"></span></h1>
    </div>
    <div class="page-body">
      <div class="ev-toolbar">
        <input type="search" id="search-input" placeholder="Search type or payload…" autocomplete="off">
        <select id="type-select"><option value="">All types</option></select>
        <select id="provenance-select">
          <option value="all">All provenance</option>
          <option value="production-only">Production only</option>
          <option value="simulated-only">Simulated only</option>
        </select>
        <button id="clear-btn" class="btn btn-secondary">Clear</button>
        <span class="ev-count" id="result-count"></span>
      </div>
      <div class="table-wrap">
        <table aria-label="Events">
          <thead><tr><th>#</th><th>Type</th><th>as_of</th><th>Entity</th><th>Actor</th><th>Prov</th><th>event_id</th></tr></thead>
          <tbody id="ev-tbody"><tr><td colspan="7" class="table-empty">Loading…</td></tr></tbody>
        </table>
      </div>
      <div class="ev-pagination" id="pagination"></div>
      <div id="ev-detail" class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)">
          <span class="card-title" id="ev-detail-type" style="font-family:var(--font-mono)">—</span>
          <button id="ev-detail-close" class="btn btn-secondary" style="padding:var(--space-1) var(--space-3)">Close</button>
        </div>
        <pre id="ev-detail-json" style="margin:0"></pre>
      </div>
      <p id="ev-detail-hint" style="color:var(--color-text-secondary);font:var(--text-caption);margin-top:var(--space-3)">Click any row to see full event JSON.</p>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>initShell({ title: "Events" });</script>
  <script src="/events.js"></script>
</body>
</html>
