<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risk — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header">
      <h1 class="page-title">Risk</h1>
    </div>
    <div class="page-body">
      <div id="ras-header"></div>
      <div id="ras-tiles" class="tile-row"></div>
      <div id="stress-header"></div>
      <div id="stress-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Risk" });
    (async () => {
      async function sf(u) {
        try { const r = await fetch(u, { headers: { Accept: "application/json" } }); return r.ok ? r.json() : null; } catch { return null; }
      }
      const state = await sf("/api/state");

      // RAS clusters — limitUtilisations (B1–B5)
      document.getElementById("ras-header").innerHTML = SC.renderSectionHeader("RAS Clusters (B1–B5)", null);
      const clusters = state?.limitUtilisations ?? [];
      const tilesEl = document.getElementById("ras-tiles");
      if (clusters.length === 0) {
        tilesEl.innerHTML = `<p style="color:var(--color-text-secondary)">No RAS data available.</p>`;
      } else {
        const ragToStatus = { green: "ok", amber: "warn", red: "danger" };
        clusters.forEach(c => {
          const t = SC.renderTile({
            label: c.cluster || c.limitName || "",
            value: c.utilisationPct != null ? `${c.utilisationPct}%` : "—",
            sub: c.limitValue ? `limit: ${c.limitValue.toLocaleString()} ${c.currency}` : c.limitName,
            status: ragToStatus[c.ragStatus] ?? null,
            onClick: () => SC.openModal({ title: c.cluster || "Cluster", body: SC.renderDefList(c) }),
          });
          tilesEl.appendChild(t);
        });
      }

      // Vera findings
      document.getElementById("stress-header").innerHTML = SC.renderSectionHeader("Vera Findings", null);
      const findings = state?.findings ?? [];
      SC.renderTable({
        container: document.getElementById("stress-table"),
        headers: ["Finding", "Principle", "Severity", "As Of"],
        rows: findings.map(f => ({
          cells: [SC.esc(f.id || ""), SC.esc(f.principle || ""), SC.renderBadge(f.severity || "info"), SC.esc((f.asOf || "").slice(0, 10))],
          data: f,
        })),
        onRowClick: f => SC.openModal({ title: f.id || "Finding", body: SC.renderDefList(f) }),
        emptyMessage: "No findings",
      });
    })();
  </script>
</body>
</html>
