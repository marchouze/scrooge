<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decisions register — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>

  <div class="page-header" style="padding: var(--space-4) var(--space-6) 0;">
    <h1 style="margin:0 0 var(--space-2);">Decisions register</h1>
    <p class="muted" style="margin:0 0 var(--space-4);">All decisions across all authorities — CEO, CRO, CoSec, Board, AC, BRC, ALCO, CFO, COO, CISO, CAE, IO, CCO, Agent. Sourced from the <code>Decision</code> event store.</p>
  </div>

  <div id="filterBar" style="padding: 0 var(--space-6) var(--space-3); display:flex; flex-wrap:wrap; gap:var(--space-3); align-items:center;">
    <!-- Status toggle -->
    <fieldset style="border:none;padding:0;margin:0;display:flex;gap:var(--space-2);align-items:center;">
      <legend style="font-size:0.75rem;color:var(--muted);margin-right:var(--space-2);float:left;line-height:1.8;">Status</legend>
      <label class="filter-radio"><input type="radio" name="statusFilter" value="all" checked> All</label>
      <label class="filter-radio"><input type="radio" name="statusFilter" value="open"> Open</label>
      <label class="filter-radio"><input type="radio" name="statusFilter" value="resolved"> Resolved</label>
    </fieldset>

    <!-- Authority filter -->
    <div id="authorityFilter" style="display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;">
      <span style="font-size:0.75rem;color:var(--muted);">Authority</span>
      <label class="filter-radio"><input type="checkbox" id="authAll" checked> All</label>
      <span id="authorityCheckboxes"></span>
    </div>

    <!-- Search -->
    <input
      id="searchInput"
      type="search"
      placeholder="Search ID or title…"
      style="flex:1;min-width:180px;max-width:320px;padding:var(--space-1) var(--space-2);border:1px solid var(--border);border-radius:4px;font-size:0.85rem;"
      aria-label="Search decisions by ID or title"
    >
  </div>

  <div id="decisionsContent" style="padding: 0 var(--space-6) var(--space-6);">
    <p class="muted">Loading…</p>
  </div>


</main>

  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script src="/decisions.js"></script>
  <script>initShell({ title: "Decisions" });</script>
</body>
</html>
