# Atlas — substrate-state weekly snapshot (autonomous run)
#
# Snapshots the engineering substrate's own state on a weekly cadence
# per Atlas's operating spec § 6 (Cadence). Per CLAUDE.md Principle 7
# (Autonomous by default) — no human in the loop.
#
# Outputs:
#   - <date>_atlas_substrate-state.md committed to /Owner Inbox/.
#   - SubstrateStateSnapshot event appended to the run-host's local event
#     store (cloud-substrate at M8 makes this shared).

name: Atlas substrate-state

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: prototype
        run: bun install --frozen-lockfile

      - name: Sync event store from Neon (pre-run)
        working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - name: Run Atlas substrate-state
        working-directory: prototype
        run: bun run agent:atlas-substrate-state
      - name: Sync event store to Neon (post-run)
        working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync

      - name: Commit deliverable
        run: |
          git config user.name "atlas-agent[bot]"
          git config user.email "agent-atlas@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit; Atlas's substrate-state run produced no deliverable diff."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Atlas — substrate state ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-atlas-substrate-state.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).

          Co-Authored-By: Atlas (agent) <agent-atlas@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
