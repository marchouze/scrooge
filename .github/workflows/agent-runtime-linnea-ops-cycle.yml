# Linnea — ops cycle (autonomous run)
#
# Weekly ops cycle per Linnea's operating spec § 6 (Cadence).
# Per CLAUDE.md Principle 6 (Autonomous by default).
#
# Stub handler — Slice 2b of D-AGENT-AUTONOMY-OPERATIONAL closes the
# specWithoutHandler violation; full implementation is a roadmap item.

name: Linnea ops cycle

on:
  schedule:
    # Tue 08:29 UTC — weekly, off-the-hour to avoid GH Actions cron drops.
    - cron: "29 8 * * TUE"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:linnea-ops-cycle
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "linnea-agent[bot]"
          git config user.email "agent-linnea@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Linnea — ops cycle ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-linnea-ops-cycle.yml.
          Per CLAUDE.md Principle 6 (Autonomous by default).
          Slice 2b stub under D-AGENT-AUTONOMY-OPERATIONAL.

          Co-Authored-By: Linnea (agent) <agent-linnea@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
