<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Policies — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Policies</h1></div>
    <div class="page-body">
      <div style="display:flex;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap">
        <div id="pol-tabs" class="tab-bar" style="flex:1"></div>
        <select id="pol-owner" style="padding:var(--space-2) var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);font:var(--text-body);background:var(--color-bg)"><option value="">All owners</option></select>
      </div>
      <div id="pol-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Policies" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      document.getElementById("pol-table").innerHTML = SC.renderSkeleton(8);
      const [data, oblData] = await Promise.all([sf("/api/state"), sf("/api/obligations")]);
      const all = data?.policies ?? [];
      const oblById = oblData?.byId ?? {};
      const sc = Object.fromEntries(Object.entries(
        all.reduce((acc, p) => { acc[p.status||""]=(acc[p.status||""]||0)+1; return acc; }, {})
      ));
      const TABS = [
        { label: `All (${all.length})`, filter: null },
        { label: `In Force (${sc["IN FORCE"]??0})`, filter: "IN FORCE" },
        { label: `Drafting (${sc.DRAFTING??0})`, filter: "DRAFTING" },
        { label: `Planned (${sc.PLANNED??0})`, filter: "PLANNED" },
        { label: `Exists (${sc.EXISTS??0})`, filter: "EXISTS" },
      ];
      let activeFilter = null, ownerFilter = "";
      const tabsEl = document.getElementById("pol-tabs");
      const ownerEl = document.getElementById("pol-owner");
      const owners = [...new Set(all.map(p => p.owner||"").filter(Boolean))].sort();
      owners.forEach(o => { const opt = document.createElement("option"); opt.value = o; opt.textContent = o; ownerEl.appendChild(opt); });

      function mdToHtml(md) {
        const body = md.replace(/^---[\s\S]*?---\n?/, "");
        return body
          .replace(/^#### (.+)$/gm, "<h4 style='font:var(--text-h3);margin:var(--space-4) 0 var(--space-2)'>$1</h4>")
          .replace(/^### (.+)$/gm, "<h3 style='font:var(--text-h2);margin:var(--space-5) 0 var(--space-2)'>$1</h3>")
          .replace(/^## (.+)$/gm, "<h2 style='font:var(--text-h1);margin:var(--space-6) 0 var(--space-3);border-bottom:1px solid var(--color-border);padding-bottom:var(--space-2)'>$1</h2>")
          .replace(/^# (.+)$/gm, "")
          .replace(/^> (.+)$/gm, "<blockquote style='border-left:3px solid var(--color-border);margin:var(--space-3) 0;padding:var(--space-2) var(--space-4);color:var(--color-text-secondary);font:var(--text-body)'>$1</blockquote>")
          .replace(/^- (.+)$/gm, "<li style='margin:var(--space-1) 0'>$1</li>")
          .replace(/(<li[\s\S]*?<\/li>)/g, "<ul style='margin:var(--space-2) 0;padding-left:var(--space-5)'>$1</ul>")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code style='font-family:monospace;background:var(--color-surface-raised);padding:1px 4px;border-radius:3px;font-size:0.875em'>$1</code>")
          .replace(/^(?!<[h|u|b|l])(.+)$/gm, "<p style='font:var(--text-body);margin:var(--space-2) 0'>$1</p>")
          .replace(/<p[^>]*>\s*<\/p>/g, "");
      }

      function policyModal(p) {
        const row = (label, val) => val ? `<dt style="font-weight:600;color:var(--color-text-secondary);white-space:nowrap">${SC.esc(label)}</dt><dd style="word-break:break-word">${val}</dd>` : "";
        const meta = `<dl style="display:grid;grid-template-columns:auto 1fr;gap:var(--space-2) var(--space-4);font:var(--text-body);margin-bottom:var(--space-6)">
          ${row("Domain", SC.esc(p.domain||""))}
          ${row("Owner", SC.esc(p.owner||""))}
          ${row("Approval", SC.esc(p.approval||""))}
          ${row("Cadence", SC.esc(p.cadence||""))}
          ${row("Status", SC.renderBadge(p.status||""))}
          ${row("Citation", SC.esc(p.citation||""))}
          ${row("Binds", (p.binds||[]).map(b => SC.renderBadge(b)).join(" "))}
          ${row("MVP", p.mvp != null ? SC.esc(String(p.mvp)) : "")}
          ${row("Status detail", SC.esc(p.statusRaw||""))}
        </dl>`;
        const oblIds = Array.isArray(p.linkedObligations) ? p.linkedObligations : [];
        const oblSection = oblIds.length ? `
          <div style="font:var(--text-h3);margin-bottom:var(--space-3)">Linked Obligations (${oblIds.length})</div>
          <dl style="display:grid;grid-template-columns:auto 1fr;gap:var(--space-2) var(--space-4);font:var(--text-body);margin-bottom:var(--space-6)">
            ${oblIds.map(id => {
              const o = oblById[id];
              return `<dt style="font-weight:600;color:var(--color-text-secondary);white-space:nowrap">${SC.esc(id)}</dt><dd style="word-break:break-word">${SC.esc(o?.requirement||"—")}</dd>`;
            }).join("")}
          </dl>` : "";
        const docFile = (p.sourceFiles||[]).find(f => f.startsWith("Policies/"));
        if (docFile) {
          const container = document.createElement("div");
          container.innerHTML = meta + oblSection + `<div style="font:var(--text-h3);margin-bottom:var(--space-3)">Policy Document</div><div id="pol-doc-body">${SC.renderSkeleton(4)}</div>`;
          fetch(`/api/policy/${encodeURIComponent(docFile)}`)
            .then(r => r.ok ? r.text() : null)
            .then(md => {
              const el = container.querySelector("#pol-doc-body");
              if (el) el.innerHTML = md ? mdToHtml(md) : `<p style="color:var(--color-text-secondary)">Document not available.</p>`;
            });
          return container;
        }
        return meta + oblSection;
      }

      function render() {
        let rows = activeFilter ? all.filter(p => p.status === activeFilter) : all;
        if (ownerFilter) rows = rows.filter(p => p.owner === ownerFilter);
        SC.renderTable({
          container: document.getElementById("pol-table"),
          headers: ["Name","Domain","Owner","Approval","Status","Obligations"],
          rows: rows.map(p => ({
            cells: [SC.esc(p.name||""), SC.esc((p.domain||"").replace(/^\d+\.\s*/,"")), SC.esc(p.owner||""), SC.esc(p.approval||""), SC.renderBadge(p.status||""), SC.esc(Array.isArray(p.linkedObligations)?String(p.linkedObligations.length):"—")],
            data: p,
          })),
          onRowClick: p => SC.openModal({ title: p.name||"Policy", body: policyModal(p) }),
          emptyMessage: "No policies",
        });
      }
      tabsEl.innerHTML = TABS.map(t => `<button class="tab-btn${t.filter===activeFilter?" active":""}" data-filter="${t.filter??""}">${SC.esc(t.label)}</button>`).join("");
      tabsEl.addEventListener("click", e => { const b = e.target.closest(".tab-btn"); if (!b) return; activeFilter = b.dataset.filter||null; tabsEl.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", (x.dataset.filter||null)===activeFilter)); render(); });
      ownerEl.addEventListener("change", e => { ownerFilter = e.target.value; render(); });
      render();
    })();
  </script>
</body>
</html>
