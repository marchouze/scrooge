<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KYC Client — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
<style>
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge-green  { background: #e8f5e9; color: #2e6b34; border: 1px solid #bce0c0; }
  .badge-amber  { background: #fff3e0; color: #8a4a00; border: 1px solid #f5d5a0; }
  .badge-red    { background: #fbe9e7; color: #7d1e10; border: 1px solid #f3c1bc; }
  .badge-blue   { background: #e3f2fd; color: #1c4d80; border: 1px solid #cae0f5; }
  .badge-purple { background: #f3e5f5; color: #6a1b9a; border: 1px solid #d1b3e0; }
  .badge-grey   { background: #f5f5f5; color: #555; border: 1px solid #e0e0e0; }

  .btn { display: inline-block; padding: 7px 14px; border-radius: 4px; border: 1px solid; font-size: 13px; cursor: pointer; font-family: var(--sans); }
  .btn-outline  { background: #fff; color: var(--primary); border-color: var(--border-strong); }
  .btn-outline:hover { background: var(--accent-soft); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .detail-grid { display: grid; grid-template-columns: 160px 1fr; gap: 6px 16px; font-size: 13.5px; }
  .detail-grid dt { font-weight: 600; color: #555; }
  .detail-grid dd { margin: 0; }

  .checks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .check-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px 14px; }
  .check-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .check-card-name { font-weight: 600; font-size: 13px; color: var(--primary); }
  .check-card-ts { font-size: 11px; color: #999; }
  details.check-raw summary { font-size: 11px; color: var(--accent); cursor: pointer; margin-top: 6px; }
  details.check-raw pre { font-size: 10.5px; background: #f5f5f5; padding: 8px; border-radius: 3px; overflow-x: auto; margin: 4px 0 0; }

  .timeline-item { display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .timeline-ts { font-family: var(--mono); font-size: 11.5px; color: #999; white-space: nowrap; min-width: 130px; }
  .timeline-event { color: var(--accent-deep); font-weight: 600; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: #222; color: #fff; padding: 12px 20px; border-radius: 6px; font-size: 13.5px; z-index: 999; display: none; }
  .toast.show { display: block; }
  .toast.success { background: var(--good); }
  .toast.error { background: var(--danger); }
</style>
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content" style="max-width:1000px;margin:0 auto;padding:22px 24px 80px;">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>

  <section class="band">
    <div class="band-head">
      <div>
        <h1 id="entityNameTitle" style="margin:0;font-family:var(--serif);color:var(--primary);">Loading…</h1>
        <div id="headerMeta" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;"></div>
      </div>
      <button class="btn btn-outline" id="refreshBtn" onclick="triggerRefresh()" title="Emit KYCRefreshScheduled event">
        ↻ Trigger early refresh
      </button>
    </div>
  </section>

  <!-- Client details -->
  <section class="band">
    <div class="band-head"><h2>Client Details</h2></div>
    <dl class="detail-grid" id="detailGrid"></dl>
  </section>

  <!-- KYC Checks -->
  <section class="band" id="checksSection">
    <div class="band-head"><h2>KYC Checks</h2></div>
    <div class="checks-grid" id="checksGrid"></div>
    <div id="checksEmpty" hidden><p class="muted">No KYC check data available for this client.</p></div>
  </section>

  <!-- KYC History timeline -->
  <section class="band">
    <div class="band-head"><h2>KYC History</h2></div>
    <div id="timeline"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script src="/kyc-client-detail.js"></script>
  <script>initShell({ title: "KYC Client Detail" });</script>
</body>
</html>
