<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Briefs / dispatches register — Scrooge Bank</title>
  <meta name="description" content="Briefs / dispatches register — every Scrooge dispatch as an AgentBriefIssued event (D-RMS-PHASE-1, Phase 2 Block A — events-first dispatch).">
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>

  <div class="page-header" style="padding: var(--space-4) var(--space-6) 0;">
    <h1 style="margin:0 0 var(--space-2);">Briefs / dispatches register</h1>
    <p class="muted" style="margin:0 0 var(--space-4);">
      Every Scrooge dispatch as an <code>AgentBriefIssued</code> event with run
      lifecycle (<code>AgentRunStarted</code> → <code>AgentRunCompleted</code>).
      Phase 2 Block A — events-first dispatch.
      Sourced from <a href="/api/rms/briefs-dispatches">/api/rms/briefs-dispatches</a>.
    </p>
  </div>

  <div id="filterBar" style="padding: 0 var(--space-6) var(--space-3); display:flex; flex-wrap:wrap; gap:var(--space-3); align-items:center;">
    <!-- Status filter -->
    <fieldset style="border:none;padding:0;margin:0;display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;">
      <legend style="font-size:0.75rem;color:var(--muted);margin-right:var(--space-2);float:left;line-height:1.8;">Status</legend>
      <label class="filter-radio"><input type="radio" name="statusFilter" value="all" checked> All</label>
      <label class="filter-radio"><input type="radio" name="statusFilter" value="issued"> Issued</label>
      <label class="filter-radio"><input type="radio" name="statusFilter" value="in-flight"> In-flight</label>
      <label class="filter-radio"><input type="radio" name="statusFilter" value="delivered"> Delivered</label>
      <label class="filter-radio"><input type="radio" name="statusFilter" value="blocked"> Blocked</label>
      <label class="filter-radio"><input type="radio" name="statusFilter" value="superseded"> Superseded</label>
    </fieldset>

    <!-- Agent filter -->
    <label style="display:flex;gap:var(--space-1);align-items:center;font-size:0.85rem;">
      <span style="font-size:0.75rem;color:var(--muted);">Agent</span>
      <select id="agentFilter" style="padding:var(--space-1) var(--space-2);border:1px solid var(--border);border-radius:4px;">
        <option value="">All agents</option>
      </select>
    </label>

    <!-- Workstream filter -->
    <label style="display:flex;gap:var(--space-1);align-items:center;font-size:0.85rem;">
      <span style="font-size:0.75rem;color:var(--muted);">Workstream</span>
      <select id="workstreamFilter" style="padding:var(--space-1) var(--space-2);border:1px solid var(--border);border-radius:4px;">
        <option value="">All workstreams</option>
      </select>
    </label>

    <!-- Search -->
    <input
      id="searchInput"
      type="search"
      placeholder="Search ID or title…"
      style="flex:1;min-width:180px;max-width:320px;padding:var(--space-1) var(--space-2);border:1px solid var(--border);border-radius:4px;font-size:0.85rem;"
      aria-label="Search briefs by ID or title"
    >
  </div>

  <div id="briefsContent" style="padding: 0 var(--space-6) var(--space-6);">
    <p class="muted">Loading…</p>
  </div>


</main>

  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script src="/briefs.js"></script>
  <script>initShell({ title: "Briefs" });</script>
</body>
</html>
