# Noa — ops cycle (autonomous run)
#
# Weekly design-sprint-boundary ops cycle per Noa's operating spec § 6 (Cadence).
# Per CLAUDE.md Principle 6 (Autonomous by default).
#
# Stub handler — full implementation is gated on the typed UI event registry
# (IntranetFeatureShipped, DesignReviewComplete, UXFindingRaised — Team/Noa.md §16).
#
# S8 A4 — fleet-rollout under D-AGENT-RUNTIME-AUTHORIZE (approved 2026-05-08).

name: Noa ops cycle

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:noa-ops-cycle
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "noa-agent[bot]"
          git config user.email "agent-noa@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Noa — ops cycle ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-noa-ops-cycle.yml.
          Per CLAUDE.md Principle 6 (Autonomous by default).
          Stub handler — Fleet-rollout under D-AGENT-RUNTIME-AUTHORIZE.

          Co-Authored-By: Noa (agent) <agent-noa@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
