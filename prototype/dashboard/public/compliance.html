<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compliance — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Compliance</h1></div>
    <div class="page-body">
      <div id="comp-tiles" class="tile-row"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Compliance" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      const data = await sf("/api/compliance/metrics");
      const m = data ?? {};
      const el = document.getElementById("comp-tiles");
      [
        SC.renderTile({ label:"Open Obligations", value:m.openObligations??m.open??"—", href:"/obligations.html", status:(m.openObligations??m.open??0)>0?"warn":"ok" }),
        SC.renderTile({ label:"Overdue", value:m.overdueObligations??m.overdue??"—", href:"/obligations.html", status:(m.overdueObligations??m.overdue??0)>0?"danger":"ok" }),
        SC.renderTile({ label:"Policies", value:m.policiesCount??m.policies??"—", href:"/policies.html", status:"info" }),
        SC.renderTile({ label:"Alerts", value:m.alertsCount??m.alerts??"—", href:"/obligations.html", status:(m.alertsCount??m.alerts??0)>0?"warn":"ok" }),
      ].forEach(t => el.appendChild(t));
    })();
  </script>
</body>
</html>
