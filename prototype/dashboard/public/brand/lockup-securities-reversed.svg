<!-- lockup-securities-reversed.svg — Hoz Securities sub-brand lockup (light-on-dark).
     Authority: D-LEGAL-ENTITY-TREE-V0 (PR #82, merged 2026-05-09);
     Linnea v1 brand package §2.1 + §3.1 (Slate-Deep emphasis);
     Linnea v3 brand-application supplement §2.1 (lockup family);
     Linnea v3.2 sub-brand application §3.
     Use: dark-mode UI, dark-themed PDF covers, evening-event signage in
     Hoz Securities contexts. Construction: identical to lockup-securities.svg
     with palette inverted — Slate-Deep field (#0F1722); Paper ink (#F7F4EE)
     on mark, wordmark, divider, qualifier. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348 64" width="348" height="64" role="img" aria-label="Hoz Securities — reversed sub-brand lockup">
  <!-- Slate-Deep field -->
  <rect width="348" height="64" fill="#0F1722"/>
  <!-- Mark (Paper ink) -->
  <g>
    <circle cx="32" cy="32" r="28" fill="none" stroke="#F7F4EE" stroke-width="2"/>
    <line x1="6" y1="24" x2="58" y2="24" stroke="#F7F4EE" stroke-width="3" stroke-linecap="square"/>
  </g>
  <!-- Wordmark "Hoz" (Paper ink) -->
  <text x="76" y="44"
        font-family="Inter, 'Inter Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="36" font-weight="700" fill="#F7F4EE" letter-spacing="-0.5">Hoz</text>
  <!-- Divider -->
  <line x1="144" y1="20" x2="144" y2="44" stroke="#F7F4EE" stroke-width="1" stroke-linecap="square"/>
  <!-- Sub-brand qualifier "Securities" -->
  <text x="156" y="40"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="500" fill="#F7F4EE" letter-spacing="0.2">Securities</text>
</svg>
