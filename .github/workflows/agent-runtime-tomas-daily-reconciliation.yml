# Tomas — daily three-way reconciliation (autonomous run)
#
# Daily trade-leg ↔ payment-leg ↔ ledger-leg three-way reconciliation per
# PROC-PAY-RBH-01.
# Cadence: 05:00 UTC daily, driven by launchd scheduler (sole canonical
# cadence mechanism post-2026-05-11 decommission of GH-Actions schedule blocks).
# Per CLAUDE.md Principle 6 (Autonomous by default).

name: Tomas daily reconciliation

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        run: bun run agent:tomas-daily-reconciliation
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "tomas-agent[bot]"
          git config user.email "agent-tomas@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Tomas — daily reconciliation ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-tomas-daily-reconciliation.yml.
          Per CLAUDE.md Principle 6 (Autonomous by default).
          Authority: PROC-PAY-RBH-01.

          Co-Authored-By: Tomas (agent) <agent-tomas@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
