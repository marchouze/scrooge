<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS Registers — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">RMS Registers</h1></div>
    <div class="page-body">
      <div id="rms-tabs" class="tab-bar"></div>
      <div id="rms-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "RMS Registers" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      document.getElementById("rms-table").innerHTML = SC.renderSkeleton(6);
      const data = await sf("/api/rms");
      const REGISTERS = ["Decisions","Correspondence","Records","Documents","Feedback","Briefs","Workstreams"];
      let activeReg = REGISTERS[0];
      const tabsEl = document.getElementById("rms-tabs");
      function getRows(reg) {
        if (!data) return [];
        const key = reg.toLowerCase();
        return Array.isArray(data[key]) ? data[key] :
               Array.isArray(data[reg]) ? data[reg] :
               Array.isArray(data) ? data.filter(r=>(r.register||r.type||"").toLowerCase()===key) : [];
      }
      function render() {
        const rows = getRows(activeReg);
        if (rows.length === 0) {
          SC.renderTable({ container: document.getElementById("rms-table"), headers:["—"], rows:[], emptyMessage:`No ${activeReg} records` });
          return;
        }
        const keys = [...new Set(rows.flatMap(r => Object.keys(r)))].slice(0,5);
        SC.renderTable({
          container: document.getElementById("rms-table"),
          headers: keys,
          rows: rows.map(r => ({
            cells: keys.map(k => SC.esc(SC.fmt(r[k]))),
            data: r,
          })),
          onRowClick: r => SC.openModal({ title: r.title||r.id||activeReg, body: SC.renderDefList(r) }),
          emptyMessage: `No ${activeReg} records`,
        });
      }
      tabsEl.innerHTML = REGISTERS.map(r => `<button class="tab-btn${r===activeReg?" active":""}" data-r="${r}">${r}</button>`).join("");
      tabsEl.addEventListener("click", e => { const b=e.target.closest(".tab-btn"); if(!b) return; activeReg=b.dataset.r; tabsEl.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active",x.dataset.r===activeReg)); render(); });
      render();
    })();
  </script>
</body>
</html>
