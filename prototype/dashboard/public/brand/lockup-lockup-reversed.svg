<!-- lockup-lockup-reversed.svg — Hoz reversed lockup (light-on-dark).
     Authority: D-BANK-NAME-SELECTION revised 2026-05-09 (Hoz);
     Linnea v1 brand package §2.1 + §3.1 (Slate-Deep emphasis);
     Linnea v3 brand-application supplement §2.1 (lockup family).
     Use: dark-mode UI, brand-on-photo, evening-event signage,
     dark-themed PDF covers (e.g. board-pack title page §4.3).
     Min size: 144px wide. Clear-space: one mark-diameter on all sides.
     Construction: identical to lockup-lockup.svg, with palette inverted —
     Slate-Deep field (#0F1722); Paper ink (#F7F4EE) on mark + wordmark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" width="220" height="64" role="img" aria-label="Hoz — reversed lockup">
  <!-- Slate-Deep field -->
  <rect width="220" height="64" fill="#0F1722"/>
  <!-- Mark (Paper ink) -->
  <g>
    <circle cx="32" cy="32" r="28" fill="none" stroke="#F7F4EE" stroke-width="2"/>
    <line x1="6" y1="24" x2="58" y2="24" stroke="#F7F4EE" stroke-width="3" stroke-linecap="square"/>
  </g>
  <!-- Wordmark (Paper ink) -->
  <text x="76" y="44"
        font-family="Inter, 'Inter Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="36" font-weight="700" fill="#F7F4EE" letter-spacing="-0.5">Hoz</text>
</svg>
