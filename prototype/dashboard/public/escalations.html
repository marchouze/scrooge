<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escalations — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header">
      <h1 class="page-title">Escalations</h1>
    </div>
    <div class="page-body">
      <div id="esc-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Escalations" });
    (async () => {
      const el = document.getElementById("esc-table");
      el.innerHTML = SC.renderSkeleton(6);
      async function safeFetch(u) {
        try { const r = await fetch(u, { headers: { Accept: "application/json" } }); return r.ok ? r.json() : null; } catch { return null; }
      }
      const data = await safeFetch("/api/state");
      const clusters = data?.limitUtilisations ?? [];
      const escalated = clusters.filter(c => c.ragStatus && c.ragStatus !== "green");
      SC.renderTable({
        container: el,
        headers: ["Cluster", "Limit", "Utilisation", "RAG", "As Of"],
        rows: escalated.map(c => ({
          cells: [
            SC.esc(c.cluster || ""),
            SC.esc(c.limitName || ""),
            SC.esc(c.utilisationPct != null ? `${c.utilisationPct}%` : "—"),
            SC.renderBadge(c.ragStatus || "warn"),
            SC.esc((c.asOf || "").slice(0, 10)),
          ],
          data: c,
        })),
        onRowClick: c => SC.openModal({ title: c.cluster || "Cluster", body: SC.renderDefList(c) }),
        emptyMessage: "No escalations — all RAS clusters within limits",
      });
    })();
  </script>
</body>
</html>
