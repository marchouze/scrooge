<!doctype html>
<html lang="en">
<head>

</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Scrooge Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [{ label: "Executive", href: "/v2/index.html" }, { label: "Commercial", href: "/v2/commercial/index.html" }, { label: "Tiers" }],
      title: "Tier Entitlements",
      seat: "BBaaS Platform  ·  TierEntitlementDefined",
    });
    renderTileGroup(main, {
      tiles: [
        { label: "Tier K — Kernel", unit: "Core FIL + capital engine" },
        { label: "Tier R — Regulatory", unit: "K + compliance surfaces" },
        { label: "Tier C — Commercial", unit: "R + commercial mechanics" },
        { label: "Go-Live Gate", unit: "Anchor PA proof required" },
      ],
    });
    const s = document.createElement("div"); s.className = "v2-section"; main.appendChild(s);
    const h = document.createElement("h2"); h.className = "v2-section-title"; h.textContent = "Surface Entitlements by Tier"; s.appendChild(h);
    renderTable(s, { columns: ["Surface ID", "Surface Name", "Tier K", "Tier R", "Tier C", "Gate Condition"] });
    const s2 = document.createElement("div"); s2.className = "v2-section"; main.appendChild(s2);
    const h2 = document.createElement("h2"); h2.className = "v2-section-title"; h2.textContent = "Pricing"; s2.appendChild(h2);
    renderTable(s2, { columns: ["Tier", "Model", "Unit", "Rate", "Effective Date"] });
    renderRefs(main, {
      refs: [
        { label: "TierEntitlementDefined event schema", href: "#" },
        { label: "D-V2-WAVE4-COMMERCIAL-POSTURE — flat-tier subscription model", href: "#" },
        { label: "Go-live readiness gate — anchor PA proof", href: "#" },
      ],
    });
  </script>
