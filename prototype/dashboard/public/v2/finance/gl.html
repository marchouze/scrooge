<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>General Ledger — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html" title="Errors &amp; recon violations">
        <span class="v2-errors-icon">⚠</span>
        <span class="v2-errors-count" id="errors-count">…</span>
      </a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [{ label: "Executive", href: "/v2/index.html" }, { label: "Finance", href: "/v2/finance/index.html" }, { label: "General Ledger" }],
      title: "General Ledger",
      seat: "GlPostingEmitted",
    });

    renderTileGroup(main, {
      tiles: [
        { label: "Total Assets", unit: "Debit balance" },
        { label: "Total Liabilities", unit: "Credit balance" },
        { label: "Equity", unit: "Assets − Liabilities" },
        { label: "Posting Count", unit: "Total GL entries" },
      ],
    });

    const s = document.createElement("div"); s.className = "v2-section"; main.appendChild(s);
    const h = document.createElement("h2"); h.className = "v2-section-title"; h.textContent = "Trial Balance"; s.appendChild(h);
    renderTable(s, { columns: ["Account Code", "Account Name", "Debit (ZAR)", "Credit (ZAR)", "Net (ZAR)"] });

    const s2 = document.createElement("div"); s2.className = "v2-section"; main.appendChild(s2);
    const h2 = document.createElement("h2"); h2.className = "v2-section-title"; h2.textContent = "Recent GL Entries"; s2.appendChild(h2);
    renderTable(s2, { columns: ["Date", "Account", "Description", "Debit", "Credit", "Source Event"] });

    renderRefs(main, {
      refs: [
        { label: "IFRS 9 — Financial Instruments", href: "#" },
        { label: "Chart of Accounts — ACC-* series", href: "#" },
        { label: "GlPostingEmitted event schema", href: "#" },
      ],
    });
  </script>
</body>
</html>
