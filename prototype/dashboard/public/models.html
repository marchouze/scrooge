<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Models — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" data-provenance-source="/api/models" aria-label="Provenance badge"></span>
    <div class="page-header">
      <h1 class="page-title">Calculation Models</h1>
      <p style="font:var(--text-body);color:var(--color-text-secondary);margin:var(--space-1) 0 0">
        Every surfaced regulatory figure is computed by an owned, registered model. A figure may only be
        derived from a model that is <strong>approved</strong> in the model registry — otherwise it is a loud
        failure, never a silent number. Trusted-Figures Program (D-TRUSTED-FIGURES-PROGRAM-V1).
      </p>
    </div>
    <div class="page-body">
      <div id="model-tiles" style="display:flex;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)"></div>
      <div id="model-cards"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>initShell({ title: "Models" });</script>
  <script src="/models.js"></script>
</body>
</html>
