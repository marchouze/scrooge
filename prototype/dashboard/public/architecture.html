<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body data-provenance-content="none">
  <div id="shell"></div>
  <main id="content" class="main-content">
    <div class="page-header"><h1 class="page-title">Architecture</h1></div>
    <div class="page-body">
      <div id="arch-principles-header"></div>
      <div id="arch-principles"></div>
      <div id="arch-gaps-header"></div>
      <div id="arch-gaps-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Architecture" });

    const PRINCIPLES = [
      { n:1, title:"Events are the only source of truth", desc:"The event log is the single durable artefact; balances, positions, P&L, regulatory cells are queries, not stored state." },
      { n:2, title:"Single-graph discipline", desc:"Every artefact sits in one citable bidirectional graph. Policy heads the executable chain and decomposes downward to procedure, system capability, and outcome. No orphans." },
      { n:3, title:"Cloud-native; nothing manual or physical except where essential", desc:"IaC, coded workflows, structured documents, FIPS-Level-3 HSMs; full local build first, single-coherent-phase Azure migration." },
      { n:4, title:"Security designed in from the start", desc:"Threat-modelling per design, zero-trust, least-privilege, defence-in-depth, secure SDLC; aligned with PA/FSCA Joint Standard 2 of 2024 + POPIA s.19–22." },
      { n:5, title:"Multi-currency, multi-entity, multi-country from day one", desc:"Currency at the type level; entity in a versioned legal-entity tree; jurisdictional dispatch on every flow; reporting currency is presentation, not data." },
      { n:6, title:"Autonomous by default; humans oversee the residual", desc:"Every persona is a standing autonomous agent; default actor in every procedure step is an agent; human-in-the-loop steps carry P2 citations; escalations are first-class typed channels." },
    ];

    document.getElementById("arch-principles-header").innerHTML = SC.renderSectionHeader("Architectural Principles", null);
    const principlesEl = document.getElementById("arch-principles");
    principlesEl.innerHTML = PRINCIPLES.map(p => `
      <div class="principle-card" id="pc-${p.n}">
        <div class="principle-card-header" onclick="togglePrinciple(${p.n})">
          <span class="principle-number">${p.n}</span>
          <span class="principle-title">${SC.esc(p.title)}</span>
          <span class="principle-chevron">&#9658;</span>
        </div>
        <div class="principle-body">${SC.esc(p.desc)}</div>
      </div>`).join("");

    window.togglePrinciple = function(n) {
      document.getElementById("pc-"+n).classList.toggle("open");
    };

    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      const data = await sf("/api/substrate-gaps") ?? await sf("/api/health");
      const gaps = Array.isArray(data) ? data : (data?.substrateGaps ?? data?.gaps ?? data?.items ?? []);
      document.getElementById("arch-gaps-header").innerHTML = SC.renderSectionHeader("Substrate Gaps", null);
      SC.renderTable({
        container: document.getElementById("arch-gaps-table"),
        headers: ["Gap ID","Description","Severity","Status"],
        rows: gaps.map(g => ({
          cells: [SC.esc(g.id||g.gapId||""), SC.esc(g.description||g.title||""), SC.renderBadge(g.severity||"info"), SC.renderBadge(g.status||"open")],
          data: g,
        })),
        onRowClick: g => SC.openModal({ title: g.id||"Gap", body: SC.renderDefList(g) }),
        emptyMessage: "No substrate gaps recorded",
      });
    })();
  </script>
</body>
</html>
