<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forward Obligations — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Forward Obligations</h1></div>
    <div class="page-body">
      <div id="fwd-content"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Forward Obligations" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      const el = document.getElementById("fwd-content");
      el.innerHTML = SC.renderSkeleton(6);
      const data = await sf("/api/forward-obligations");
      const items = Array.isArray(data) ? data : (data?.data?.rows ?? data?.items ?? data?.obligations ?? []);
      if (items.length === 0) { el.innerHTML = `<p style="color:var(--color-text-secondary)">No forward obligations.</p>`; return; }
      // Group by date
      const groups = {};
      items.forEach(o => { const d = (o.effectiveDate||o.dueDate||o.date||"Unknown").slice(0,10); (groups[d]||(groups[d]=[])).push(o); });
      el.innerHTML = Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([date, obls]) => `
        <div style="margin-bottom:var(--space-6)">
          <div style="font:var(--text-h3);color:var(--color-text-secondary);margin-bottom:var(--space-3)">${SC.esc(date)}</div>
          ${obls.map(o => `<div class="card" style="cursor:pointer" onclick='SC.openModal({title:${JSON.stringify(o.title||"Obligation")},body:SC.renderDefList(${JSON.stringify(o)})})'>
            <div class="card-title">${SC.esc(o.title||o.id||"")}</div>
            <div class="card-body">${SC.esc(o.regulation||o.source||"")} ${SC.renderBadge(o.status||"open")}</div>
          </div>`).join("")}
        </div>`).join("");
    })();
  </script>
</body>
</html>
