<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Credit Risk — Scrooge V2</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Scrooge Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [{ label: "Executive", href: "/v2/index.html" }, { label: "Risk", href: "/v2/risk/index.html" }, { label: "Credit Risk" }],
      title: "Credit Risk — SA-CCR",
      seat: "CRO · Helena  ·  Risk Engineer · Rohan  ·  CcrEadComputed",
    });
    renderTileGroup(main, {
      tiles: [
        { label: "Total EAD", unit: "ZAR — SA-CCR" },
        { label: "Replacement Cost (RC)", unit: "ZAR" },
        { label: "Potential Future Exposure", unit: "PFE (ZAR)" },
        { label: "Netting Sets", unit: "Count" },
      ],
    });
    renderFormula(main, {
      name: "EAD (SA-CCR)",
      numLabel: "Replacement Cost (RC)",
      denLabel: "+ 1.4 × PFE (AddOn)",
      resultLabel: "EAD",
      reference: "BCBS CRE52; Banks Act Reg 23(5)",
    });
    const s = document.createElement("div"); s.className = "v2-section"; main.appendChild(s);
    const h = document.createElement("h2"); h.className = "v2-section-title"; h.textContent = "SA-CCR by Netting Set"; s.appendChild(h);
    renderTable(s, { columns: ["Netting Set ID", "Asset Class", "RC (ZAR)", "PFE (ZAR)", "EAD (ZAR)", "Counterparty"] });
    const s2 = document.createElement("div"); s2.className = "v2-section"; main.appendChild(s2);
    const h2 = document.createElement("h2"); h2.className = "v2-section-title"; h2.textContent = "Add-On by Hedging Set"; s2.appendChild(h2);
    renderTable(s2, { columns: ["Hedging Set", "Asset Class", "Supervisory Δ", "Adj. Notional", "Add-On (ZAR)"] });
    renderRefs(main, {
      refs: [
        { label: "BCBS CRE52 — SA-CCR Standardised Approach for CCR", href: "#" },
        { label: "Banks Act Reg 23(5) — Counterparty Credit Risk", href: "#" },
        { label: "CcrEadComputed event schema", href: "#" },
        { label: "recon:v2-saccr-parity gate", href: "#" },
      ],
    });
  </script>
</body>
</html>
