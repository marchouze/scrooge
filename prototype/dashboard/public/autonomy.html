<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autonomy — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
  <style>
    /* Autonomy view — author: Noa (Intranet Product Owner & UI Architect, engineering).
       Authority: D-AGENT-AUTONOMY-COHORT-2-PILOT. The headline ratio is the figure
       the CEO watches climb; the scheduler heartbeat is deliberately demoted. */
    .autonomy-hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4, 1rem);
      margin-bottom: var(--space-5, 1.5rem);
    }
    .hero-card {
      border: 1px solid var(--color-border, #e2e4e9);
      border-radius: var(--radius-lg, 12px);
      padding: var(--space-5, 1.5rem);
      background: var(--color-surface, #fff);
    }
    .hero-card.primary {
      border-color: var(--color-success, #1a7f4b);
      border-width: 2px;
      box-shadow: 0 2px 12px rgba(26, 127, 75, 0.10);
    }
    .hero-eyebrow {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted, #6b7280);
      font-weight: 600;
    }
    .hero-number {
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1.05;
      margin: 0.3rem 0 0.1rem;
      font-variant-numeric: tabular-nums;
    }
    .hero-card.primary .hero-number { color: var(--color-success, #1a7f4b); }
    .hero-sub { color: var(--color-text-muted, #6b7280); font-size: 0.9rem; }
    .hero-split {
      margin-top: 0.9rem;
      display: flex;
      gap: 1.4rem;
      font-size: 0.85rem;
    }
    .hero-split .k { color: var(--color-text-muted, #6b7280); }
    .hero-split .v { font-weight: 700; font-variant-numeric: tabular-nums; }
    .autonomy-bar {
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      background: var(--color-border, #e2e4e9);
      display: flex;
      margin-top: 0.8rem;
    }
    .autonomy-bar .seg-auto { background: var(--color-success, #1a7f4b); }
    .autonomy-bar .seg-coord { background: var(--color-warning, #c98a00); opacity: 0.55; }
    .demoted {
      opacity: 0.62;
      filter: grayscale(0.25);
    }
    .demoted:hover { opacity: 0.95; filter: none; }
    .section-note {
      color: var(--color-text-muted, #6b7280);
      font-size: 0.85rem;
      margin: 0.1rem 0 0.6rem;
    }
    .defer-pill {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    @media (max-width: 720px) { .autonomy-hero { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Autonomy</h1></div>
    <div class="page-body">
      <p class="section-note">
        Genuinely-autonomous agent activity, isolated from the scheduler heartbeat and
        Scrooge-coordinated (in-session) runs. The headline ratio is the number to watch climb
        as cohort-2 ramps. Read-only replay of the live event store — no events emitted here.
      </p>

      <!-- 1. Autonomy ratio — headline KPI -->
      <div id="aut-hero" class="autonomy-hero"></div>

      <!-- 2. Autonomous run feed -->
      <div id="aut-runs-header"></div>
      <div id="aut-runs"></div>

      <!-- 3. Goal-loop heartbeat-vs-action split -->
      <div id="aut-goals-header"></div>
      <div id="aut-goals"></div>

      <!-- 5. Autonomy-relevant alerts (inactivity) -->
      <div id="aut-alerts-header"></div>
      <div id="aut-alerts"></div>

      <!-- 4. Scheduler heartbeat — deliberately demoted, rendered last -->
      <div id="aut-heartbeat-header"></div>
      <div id="aut-heartbeat" class="demoted"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Autonomy" });
    (async () => {
      async function sf(u) {
        try { const r = await fetch(u, { headers: { Accept: "application/json" } }); return r.ok ? r.json() : null; }
        catch { return null; }
      }
      const ts = (s) => (s ? SC.esc(String(s).slice(0, 19).replace("T", " ")) : "—");

      function render(data) {
        const d = data ?? {};

        // ── 1. Headline ratio ───────────────────────────────────────
        const ratio = d.ratio ?? {};
        const all = ratio.allTime ?? {};
        const wk = ratio.last7Days ?? {};
        const autoAll = all.autonomous ?? 0;
        const coordAll = all.coordinated ?? 0;
        const totAll = autoAll + coordAll;
        const pctAll = totAll > 0 ? ((autoAll / totAll) * 100) : 0;
        const autoWk = wk.autonomous ?? 0;
        const coordWk = wk.coordinated ?? 0;
        const totWk = autoWk + coordWk;
        const pctWk = totWk > 0 ? ((autoWk / totWk) * 100) : 0;
        const autoPctW = totAll > 0 ? (autoAll / totAll) * 100 : 0;

        const hero = document.getElementById("aut-hero");
        hero.innerHTML = `
          <div class="hero-card primary">
            <div class="hero-eyebrow">Running itself · all-time</div>
            <div class="hero-number">${autoAll}<span style="font-size:1.2rem;color:var(--color-text-muted)"> / ${totAll}</span></div>
            <div class="hero-sub">${pctAll.toFixed(1)}% of completed runs were genuinely autonomous (substrate = agent-runtime)</div>
            <div class="autonomy-bar" title="${autoAll} autonomous vs ${coordAll} Scrooge-coordinated">
              <div class="seg-auto" style="width:${autoPctW}%"></div>
              <div class="seg-coord" style="width:${100 - autoPctW}%"></div>
            </div>
            <div class="hero-split">
              <span><span class="k">autonomous</span> <span class="v" style="color:var(--color-success)">${autoAll}</span></span>
              <span><span class="k">Scrooge-coordinated</span> <span class="v">${coordAll}</span></span>
            </div>
          </div>
          <div class="hero-card">
            <div class="hero-eyebrow">Running itself · last 7 days</div>
            <div class="hero-number">${autoWk}<span style="font-size:1.2rem;color:var(--color-text-muted)"> / ${totWk}</span></div>
            <div class="hero-sub">${pctWk.toFixed(1)}% autonomous in the trailing 7 days</div>
            <div class="hero-split">
              <span><span class="k">autonomous</span> <span class="v" style="color:var(--color-success)">${autoWk}</span></span>
              <span><span class="k">Scrooge-coordinated</span> <span class="v">${coordWk}</span></span>
            </div>
          </div>`;

        // ── 2. Autonomous run feed (agent-runtime only) ─────────────
        document.getElementById("aut-runs-header").innerHTML =
          SC.renderSectionHeader("What ran on its own", null) +
          `<p class="section-note">AgentRunStarted / Completed where substrate = <strong>agent-runtime</strong> only. Newest first.</p>`;
        const runs = Array.isArray(d.autonomousRuns) ? d.autonomousRuns : [];
        SC.renderTable({
          container: document.getElementById("aut-runs"),
          headers: ["Agent", "Brief", "Started", "Outcome", "Duration", "Deliverable"],
          rows: runs.map((r) => ({
            cells: [
              `${SC.esc(r.agentName || "—")}${r.agentPosition ? `<br><span style="color:var(--color-text-muted);font-size:0.8rem">${SC.esc(r.agentPosition)}</span>` : ""}`,
              SC.esc(r.briefId || "—"),
              ts(r.startedAt),
              r.outcome ? SC.renderBadge(r.outcome) : `<span style="color:var(--color-warning)">running</span>`,
              r.durationLabel ? SC.esc(r.durationLabel) : "—",
              r.deliverableCount ? `${r.deliverableCount} doc(s)` : "—",
            ],
            data: r,
          })),
          onRowClick: (r) => SC.openModal({ title: `Autonomous run: ${r.agentName || "agent"}`, body: SC.renderDefList(r) }),
          emptyMessage: "No genuinely-autonomous runs yet — this is the number to watch climb.",
        });

        // ── 3. Goal-loop heartbeat-vs-action split ──────────────────
        document.getElementById("aut-goals-header").innerHTML =
          SC.renderSectionHeader("Goal-loop: action vs breathing", null) +
          `<p class="section-note">Per agent: goals evaluated vs deferred. A high defer ratio means the substrate is breathing (taking no action), not working.</p>`;
        const goals = Array.isArray(d.goalLoop) ? d.goalLoop : [];
        SC.renderTable({
          container: document.getElementById("aut-goals"),
          headers: ["Agent", "Evaluated", "Deferred", "Acted", "Defer ratio"],
          rows: goals.map((g) => {
            const dr = (g.deferRatio ?? 0) * 100;
            const drColor = dr >= 75 ? "var(--color-warning)" : dr >= 50 ? "var(--color-text)" : "var(--color-success)";
            return {
              cells: [
                SC.esc(g.agentName || g.agentUrn || "—"),
                SC.esc(String(g.evaluated ?? 0)),
                SC.esc(String(g.deferred ?? 0)),
                SC.esc(String(g.acted ?? 0)),
                `<span class="defer-pill" style="color:${drColor}">${dr.toFixed(0)}%</span>`,
              ],
              data: g,
            };
          }),
          emptyMessage: "No goal-loop activity",
        });

        // ── 5. Autonomy-relevant alerts (inactivity) ────────────────
        document.getElementById("aut-alerts-header").innerHTML =
          SC.renderSectionHeader("Cadence alerts (inactivity)", null) +
          `<p class="section-note">SubstrateAlert where alertClass = <strong>inactivity</strong> — an agent missed its cadence.</p>`;
        const alerts = Array.isArray(d.inactivityAlerts) ? d.inactivityAlerts : [];
        SC.renderTable({
          container: document.getElementById("aut-alerts"),
          headers: ["When", "Severity", "Detail"],
          rows: alerts.map((a) => ({
            cells: [ts(a.at), a.severity ? SC.renderBadge(a.severity) : "—", SC.esc(a.details || a.alertId || "—")],
            data: a,
          })),
          emptyMessage: "No inactivity alerts — every agent is meeting cadence.",
        });

        // ── 4. Scheduler heartbeat (demoted, last) ──────────────────
        const hb = d.heartbeat ?? {};
        document.getElementById("aut-heartbeat-header").innerHTML =
          SC.renderSectionHeader(`Scheduler heartbeat (${hb.totalCount ?? 0} ticks)`, null) +
          `<p class="section-note">The clock ticking, not activity. Last ${hb.recent?.length ?? 0} ScheduledTrigger events, shown demoted.</p>`;
        const ticks = Array.isArray(hb.recent) ? hb.recent : [];
        SC.renderTable({
          container: document.getElementById("aut-heartbeat"),
          headers: ["Fired", "Agent", "Trigger", "Cron"],
          rows: ticks.map((t) => ({
            cells: [ts(t.firedAt || t.at), SC.esc(t.agentUrn || "—"), SC.esc(t.triggerId || "—"), SC.esc(t.cronExpression || "—")],
            data: t,
          })),
          emptyMessage: "No scheduler ticks",
        });
      }

      // Skeletons while loading.
      document.getElementById("aut-runs").innerHTML = SC.renderSkeleton(4);
      const data = await sf("/api/autonomy");
      if (!data) {
        document.getElementById("aut-hero").innerHTML =
          `<div class="hero-card"><div class="hero-eyebrow">Error</div><div class="hero-sub">Could not load /api/autonomy.</div></div>`;
        return;
      }
      render(data);
    })();
  </script>
</body>
</html>
