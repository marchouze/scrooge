# Kai — M1 CDM TypeScript-bindings (autonomous run)
#
# Weekly CDM-bindings refresh per Kai's M1 brief
# (`Team Inbox/2026-05-07_brief_kai_m1-cdm-typescript-bindings.md`).
# Per CLAUDE.md Principle 7 (Autonomous by default).
#
# First Kai handler in the fleet — substrate landed via the round-9
# orphan rescue. Closes the `agent:kai:m1-cdm-typescript-bindings`
# follow-on-router entry that was previously unresolved.

name: Kai m1-cdm-typescript-bindings

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:kai-m1-cdm-typescript-bindings
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "kai-agent[bot]"
          git config user.email "agent-kai@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Kai — M1 CDM TypeScript bindings ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-kai-m1-cdm-typescript-bindings.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).
          M1 per D-MARKETS-SCHEMA-FOUNDATION (CEO approved 2026-05-07).

          Co-Authored-By: Kai (agent) <agent-kai@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
