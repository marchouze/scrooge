# Rohan — goal-loop (autonomous run)
#
# Daily goal-loop tick at 06:17 UTC for Rohan (Risk engineer).
# Evaluates whether autonomous action is warranted per Rohan's §9 decisions-in-
# scope set: daily limit-utilisation / risk-run cadence, open RiskRaised
# findings, and capital-readiness (ICAAP) cadence. Brief-aware (candidate-0)
# and triage-and-route: self-executable risk-run attestations close delivered,
# everything else routes to the engineering-execution substrate.
#
# Scheduling is via the launchd scheduler (com.scrooge.scheduler-tick), which
# reads the cron from runtime/agents/metadata/rohan.ts. This workflow is
# workflow_dispatch-only for manual / on-demand runs (GH-Actions schedule
# blocks decommissioned 2026-05-11).
#
# Authority: D-AGENT-AUTONOMY-OPERATIONAL Slice 3, D-AGENT-AUTONOMY-RISK-TREASURY-PILOT.
# Per CLAUDE.md Principle 6 (Autonomous by default).

name: Rohan goal-loop

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: prototype
        run: bun install --frozen-lockfile

      - name: Sync event store from Neon (pre-run)
        working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync

      - name: Run Rohan goal-loop
        working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:rohan-goal-loop

      - name: Sync event store to Neon (post-run)
        working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync

      - name: Commit deliverable
        run: |
          git config user.name "rohan-agent[bot]"
          git config user.email "agent-rohan@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit; Rohan goal-loop produced no deliverable diff."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Rohan — goal-loop ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-rohan-goal-loop.yml.
          Autonomous promotion per D-AGENT-AUTONOMY-RISK-TREASURY-PILOT.
          Per CLAUDE.md Principle 6 (Autonomous by default).

          Co-Authored-By: Rohan (agent) <agent-rohan@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
