# Eitan — liquidity snapshot (autonomous run)
#
# Daily ALCO-chair liquidity digest per Eitan's operating spec § Cadence
# (daily SAMOS funding review; daily LCR / NSFR projection review).
# Build-phase degraded mode — substantive ratios are not yet computed;
# this run is the daily-funding-event SLA heartbeat (§ 6 inactivity SLA).
# Per CLAUDE.md Principle 7 (Autonomous by default).

name: Eitan liquidity snapshot

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          # Optional. Eitan narrative; graceful no-op if unset.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:eitan-liquidity-snapshot
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "eitan-agent[bot]"
          git config user.email "agent-eitan@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Eitan — liquidity snapshot ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-eitan-liquidity-snapshot.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).

          Co-Authored-By: Eitan (agent) <agent-eitan@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
