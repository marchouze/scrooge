# Env — readiness snapshot (autonomous run)
#
# Weekly readiness snapshot per Env's operating spec § 6 (Cadence).
# Per CLAUDE.md Principle 6 (Autonomous by default).
#
# Surfaces EnvSimEngine substrate state, sub-simulator event counts,
# and the autonomous-scheduling gap (Team/Env.md §16).
#
# S8 A4 — fleet-rollout under D-AGENT-RUNTIME-AUTHORIZE (approved 2026-05-08).

name: Env readiness

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:env-readiness
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "env-agent[bot]"
          git config user.email "agent-env@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Env — readiness ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-env-readiness.yml.
          Per CLAUDE.md Principle 6 (Autonomous by default).
          Fleet-rollout under D-AGENT-RUNTIME-AUTHORIZE.

          Co-Authored-By: Env (agent) <agent-env@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
