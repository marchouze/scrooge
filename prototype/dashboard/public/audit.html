<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Audit</h1></div>
    <div class="page-body">
      <div id="aud-tiles" class="tile-row"></div>
      <div id="aud-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Audit" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      const data = await sf("/api/state");
      const all = data?.findings ?? [];
      const sevMap = { high: "P1", medium: "P2", low: "P3" };
      let sevFilter = null;
      const tilesEl = document.getElementById("aud-tiles");
      const counts = { P1: 0, P2: 0, P3: 0 };
      all.forEach(f => { const p = sevMap[(f.severity||"").toLowerCase()]; if (p) counts[p]++; });
      [["P1","danger"],["P2","warn"],["P3","info"]].forEach(([sev, status]) => {
        const t = SC.renderTile({ label: `${sev} Findings`, value: counts[sev], status, onClick: () => {
          sevFilter = sevFilter === sev ? null : sev;
          render();
        }});
        tilesEl.appendChild(t);
      });
      function render() {
        const rows = sevFilter ? all.filter(f => sevMap[(f.severity||"").toLowerCase()] === sevFilter) : all;
        SC.renderTable({
          container: document.getElementById("aud-table"),
          headers: ["ID","Principle","Severity","Source","As Of"],
          rows: rows.map(f => ({
            cells: [SC.esc(f.id||""), SC.esc(f.principle||""), SC.renderBadge(f.severity||""), SC.esc(f.source||""), SC.esc((f.asOf||"").slice(0,10))],
            data: f,
          })),
          onRowClick: f => SC.openModal({ title: f.id||"Finding", body: SC.renderDefList(f) }),
          emptyMessage: "No findings",
        });
      }
      render();
    })();
  </script>
</body>
</html>
