<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Control — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" data-provenance-source="/api/product-control/daily-pnl" aria-label="Provenance badge"></span>
    <div class="page-header">
      <h1 class="page-title">Product Control</h1>
      <p style="font:var(--text-body);color:var(--color-text-secondary);margin:var(--space-1) 0 0">Daily FX P&amp;L — unrealised mark-to-market</p>
    </div>
    <div class="page-body">
      <div id="pc-tiles" style="display:flex;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)"></div>
      <div id="pc-by-pair" style="margin-bottom:var(--space-8)"></div>
      <div id="pc-by-cp" style="margin-bottom:var(--space-8)"></div>
      <div id="pc-trades" style="margin-bottom:var(--space-8)"></div>
      <div id="pc-history" style="margin-bottom:var(--space-8)"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>initShell({ title: "Product Control" });</script>
  <script src="/product-control.js"></script>
</body>
</html>
