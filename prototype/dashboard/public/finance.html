<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header">
      <h1 class="page-title">Finance</h1>
    </div>
    <div class="page-body">
      <div id="fin-tiles" class="tile-row"></div>
      <div id="fin-gl-header"></div>
      <div id="fin-gl-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Finance" });
    (async () => {
      async function sf(u) {
        try { const r = await fetch(u, { headers: { Accept: "application/json" } }); return r.ok ? r.json() : null; } catch { return null; }
      }
      const [state, glData] = await Promise.all([sf("/api/state"), sf("/api/gl/accounts")]);
      const cap  = state?.capitalPositions ?? {};
      const liq  = state?.liquidityMetrics ?? {};

      function pctStatus(val, threshold) {
        if (val == null || val === "—") return null;
        const v = parseFloat(val);
        if (isNaN(v)) return null;
        if (v >= threshold) return "ok";
        if (v >= threshold - 5) return "warn";
        return "danger";
      }

      const tier1 = cap.cet1Ratio != null ? parseFloat((cap.cet1Ratio * 100).toFixed(2)) : null;
      const lcr   = liq.lcr ?? null;
      const nsfr  = liq.nsfr ?? null;

      const tiles = document.getElementById("fin-tiles");
      const mkTile = (label, val, threshold, href) => {
        const display = val != null ? `${parseFloat(val).toFixed(1)}%` : "—";
        const status = pctStatus(val, threshold);
        const t = SC.renderTile({ label, value: display, sub: `min ${threshold}%`, status, onClick: () =>
          SC.openModal({ title: label, body: SC.renderDefList({ value: display, threshold: `${threshold}%`, status, raw: val }) })
        });
        return t;
      };

      [mkTile("Tier 1 Capital", tier1, 8), mkTile("LCR", lcr, 100), mkTile("NSFR", nsfr, 100)].forEach(t => tiles.appendChild(t));

      // GL table
      const glHeader = document.getElementById("fin-gl-header");
      const glTable  = document.getElementById("fin-gl-table");
      glHeader.innerHTML = SC.renderSectionHeader("GL Summary", { label: "Events →", href: "/events.html?type=GLPosting" });
      const rows = glData?.accounts ?? [];
      SC.renderTable({
        container: glTable,
        headers: ["Account", "Name", "Debit", "Credit", "Balance"],
        rows: rows.map(a => ({
          cells: [SC.esc(a.code || a.accountCode || ""), SC.esc(a.name || ""), SC.esc(SC.fmt(a.debit)), SC.esc(SC.fmt(a.credit)), SC.esc(SC.fmt(a.balance))],
          data: a,
        })),
        onRowClick: a => SC.openModal({ title: a.name || a.code || "Account", body: SC.renderDefList(a) }),
        emptyMessage: "No GL data",
      });
    })();
  </script>
</body>
</html>
