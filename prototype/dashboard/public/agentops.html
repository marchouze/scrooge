<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentOps — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
  <style>
    .dept-metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:var(--space-4); margin-bottom:var(--space-6); }
    .dept-metric { background:var(--color-bg); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:var(--space-4); box-shadow:var(--shadow-sm); }
    .dept-metric-label { font:var(--text-caption); color:var(--color-text-secondary); text-transform:uppercase; letter-spacing:.04em; margin-bottom:var(--space-1); }
    .dept-metric-value { font:var(--text-display); color:var(--color-text-primary); line-height:1.2; }
    .dept-metric-sub { font:var(--text-caption); color:var(--color-text-secondary); margin-top:var(--space-1); }
  </style>
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">AgentOps</h1></div>
    <div class="page-body">
      <div class="dept-metrics" id="agentops-fleet-metrics">
        <div class="dept-metric"><p class="dept-metric-label">Total agents</p><p class="dept-metric-value" id="agentops-total">–</p><p class="dept-metric-sub">Registered personas</p></div>
        <div class="dept-metric"><p class="dept-metric-label">Active</p><p class="dept-metric-value" id="agentops-active">–</p><p class="dept-metric-sub">Has in-flight workstream</p></div>
        <div class="dept-metric"><p class="dept-metric-label">Idle</p><p class="dept-metric-value" id="agentops-idle">–</p><p class="dept-metric-sub">No current workstream</p></div>
        <div class="dept-metric"><p class="dept-metric-label">Fleet handlers</p><p class="dept-metric-value" id="agentops-handlers">–</p><p class="dept-metric-sub">Registered handler triggers</p></div>
        <div class="dept-metric"><p class="dept-metric-label">Substrate gaps</p><p class="dept-metric-value" id="agentops-gaps">–</p><p class="dept-metric-sub">Atlas inventory</p></div>
      </div>

      <div id="agentops-roster-header"></div>
      <div id="agentops-roster-body"></div>

      <div id="agentops-ws-header"></div>
      <div id="agentops-workstreams-body"></div>

      <div id="agentops-substrate-header"></div>
      <div id="agentops-substrate-body"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>initShell({ title: "AgentOps" });</script>
  <script src="/agentops.js"></script>
</body>
</html>
