# Rohan — daily MTM (mark-to-market) run (autonomous)
#
# Daily EOD revaluation of open FX positions per Rohan's operating spec § 6
# (Cadence). Cron `0 18 * * 1-5` — 18:00 UTC weekdays = after the JSE 17:00
# SAST close. Skips Sat/Sun (no JSE close); operator-triggered runs via
# workflow_dispatch.
#
# Brief: brief:rohan:wire-daily-mtm-cadence-fix-reversal-without-reva:2026-05-21
# Authority: D-MARKETS-SCHEMA-FOUNDATION; D-FX-SALES-TRADING-FRONTEND;
#            D-EVENT-VIEW-BOUNDARY-WIRE Slice B.1.

name: Rohan daily MTM

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:rohan-daily-mtm
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "rohan-agent[bot]"
          git config user.email "agent-rohan@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Rohan — daily MTM run ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-rohan-daily-mtm.yml.
          Per CLAUDE.md Principle 6 (Autonomous by default).
          Brief: brief:rohan:wire-daily-mtm-cadence-fix-reversal-without-reva:2026-05-21.

          Co-Authored-By: Rohan (agent) <agent-rohan@scrooge.local>"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "push rejected (attempt $i); rebasing and retrying"
            git pull --rebase --autostash origin main
          done
