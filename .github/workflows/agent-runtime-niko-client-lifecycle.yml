# Niko — client lifecycle (autonomous run)
#
# Weekly client-lifecycle cycle per Niko's operating spec § 6 (Cadence).
# Per CLAUDE.md Principle 6 (Autonomous by default).
#
# Note: Niko is paused until licence-day per CLAUDE.md operating model.
# This workflow wires the CI/GH Actions symmetry; the stub handler
# acknowledges-only until licence-day activation.
#
# Stub handler — Slice 2b of D-AGENT-AUTONOMY-OPERATIONAL closes the
# specWithoutHandler violation; full implementation activates at licence-day.

name: Niko client lifecycle

on:
  schedule:
    # Mon 08:23 UTC — weekly, off-the-hour to avoid GH Actions cron drops.
    - cron: "23 8 * * MON"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:niko-client-lifecycle
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "niko-agent[bot]"
          git config user.email "agent-niko@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Niko — client lifecycle ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-niko-client-lifecycle.yml.
          Per CLAUDE.md Principle 6 (Autonomous by default).
          Slice 2b stub under D-AGENT-AUTONOMY-OPERATIONAL (paused until licence-day).

          Co-Authored-By: Niko (agent) <agent-niko@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
