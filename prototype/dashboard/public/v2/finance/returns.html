<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Regulatory Returns — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <style>
    .v2-chip { display:inline-flex; align-items:center; padding:1px 8px; border-radius:10px; font-size:0.78em; font-weight:600; }
    .v2-chip--ok { background:var(--color-success-bg); color:var(--color-success); }
    .v2-chip--info { background:var(--color-info-bg); color:var(--color-info); }
    .v2-chip--muted { background:var(--color-surface-raised); color:var(--color-text-secondary); }
    .v2-mono { font-family:var(--font-mono, ui-monospace, monospace); font-size:0.92em; }
    .v2-note { margin-top:12px; padding:10px 12px; border-radius:6px; background:var(--color-surface-raised);
      color:var(--color-text-secondary); font-size:0.85em; line-height:1.5; }
    /* Expandable returns register — click a row to reveal its populated cells. */
    .v2-ret-caret { display:inline-block; width:1em; color:var(--color-text-secondary); transition:transform .12s ease; }
    tr[aria-expanded="true"] .v2-ret-caret { transform:rotate(90deg); }
    .v2-ret-detail-cell { padding:0 !important; background:var(--color-surface-raised); }
    .v2-ret-detail { padding:14px 18px; }
    .v2-ret-detail h3 { margin:0 0 4px; font-size:0.95em; }
    .v2-ret-detail .v2-ret-sub { margin:0 0 12px; font-size:0.82em; color:var(--color-text-secondary); }
    .v2-ret-kv { width:100%; border-collapse:collapse; font-size:0.88em; }
    .v2-ret-kv th, .v2-ret-kv td { text-align:left; padding:5px 10px; border-bottom:1px solid var(--color-border); }
    .v2-ret-kv th { font-weight:600; color:var(--color-text-secondary); white-space:nowrap; }
    .v2-ret-kv td.v2-ret-num { text-align:right; font-family:var(--font-mono, ui-monospace, monospace); }
    .v2-ret-empty { font-size:0.85em; color:var(--color-text-secondary); font-style:italic; }
    .v2-ret-gap { margin-top:10px; font-size:0.8em; color:var(--color-text-secondary); }
</style>
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html" title="Errors &amp; recon violations">
        <span class="v2-errors-icon">⚠</span>
        <span class="v2-errors-count" id="errors-count">…</span>
      </a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script src="/v2/_v2-data.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [{ label: "Executive", href: "/v2/index.html" }, { label: "Finance", href: "/v2/finance/index.html" }, { label: "Regulatory Returns" }],
      title: "Regulatory Returns",
      seat: "SARB submissions",
    });

    // Mount points the loader repaints. The page is data-driven: every form name,
    // status and figure comes from GET /api/v2/finance/returns (sourced from the
    // typed BA-return contract registry — no hard-coded form names here).
    const tilesMount = document.createElement("div"); main.appendChild(tilesMount);
    const tableSection = document.createElement("div"); tableSection.className = "v2-section"; main.appendChild(tableSection);
    const tableHeading = document.createElement("h2"); tableHeading.className = "v2-section-title"; tableHeading.textContent = "Returns Register"; tableSection.appendChild(tableHeading);
    const tableMount = document.createElement("div"); tableSection.appendChild(tableMount);

    renderRefs(main, {
      refs: [
        { label: "SARB BA-return canonical register (Excel A1 names)", href: "/v2/compliance/regulations.html" },
        { label: "D-BA-RETURN-NUMBERING-EXCEL-CANONICAL", href: "#" },
        { label: "D-BANK-WIDE-V2-MIGRATION", href: "#" },
      ],
    });

    // Format functional-currency minor units as a major-unit figure for display.
    function fmtMinor(minor, ccy) {
      if (minor === null || minor === undefined) return "—";
      const major = (Number(minor) / 100).toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return `${v2Esc(ccy)} ${major}`;
    }

    function statusChip(status) {
      const label = status === "live" ? "Live" : status === "built" ? "Built" : "Planned";
      const variant = status === "live" ? "ok" : status === "built" ? "info" : "muted";
      return `<span class="v2-chip v2-chip--${variant}">${label}</span>`;
    }

    function carRatioTile(returns) {
      const ba700 = returns.find((r) => r.form === "BA 700");
      const fig = ba700 && ba700.figures;
      if (!fig || fig.carRatio === null || fig.carRatio === undefined) {
        return { label: "BA 700", value: "—", unit: "Total capital ratio (RWA is zero — no real capital)" };
      }
      return { label: "BA 700", value: `${(fig.carRatio * 100).toFixed(2)}%`, unit: "Total capital ratio" };
    }

    function fxChargeTile(returns, ccy) {
      const ba320 = returns.find((r) => r.form === "BA 320");
      const fig = ba320 && ba320.figures;
      if (!fig || fig.openPositionChargeMinor === null || fig.openPositionChargeMinor === undefined) {
        return { label: "BA 320", value: "—", unit: "FX open-position charge (no production rate)" };
      }
      return { label: "BA 320", value: fmtMinor(fig.openPositionChargeMinor, ccy), unit: "FX open-position charge" };
    }

    // Headline cell per row — the live figure, else "—".
    function headlineFor(row, ccy) {
      if (row.status !== "live" || !row.figures) return "—";
      if (row.form === "BA 700") {
        const r = row.figures.carRatio;
        return (r === null || r === undefined) ? "—" : `CAR ${(r * 100).toFixed(2)}%`;
      }
      if (row.form === "BA 320") {
        return fmtMinor(row.figures.openPositionChargeMinor, ccy);
      }
      return "—";
    }

    // Source cell — the read path (V1 / V2) for live rows, else blank.
    function sourceFor(row) {
      if (row.status !== "live" || !row.readPath) return "";
      return `<span class="v2-mono">${row.readPath.toUpperCase()} read</span>`;
    }

    // ---- Detail panel: the actual populated data for one return -------------
    // The figures already arrive in the API payload for live returns. We render
    // them as a real cell table; planned returns (a typed contract but no
    // on-demand figure route) say so honestly rather than faking a table.

    function kvTable(pairs) {
      const body = pairs
        .map(([k, v]) => `<tr><th>${v2Esc(k)}</th><td class="v2-ret-num">${v}</td></tr>`)
        .join("");
      return `<table class="v2-ret-kv"><tbody>${body}</tbody></table>`;
    }

    function gapNote(figures) {
      if (!figures || !figures.gaps || figures.gaps.length === 0) return "";
      return `<p class="v2-ret-gap"><strong>Gaps:</strong> ${figures.gaps.map(v2Esc).join(", ")}</p>`;
    }

    function filingNote(row) {
      if (!row.filing) return "";
      const f = row.filing;
      const filed = f.lastFiled ? v2Esc(f.lastFiled) : "generated, not yet filed";
      const mode = f.mode ? ` (${v2Esc(f.mode)})` : "";
      return `<p class="v2-ret-sub">Reporting period ${v2Esc(f.reportingPeriod)} · ${filed}${mode}` +
        ` · hash <span class="v2-mono">${v2Esc(String(f.contentHash).slice(0, 12))}…</span></p>`;
    }

    // Build the inner HTML of the detail panel for a return row.
    function detailHtml(row, ccy) {
      if (row.status !== "live" || !row.figures) {
        return `<div class="v2-ret-detail"><p class="v2-ret-empty">No populated figures yet — ` +
          `a typed cell-data contract exists for this return, but no on-demand ` +
          `figure-producing route is wired (status: planned).</p></div>`;
      }
      const fig = row.figures;
      let inner;
      if (row.form === "BA 700") {
        inner = kvTable([
          ["Tier 1 capital", fmtMinor(fig.tier1Capital, ccy)],
          ["Tier 2 capital", fmtMinor(fig.tier2Capital, ccy)],
          ["Total risk-weighted assets (RWA)", fmtMinor(fig.totalRwa, ccy)],
          ["Total capital ratio (CAR)", fig.carRatio === null || fig.carRatio === undefined
            ? "—" : `${(fig.carRatio * 100).toFixed(2)}%`],
          ["Coverage status", v2Esc(fig.coverageStatus)],
        ]);
      } else if (row.form === "BA 320") {
        let posTable;
        if (!fig.positions || fig.positions.length === 0) {
          posTable = `<p class="v2-ret-empty">No open FX positions on the build store ` +
            `(no executed FX trades, or no production rate — fail-closed).</p>`;
        } else {
          const posRows = fig.positions.map((p) =>
            `<tr><th>${v2Esc(p.baseCurrency)}</th>` +
            `<td class="v2-ret-num">${p.rateAvailable
              ? fmtMinor(p.netPositionFunctionalMinor, ccy)
              : "— (no rate)"}</td></tr>`).join("");
          posTable = `<table class="v2-ret-kv"><thead><tr><th>Currency</th>` +
            `<th class="v2-ret-num">Net open position</th></tr></thead><tbody>${posRows}</tbody></table>`;
        }
        const summary = kvTable([
          ["FX open-position charge (Reg 28(5), 8%)",
            fmtMinor(fig.openPositionChargeMinor, ccy)],
          ["Coverage status", v2Esc(fig.coverageStatus)],
        ]);
        inner = `${posTable}<div style="height:12px"></div>${summary}`;
      } else {
        inner = `<p class="v2-ret-empty">No detail renderer for this return.</p>`;
      }
      return `<div class="v2-ret-detail">` +
        `<h3>${v2Esc(row.form)} — ${v2Esc(row.name)}</h3>` +
        filingNote(row) +
        (row.readPath ? `<p class="v2-ret-sub">Figures from the ${v2Esc(row.readPath.toUpperCase())} read path.</p>` : "") +
        inner + gapNote(fig) + `</div>`;
    }

    // Build the register as an expandable table: each row toggles a detail row
    // beneath it showing the return's actual populated cells.
    function renderExpandableReturns(mount, returns, ccy) {
      mount.replaceChildren();
      if (returns.length === 0) {
        renderTable(mount, { columns: ["Return"], rows: [], emptyMsg: "No returns in the register." });
        return;
      }
      const wrapper = document.createElement("div");
      wrapper.className = "v2-table-wrapper";
      const table = document.createElement("table");
      table.className = "v2-table";
      const columns = ["", "Return", "Description", "Status", "Headline", "Source"];
      table.innerHTML = `<thead><tr>${columns.map((c) => `<th>${c}</th>`).join("")}</tr></thead>`;
      const tbody = document.createElement("tbody");

      returns.forEach((r, i) => {
        const tr = document.createElement("tr");
        tr.className = "v2-table-row-link";
        tr.tabIndex = 0;
        tr.setAttribute("aria-expanded", "false");
        tr.innerHTML = [
          `<span class="v2-ret-caret">▸</span>`,
          `<span class="v2-mono">${v2Esc(r.form)}</span>`,
          v2Esc(r.name),
          statusChip(r.status),
          headlineFor(r, ccy),
          sourceFor(r),
        ].map((c) => `<td>${c}</td>`).join("");

        const detail = document.createElement("tr");
        detail.style.display = "none";
        detail.innerHTML = `<td class="v2-ret-detail-cell" colspan="${columns.length}">${detailHtml(r, ccy)}</td>`;

        const toggle = () => {
          const open = detail.style.display !== "none";
          detail.style.display = open ? "none" : "";
          tr.setAttribute("aria-expanded", open ? "false" : "true");
        };
        tr.addEventListener("click", toggle);
        tr.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
        });

        tbody.appendChild(tr);
        tbody.appendChild(detail);
      });

      table.appendChild(tbody);
      wrapper.appendChild(table);
      mount.appendChild(wrapper);
    }

    v2WireLoader(async () => {
      tilesMount.replaceChildren();
      tableMount.replaceChildren();
      let data;
      try {
        data = await v2Fetch("/api/v2/finance/returns");
      } catch (err) {
        v2RenderError(tilesMount, v2Esc(err.message));
        return;
      }

      const ccy = data.functionalCurrency;
      renderTileGroup(tilesMount, {
        tiles: [
          carRatioTile(data.returns),
          fxChargeTile(data.returns, ccy),
          { label: "Returns Built", value: `${data.liveCount} / ${data.totalCount}`, unit: "Live on-demand of canonical returns" },
          // No ReportFiled / filing-lifecycle event exists — overdue cannot be
          // sourced. Honest "N/A", never a fabricated count.
          { label: "Overdue Returns", value: "N/A", unit: "No filing-lifecycle event (see gap)" },
        ],
      });

      renderExpandableReturns(tableMount, data.returns, ccy);

      // Surface the filing-lifecycle substrate gap honestly beneath the table.
      if (data.filingLifecycleGap) {
        const note = document.createElement("p");
        note.className = "v2-note";
        note.innerHTML = `<strong>Substrate gap (${v2Esc(data.filingLifecycleGap.id)}):</strong> ${v2Esc(data.filingLifecycleGap.reason)}`;
        tableMount.appendChild(note);
      }
    });
  </script>
</body>
</html>
