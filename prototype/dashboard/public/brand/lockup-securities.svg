<!-- lockup-securities.svg — Hoz Securities sub-brand lockup (mark + wordmark + qualifier).
     Authority: D-LEGAL-ENTITY-TREE-V0 (PR #82, merged 2026-05-09);
     Linnea v1 brand package §2.1 (Direction A construction; IBM Plex Sans);
     Linnea v3 brand-application supplement §2.1 (lockup family);
     Linnea v3.2 sub-brand application §1, §3.
     Use: Hoz Securities Limited contexts — JSE-facing correspondence,
     FSCA correspondence headers, securities-trading counterparty letterheads,
     trading business cards.
     Min size: 248px wide. Clear-space: one mark-diameter on all sides.
     Construction: 348×64 viewBox (extends group lockup 220×64 by 128u for the
     longer "Securities" qualifier). Mark + wordmark are dimensionally identical
     to lockup-lockup.svg (per v3.2 §3 rules: mark is the consistent group anchor).
     Sub-brand qualifier "Securities" set in IBM Plex Sans 500 at 20u, baseline at
     y=40u (aligned with wordmark optical baseline), separated by a 1u-wide
     vertical divider at x=144u running 14u→44u. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348 64" width="348" height="64" role="img" aria-label="Hoz Securities — sub-brand lockup">
  <!-- Mark (identical to group lockup) -->
  <g>
    <circle cx="32" cy="32" r="28" fill="none" stroke="#1F2A37" stroke-width="2"/>
    <line x1="6" y1="24" x2="58" y2="24" stroke="#1F2A37" stroke-width="3" stroke-linecap="square"/>
  </g>
  <!-- Wordmark "Hoz" (identical to group lockup) -->
  <text x="76" y="44"
        font-family="Inter, 'Inter Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="36" font-weight="700" fill="#1F2A37" letter-spacing="-0.5">Hoz</text>
  <!-- Divider -->
  <line x1="144" y1="20" x2="144" y2="44" stroke="#1F2A37" stroke-width="1" stroke-linecap="square"/>
  <!-- Sub-brand qualifier "Securities" (IBM Plex Sans 500) -->
  <text x="156" y="40"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="500" fill="#1F2A37" letter-spacing="0.2">Securities</text>
</svg>
