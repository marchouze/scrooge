<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Event Log — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <style>
    .ev-controls { display:flex; gap:var(--space-3); align-items:center; flex-wrap:wrap; margin-bottom:var(--space-4); }
    .ev-controls input, .ev-controls select { padding:6px 10px; border:1px solid var(--color-border);
      border-radius:var(--radius-sm); background:var(--color-surface); color:var(--color-text-primary); font:var(--text-body); }
    .ev-controls input { min-width:150px; }
    .ev-pager { display:flex; gap:var(--space-3); align-items:center; margin-top:var(--space-4); flex-wrap:wrap; }
    .ev-pager button { padding:6px 14px; border:1px solid var(--color-border); border-radius:var(--radius-sm);
      background:var(--color-surface); color:var(--color-text-primary); cursor:pointer; }
    .ev-pager button:disabled { opacity:.45; cursor:default; }
    .ev-pager .v2-count { color:var(--color-text-secondary); font:var(--text-caption); margin-left:auto; }
    .ev-lens { display:inline-flex; align-items:center; padding:2px 10px; border-radius:12px;
      font-size:0.76em; font-weight:600; background:var(--color-surface-raised); color:var(--color-text-secondary); }
    .ev-type { font-family:ui-monospace,monospace; font-size:0.84em; }
    .ev-prov { font-size:0.72em; font-weight:700; }
    .ev-prov--production { color:var(--color-success); }
    .ev-prov--simulated { color:var(--color-warning); }
    .ev-prov--none { color:var(--color-text-disabled); }
    details.ev-payload > summary { cursor:pointer; color:var(--color-accent); font-size:0.82em; }
    details.ev-payload pre { margin:6px 0 0; padding:8px; background:var(--color-surface-raised);
      border-radius:var(--radius-sm); overflow:auto; font-size:0.78em; max-height:320px; }
  </style>
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <span class="ev-lens" id="lens">lens: all</span>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script src="/v2/_v2-data.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [
        { label: "Executive", href: "/v2/index.html" },
        { label: "Operations", href: "/v2/operations/index.html" },
        { label: "Event Log" },
      ],
      title: "Event Log",
      seat: "The single source of truth — every typed event in append order (Principle 1). Filter, search, and inspect payloads.",
    });

    const stateHost = document.createElement("div"); main.appendChild(stateHost);
    const tilesHost = document.createElement("div"); main.appendChild(tilesHost);
    const section = document.createElement("div"); section.className = "v2-section"; main.appendChild(section);
    const controls = document.createElement("div"); controls.className = "ev-controls";
    controls.innerHTML = `
      <input type="search" id="q" placeholder="Search id · payload…" aria-label="Search events">
      <select id="type" aria-label="Filter by type"><option value="">All types</option></select>
      <input type="text" id="entity" placeholder="Entity (e.g. LE-ZA-HOZ-BANK)" aria-label="Filter by entity">
      <select id="provenance" aria-label="Filter by provenance">
        <option value="all">All provenance</option>
        <option value="production-only">Production only</option>
        <option value="simulated-only">Simulated only</option>
      </select>
      <select id="limit" aria-label="Page size">
        <option value="25">25 / page</option>
        <option value="50" selected>50 / page</option>
        <option value="100">100 / page</option>
        <option value="200">200 / page</option>
      </select>`;
    section.appendChild(controls);
    const tableHost = document.createElement("div"); section.appendChild(tableHost);
    const pager = document.createElement("div"); pager.className = "ev-pager";
    pager.innerHTML = `
      <button id="prev">‹ Prev</button>
      <span id="pageinfo" class="ev-type"></span>
      <button id="next">Next ›</button>
      <span class="v2-count" id="count"></span>`;
    section.appendChild(pager);

    let page = 1;
    let typesLoaded = false;
    let searchTimer = null;

    const provTag = (p) => {
      const kind = p && p.kind ? p.kind : (p === null ? "none" : "production");
      const cls = kind === "simulated" ? "simulated" : kind === "production" ? "production" : "none";
      return `<span class="ev-prov ev-prov--${cls}">${v2Esc(kind)}</span>`;
    };
    const actorLabel = (a) => (a && typeof a === "object" ? `${v2Esc(a.type || "")}:${v2Esc(a.id || "")}` : "—");

    async function load() {
      const q = document.getElementById("q").value.trim();
      const type = document.getElementById("type").value;
      const entity = document.getElementById("entity").value.trim();
      const provenance = document.getElementById("provenance").value;
      const limit = document.getElementById("limit").value;
      document.getElementById("lens").textContent = `lens: ${provenance.replace("-only", "")}`;

      const params = new URLSearchParams();
      params.set("page", String(page));
      params.set("limit", limit);
      if (type) params.set("type", type);
      if (entity) params.set("entity", entity);
      if (q) params.set("search", q);
      if (provenance !== "all") params.set("provenance", provenance);

      tableHost.innerHTML = "";
      let d;
      try {
        const res = await fetch(`/api/events?${params.toString()}`, { headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        d = await res.json();
      } catch (err) { v2RenderError(tableHost, v2Esc(err.message)); return; }

      page = d.page;
      document.getElementById("as-of").textContent = `${d.storeCount.toLocaleString()} events in store`;

      if (!typesLoaded && Array.isArray(d.types)) {
        const sel = document.getElementById("type");
        for (const t of d.types) { const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o); }
        if (type) sel.value = type;
        typesLoaded = true;
      }

      renderTileGroup(tilesHost, { tiles: [
        { label: "Events in store", value: d.storeCount.toLocaleString(), unit: "Total appended (Principle 1)" },
        { label: "Matching filter", value: d.total.toLocaleString(), unit: "Under current lens" },
        { label: "Event types", value: String((d.types || []).length), unit: "Distinct kinds" },
        { label: "Page", value: `${d.page} / ${d.totalPages}`, unit: `${limit} per page` },
      ]});

      const wrap = document.createElement("div"); wrap.className = "v2-table-wrapper";
      const table = document.createElement("table"); table.className = "v2-table";
      table.innerHTML = `<thead><tr><th>#</th><th>As of</th><th>Type</th><th>Entity</th><th>Actor</th><th>Prov.</th><th>Event id</th><th>Payload</th></tr></thead>`;
      const tbody = document.createElement("tbody");
      const rows = d.events || [];
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="v2-table-empty">No events match the active filters.</td></tr>`;
      } else {
        for (const ev of rows) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${ev.sequence}</td>
            <td>${v2Esc((ev.as_of || "").replace("T", " ").slice(0, 19))}</td>
            <td><span class="ev-type">${v2Esc(ev.type)}</span></td>
            <td>${v2Esc(ev.entity)}</td>
            <td>${actorLabel(ev.actor)}</td>
            <td>${provTag(ev.provenance)}</td>
            <td><code>${v2Esc(ev.event_id)}</code></td>
            <td><details class="ev-payload"><summary>view</summary><pre>${v2Esc(JSON.stringify(ev.payload, null, 2))}</pre></details></td>`;
          tbody.appendChild(tr);
        }
      }
      table.appendChild(tbody); wrap.appendChild(table); tableHost.appendChild(wrap);

      document.getElementById("pageinfo").textContent = `Page ${d.page} of ${d.totalPages}`;
      document.getElementById("count").textContent = `${d.total.toLocaleString()} event(s) match`;
      document.getElementById("prev").disabled = d.page <= 1;
      document.getElementById("next").disabled = d.page >= d.totalPages;
    }

    function reload() { page = 1; load(); }

    document.getElementById("q").addEventListener("input", () => {
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(reload, 250);
    });
    document.getElementById("entity").addEventListener("input", () => {
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(reload, 250);
    });
    for (const id of ["type", "provenance", "limit"]) {
      document.getElementById(id).addEventListener("change", reload);
    }
    document.getElementById("prev").addEventListener("click", () => { if (page > 1) { page -= 1; load(); } });
    document.getElementById("next").addEventListener("click", () => { page += 1; load(); });

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", load);
    else load();
  </script>
</body>
</html>
