# Thandiwe — audit-committee prep (autonomous run)
#
# Weekly aggregation of Vera's continuous-controls findings, Owen's
# governance-cycle prep, and recent third-line-relevant events into an
# AC-ready digest per Thandiwe's operating spec § Cadence. Per CLAUDE.md
# Principle 7 (Autonomous by default).

name: Thandiwe audit-committee prep

on:
  schedule:
    - cron: "47 7 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          # Optional. Thandiwe narrative; graceful no-op if unset.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:thandiwe-audit-committee-prep
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "thandiwe-agent[bot]"
          git config user.email "agent-thandiwe@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Thandiwe — audit-committee prep ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-thandiwe-audit-committee-prep.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).

          Co-Authored-By: Thandiwe (agent) <agent-thandiwe@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
