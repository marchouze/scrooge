# Mira — obligations register snapshot (autonomous run)
#
# Weekly snapshot of the obligations register and regulator-instrument
# index per Mira's operating spec § Cadence. Per CLAUDE.md Principle 7.

name: Mira obligations snapshot

on:
  schedule:
    - cron: "0 7 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          # Optional. When present, Mira generates a narrative summary on
          # top of the mechanical snapshot. When absent the run still
          # succeeds and the deliverable simply notes the narrative was
          # skipped. Set under Settings → Secrets and variables → Actions.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:mira-obligations-snapshot
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "mira-agent[bot]"
          git config user.email "agent-mira@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Mira — obligations snapshot ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-mira-obligations-snapshot.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).

          Co-Authored-By: Mira (agent) <agent-mira@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
