<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Fleet</h1></div>
    <div class="page-body">
      <div id="fleet-tiles" class="tile-row"></div>
      <div id="fleet-header"></div>
      <div id="fleet-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Fleet" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      const data = await sf("/api/fleet");
      const d = data ?? {};
      const tilesEl = document.getElementById("fleet-tiles");
      [
        SC.renderTile({ label:"Total", value:d.total??d.count??"—", href:"/agents.html", status:"info" }),
        SC.renderTile({ label:"Active", value:d.active??"—", href:"/agents.html", status:"ok" }),
        SC.renderTile({ label:"Idle", value:d.idle??"—", href:"/agents.html", status:"warn" }),
        SC.renderTile({ label:"Failed", value:d.failed??"—", href:"/agents.html", status:(d.failed??0)>0?"danger":"ok" }),
      ].forEach(t => tilesEl.appendChild(t));
      const breakdown = d.breakdown ?? d.byStatus ?? d.agents ?? [];
      if (Array.isArray(breakdown) && breakdown.length > 0) {
        document.getElementById("fleet-header").innerHTML = SC.renderSectionHeader("By Status", null);
        SC.renderTable({
          container: document.getElementById("fleet-table"),
          headers: ["Status","Count"],
          rows: breakdown.map(b => ({
            cells: [SC.renderBadge(b.status||b.name||""), SC.esc(SC.fmt(b.count||b.value))],
            data: b,
          })),
          emptyMessage: "No breakdown data",
        });
      }
    })();
  </script>
</body>
</html>
