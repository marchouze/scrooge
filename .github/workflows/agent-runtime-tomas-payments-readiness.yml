# Tomas — daily payments-readiness (autonomous run)
#
# Daily payments-readiness attestation per Tomas's operating spec § 6
# (Cadence). Engineer-side counterpart to Devon's weekly
# OperationalResilienceSnapshot — closes the resilience-side ↔ rails-side
# loop on the payments substrate.
# Per CLAUDE.md Principle 7 (Autonomous by default).
#
# Thirteenth handler in the fleet-rollout sequence under
# D-FLEET-ROLLOUT-SEQUENCING (approved 2026-05-08).

name: Tomas payments readiness

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:tomas-payments-readiness
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "tomas-agent[bot]"
          git config user.email "agent-tomas@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Tomas — daily payments-readiness ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-tomas-payments-readiness.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).
          Fleet-rollout under D-FLEET-ROLLOUT-SEQUENCING.

          Co-Authored-By: Tomas (agent) <agent-tomas@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
