<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client Onboarding — Hoz Bank</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
</head>
<body data-provenance-source="/api/v2/clients/onboarding">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Hoz Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <span data-provenance-badge="page-top"></span>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html"><span class="v2-errors-icon">⚠</span><span id="errors-count">…</span></a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script src="/v2/_v2-data.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [
        { label: "Executive", href: "/v2/index.html" },
        { label: "Commercial", href: "/v2/commercial/index.html" },
        { label: "Client Onboarding" },
      ],
      title: "Client Onboarding",
      seat: "Born-V2 counterparty onboarding lifecycle · FIC / FAIS / POPIA gating · sounding → activated",
    });

    const stateHost = document.createElement("div"); main.appendChild(stateHost);
    const tilesHost = document.createElement("div"); main.appendChild(tilesHost);
    const boardHost = document.createElement("div"); main.appendChild(boardHost);
    const violHost = document.createElement("div"); main.appendChild(violHost);
    const refsHost = document.createElement("div"); main.appendChild(refsHost);

    const phaseLabel = (p) => String(p ?? "").replace(/-/g, " ");

    v2WireLoader(async () => {
      stateHost.replaceChildren(); tilesHost.replaceChildren();
      boardHost.replaceChildren(); violHost.replaceChildren(); refsHost.replaceChildren();
      let d;
      try {
        d = await v2Fetch("/api/v2/clients/onboarding");
      } catch (err) {
        v2RenderError(stateHost, v2Esc(err.message));
        return;
      }
      document.getElementById("as-of").textContent = `as of ${new Date(d.asOf).toLocaleString()}`;

      // Honest data-state banner — never a silent zero (Engineering Charter cmd 3).
      if (d.dataState === "empty") {
        const banner = document.createElement("div");
        banner.className = "v2-section";
        banner.innerHTML = `
          <div class="v2-empty">
            <div class="v2-empty-icon">○</div>
            <div class="v2-empty-msg"><strong>No client onboardings under this lens.</strong><br>${v2Esc(d.reason)}</div>
          </div>`;
        stateHost.appendChild(banner);
      }

      // Headline tiles — total clients + activated + gating requirement.
      renderTileGroup(tilesHost, {
        tiles: [
          { label: "Clients", value: String(d.totalCount), unit: "onboarded" },
          { label: "Activated", value: String(d.activeCount), unit: "live counterparties" },
          { label: "Required gates", value: String(d.gatesRequired), unit: "CDD / FAIS / POPIA / credit / accounts" },
        ],
      });

      // Client board — one row per counterparty (phase, jurisdiction, sector, KYC tier, gates).
      const cs = document.createElement("div"); cs.className = "v2-section"; boardHost.appendChild(cs);
      const ch = document.createElement("h2"); ch.className = "v2-section-title"; ch.textContent = "Onboarded clients"; cs.appendChild(ch);
      renderTable(cs, {
        columns: ["Client", "Jurisdiction", "Sector", "KYC tier", "Phase", "Gates"],
        emptyMsg: "No clients folded under this lens. Switch to + Sim to view the 15 simulated institutional clients.",
        rows: d.clients.map((c) => {
          const activated = c.phase === "activated";
          const phaseBadge = activated
            ? `<span class="v2-badge v2-badge-success">${v2Esc(phaseLabel(c.phase))}</span>`
            : c.phase === "offboarded"
              ? `<span class="v2-badge v2-badge-danger">${v2Esc(phaseLabel(c.phase))}</span>`
              : `<span class="v2-badge v2-badge-info">${v2Esc(phaseLabel(c.phase))}</span>`;
          const gateBadge = c.gatesPassed === c.gatesRequired
            ? `<span class="v2-badge v2-badge-success">${c.gatesPassed}/${c.gatesRequired}</span>`
            : `<span class="v2-badge v2-badge-warning">${c.gatesPassed}/${c.gatesRequired}</span>`;
          return {
            cells: [
              `<strong>${v2Esc(c.legalName || c.counterpartyId)}</strong>`,
              v2Esc(c.jurisdiction || "—"),
              v2Esc(c.sector || "—"),
              v2Esc(c.kycTier || "—"),
              phaseBadge,
              gateBadge,
            ],
          };
        }),
      });

      // Integrity violations — fail-closed surface (should be empty; honest if not).
      if (d.violations && d.violations.length > 0) {
        const vs = document.createElement("div"); vs.className = "v2-section"; violHost.appendChild(vs);
        const vh = document.createElement("h2"); vh.className = "v2-section-title"; vh.textContent = "Gating-invariant violations"; vs.appendChild(vh);
        renderTable(vs, {
          columns: ["Counterparty", "Kind", "Message"],
          rows: d.violations.map((v) => ({
            cells: [
              v2Esc(v.counterpartyId),
              `<span class="v2-badge v2-badge-danger">${v2Esc(v.kind)}</span>`,
              v2Esc(v.message),
            ],
          })),
        });
      }

      renderRefs(refsHost, {
        refs: [
          { label: "FIC Act 38 of 2001 — CDD / sanctions / beneficial ownership", href: "/v2/compliance/reader.html?slug=fic-act" },
          { label: "FAIS Act 37 of 2002 — client categorisation", href: "/v2/compliance/reader.html?slug=fais-act" },
          { label: "POPIA — lawful-processing consent (s.11)", href: "/v2/compliance/reader.html?slug=popia" },
          { label: "Client-onboarding event family (WS-V2-CLIENT-ONBOARDING)", href: "/v2/operations/schemas.html?type=ClientOnboardingActivated" },
        ],
      });
    });
  </script>
</body>
</html>
