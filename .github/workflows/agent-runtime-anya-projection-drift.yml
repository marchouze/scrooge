# Anya — projection drift (autonomous run)
#
# Daily projection-drift sweep per Anya's operating spec § 6 (Cadence).
# Per CLAUDE.md Principle 7 (Autonomous by default).

name: Anya projection drift

on:
  workflow_dispatch: {}

permissions:
  contents: write

# Serialise auto-commit pushes across all agent workflows.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: prototype
        run: bun install --frozen-lockfile
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - working-directory: prototype
        env:
          # Optional. Anya narrative; graceful no-op if unset.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run agent:anya-projection-drift
      - working-directory: prototype
        env:
          BANK_EVENT_DB_URL: ${{ secrets.BANK_EVENT_DB_URL }}
        run: bun run event-store:sync
      - run: |
          git config user.name "anya-agent[bot]"
          git config user.email "agent-anya@scrooge.local"
          git pull --rebase --autostash origin main
          git add "Owner Inbox/" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Anya — projection drift ${DATE} (autonomous)

          Generated by .github/workflows/agent-runtime-anya-projection-drift.yml.
          Per CLAUDE.md Principle 7 (Autonomous by default).

          Co-Authored-By: Anya (agent) <agent-anya@scrooge.local>"
          for i in 1 2 3 4 5; do

            if git push; then break; fi

            echo "push rejected (attempt $i); rebasing and retrying"

            git pull --rebase --autostash origin main

          done
