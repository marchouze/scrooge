<!-- favicon-16.svg — Hoz favicon at 16×16 (browser tab, low-DPI).
     Authority: Linnea v3 brand-supplement §3.3.
     The 16-grid variant scales stroke to 1u/2u (from v1's 2u/3u on a
     64-grid) so the chord remains visible without anti-alias mush at
     this density. This is the only variant that deviates from the v1
     construction — justified per §3.3. Slate ink on Paper. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Hoz">
  <rect width="16" height="16" fill="#F7F4EE"/>
  <circle cx="8" cy="8" r="6.5" fill="none" stroke="#1F2A37" stroke-width="1"/>
  <line x1="1.5" y1="6" x2="14.5" y2="6" stroke="#1F2A37" stroke-width="2" stroke-linecap="square"/>
</svg>
