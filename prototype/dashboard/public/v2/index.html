<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Executive Home — Scrooge V2</title>
  <link rel="stylesheet" href="/v2/_v2-shell.css">
  <link rel="stylesheet" href="/v2/_v2-tile.css">
  <link rel="stylesheet" href="/provenance-badge.css">
</head>
<body data-provenance-content="none">
  <header class="v2-header">
    <div class="v2-header-left">
      <button class="v2-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
      <a class="v2-brand" href="/v2/index.html">Scrooge Bank <span class="v2-phase-badge">Build Phase</span></a>
    </div>
    <div class="v2-header-right">
      <div class="v2-prov-control">
        <button class="v2-prov-btn" data-mode="prod">Prod</button>
        <button class="v2-prov-btn" data-mode="prod+sim">+ Sim</button>
      </div>
      <a class="v2-errors-badge" id="errors-badge" href="/v2/errors.html" title="Errors &amp; recon violations">
        <span class="v2-errors-icon">⚠</span>
        <span class="v2-errors-count" id="errors-count">…</span>
      </a>
      <span class="v2-as-of" id="as-of">—</span>
    </div>
  </header>
  <div class="v2-layout">
    <nav class="v2-sidebar" id="v2-sidebar"></nav>
    <main class="v2-main" id="v2-main"></main>
  </div>
  <script src="/v2/_v2-shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/v2/_v2-tile.js"></script>
  <script>
    const main = document.getElementById("v2-main");
    renderPageHeader(main, {
      crumbs: [{ label: "Executive" }],
      title: "Executive Overview",
    });

    renderTileGroup(main, {
      title: "Financial Health",
      tiles: [
        { label: "CET-1 Ratio", unit: "CET-1 Capital / RWA", href: "/v2/finance/capital.html" },
        { label: "LCR", unit: "HQLA / Net cash outflows", href: "/v2/treasury/lcr.html" },
        { label: "NSFR", unit: "ASF / RSF", href: "/v2/treasury/nsfr.html" },
        { label: "Daily P&L", unit: "Realised + Unrealised", href: "/v2/finance/pnl.html" },
      ],
    });

    renderTileGroup(main, {
      title: "Risk",
      tiles: [
        { label: "Value at Risk (99%)", unit: "1-day, 10-day", href: "/v2/risk/market.html" },
        { label: "SA-CCR EAD", unit: "RC + PFE", href: "/v2/risk/credit.html" },
        { label: "Op Risk Events", unit: "MTD count", href: "/v2/risk/operational.html" },
        { label: "RAS Headroom", unit: "Appetite − Exposure", href: "/v2/risk/appetite.html" },
      ],
    });

    renderTileGroup(main, {
      title: "Operations",
      tiles: [
        { label: "Live FIL Positions", unit: "Active instruments", href: "/v2/markets/positions.html" },
        { label: "Recon Gates", unit: "Pass / Total", href: "/v2/audit/recon.html" },
        { label: "Active Agents", unit: "In fleet", href: "/v2/operations/agents.html" },
        { label: "Open Decisions", unit: "Awaiting CEO", href: "/v2/governance/decisions.html" },
      ],
    });
  </script>
</body>
</html>
