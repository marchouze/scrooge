<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procedures — Scrooge Bank</title>
  <link rel="stylesheet" href="/_brand.css">
  <link rel="stylesheet" href="/provenance-badge.css">
  <link rel="stylesheet" href="/_shell.css">
</head>
<body>
  <div id="shell"></div>
  <main id="content" class="main-content">
    <span data-provenance-badge="page-top" aria-label="Provenance badge"></span>
    <div class="page-header"><h1 class="page-title">Procedures</h1></div>
    <div class="page-body">
      <div id="proc-tabs" class="tab-bar"></div>
      <div id="proc-table"></div>
    </div>
  </main>
  <script src="/_shell.js"></script>
  <script src="/provenance-badge.js"></script>
  <script src="/_components.js"></script>
  <script>
    initShell({ title: "Procedures" });
    (async () => {
      async function sf(u) { try { const r = await fetch(u,{headers:{Accept:"application/json"}}); return r.ok?r.json():null; } catch { return null; } }
      document.getElementById("proc-table").innerHTML = SC.renderSkeleton(8);
      const data = await sf("/api/procedures");
      const all = Array.isArray(data)
        ? data
        : (data?.items ?? data?.procedures
            ?? (data?.groups
                ? data.groups.flatMap(g => g.rows.map(r => ({ ...r, domain: g.domain, title: r.procedureTitle || r.title || "" })))
                : []));
      const tabs = ["All","Populated","Draft","Planned"];
      let activeTab = "All";
      const tabsEl = document.getElementById("proc-tabs");
      function mdToHtml(md) {
        if (!md) return "";
        return SC.esc(md)
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n/g, "<br>");
      }
      function render() {
        const rows = activeTab === "All" ? all : all.filter(p => (p.status||"").toLowerCase() === activeTab.toLowerCase());
        SC.renderTable({
          container: document.getElementById("proc-table"),
          headers: ["ID","Title","Owner","Domain","Status"],
          rows: rows.map(p => ({
            cells: [SC.esc(p.id||p.procedureId||""), SC.esc(p.title||""), SC.esc(p.owner||""), SC.esc(p.domain||""), SC.renderBadge(p.status||"draft")],
            data: p,
          })),
          onRowClick: p => SC.openModal({ title: p.title||"Procedure", body: `<div class="def-list" style="display:block">${p.description ? `<p style="margin-bottom:var(--space-4)">${mdToHtml(p.description)}</p>` : ""}${SC.renderDefList(Object.fromEntries(Object.entries(p).filter(([k])=>k!=="description")))}</div>` }),
          emptyMessage: "No procedures",
        });
      }
      tabsEl.innerHTML = tabs.map(t => `<button class="tab-btn${t===activeTab?" active":""}" data-tab="${t}">${t}</button>`).join("");
      tabsEl.addEventListener("click", e => { const b = e.target.closest(".tab-btn"); if (!b) return; activeTab = b.dataset.tab; tabsEl.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x.dataset.tab===activeTab)); render(); });
      render();
    })();
  </script>
</body>
</html>
